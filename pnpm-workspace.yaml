packages:
  - .

overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  postcss@<8.5.18: ^8.5.18
  svgo: ^4.1.0
  fast-uri: ^3.1.6
  undici@7: ^7.29.0
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.18
  browserslist: ^4.28.7

auditConfig:
  ignoreGhsas:
    # brace-expansion ReDoS (GHSA-mh99-v99m-4gvg). The only exploitable version in
    # the tree, 5.0.7, is overridden to >=5.0.8 above (the real fix). pnpm audit also
    # flags brace-expansion 1.1.16 because it collapses this advisory's multiple
    # per-major ranges into a single "<=5.0.7"; 1.1.16 is above the 1.x fix (1.1.12)
    # and is not affected. That 1.x copy is pulled only by minimatch@3, which is
    # incompatible with brace-expansion 5.x (5.x's CommonJS build exports an object,
    # not a callable), so it cannot be bumped. This ignore silences that false positive.
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  '@defra/hapi-secure-context': true
  '@defra/hapi-tracing': true
  esbuild: true
