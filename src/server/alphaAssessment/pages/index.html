  placeholder: renderPlaceholder,
};

/* section types that do not require a content/data file */
const NO_CONTENT_TYPES = { placeholder: true };
function renderSection(band, section, payload, helpers) {
  const fn = RENDERERS[section.type];
  if (!fn) {
    console.warn(`[GLW] Unknown section type "${section.type}" for "${section.id}"`);
    band.innerHTML = comingSoon(section.title);
    return;
  }
  // if a data/content file was expected but missing, degrade gracefully:
  // show the section heading plus a "Content coming soon" placeholder
  // rather than an empty interactive frame, and warn. Placeholder-type
  // sections legitimately have no content file, so they skip this check.
  const expectedMissing =
    (section.content && payload.content == null && !payload.body) ||
    (section.data && payload.data == null);
  if (expectedMissing && section.type !== "hero" && !NO_CONTENT_TYPES[section.type]) {
    console.warn(`[GLW] Section "${section.id}" content is missing or malformed; showing placeholder.`);
    band.innerHTML = comingSoon(section.title);
    return;
  }
  fn(band, section, payload, helpers);
}

window.__glw.renderSection=renderSection;

/* viz.js */
(function(){

/* ============================================================
   GLW DISCOVERY - interactive visualisations
   Attaches behaviour to DOM produced by sections.js, reading the
   per-section JSON stashed in data-* attributes. All animation is
   suppressed under reduced motion, with static fallbacks.
   ============================================================ */

let REDUCE = false;
function initViz(opts) {
  REDUCE = !!(opts && opts.reduce);
  initCountUps();
  initFrictionBars();
  initJourneys();
  initEcosystem();
  initMatrix();
  initArchDiagram();
  initApiRouter();
  initObservations();
  initPanelGroups();
  initFigModal();
}

/* ---------------- diagram lightbox ----------------
   Wide source diagrams are unreadable inline, so a block link can open
   one over the page instead. Fit to width on open, click to jump to
   full size and pan. Escape or the backdrop closes it, focus returns
   to the button that opened it, and the page behind cannot scroll. */
function initFigModal() {
  const triggers = [].slice.call(document.querySelectorAll("[data-figmodal]"));
  if (!triggers.length) return;

  const root = document.createElement("div");
  root.className = "figmodal";
  root.hidden = true;
  root.innerHTML = `
    <div class="figmodal-back" data-close></div>
    <div class="figmodal-box" role="dialog" aria-modal="true" aria-label="Diagram">
      <div class="figmodal-bar">
        <span class="figmodal-cap"></span>
        <button type="button" class="figmodal-zoom" aria-pressed="false">Full size</button>
        <button type="button" class="figmodal-x" data-close aria-label="Close diagram">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="figmodal-view">
        <p class="figmodal-load" role="status">
          <span class="figmodal-spin" aria-hidden="true"></span>
          <span class="figmodal-load-t"></span>
        </p>
        <img alt="" />
      </div>
    </div>`;
  document.body.appendChild(root);

  const box = root.querySelector(".figmodal-box");
  const view = root.querySelector(".figmodal-view");
  const img = root.querySelector("img");
  const cap = root.querySelector(".figmodal-cap");
  const zoom = root.querySelector(".figmodal-zoom");
  const loadTxt = root.querySelector(".figmodal-load-t");
  let opener = null;

  /* The diagrams are megabytes; on a slow line the pane sat empty and
     white long enough to read as broken. Hold a status line until the
     image loads or fails. */
  function setLoad(state) {
    view.classList.toggle("is-loading", state === "loading");
    view.classList.toggle("is-error", state === "error");
    if (state === "loading") loadTxt.textContent = "Loading diagram…";
    if (state === "error") loadTxt.textContent = "The diagram could not be loaded.";
  }

  /* Ignore events that arrive after close() clears the src. */
  img.addEventListener("load", () => {
    if (!root.hidden) setLoad(null);
  });
  img.addEventListener("error", () => {
    if (!root.hidden) setLoad("error");
  });

  function setZoom(on) {
    view.classList.toggle("is-full", on);
    zoom.setAttribute("aria-pressed", String(on));
    zoom.textContent = on ? "Fit to width" : "Full size";
    if (!on) view.scrollLeft = 0;
  }

  function open(btn) {
    opener = btn;
    setLoad("loading");
    img.src = btn.getAttribute("data-figmodal") || "";
    img.alt = btn.getAttribute("data-figalt") || "";
    cap.textContent = btn.getAttribute("data-figcaption") || "";
    setZoom(false);
    root.hidden = false;
    document.body.classList.add("figmodal-open");
    zoom.focus();
    /* already in cache: no load event is coming, so clear it here */
    if (img.complete && img.naturalWidth) setLoad(null);
  }

  function close() {
    root.hidden = true;
    document.body.classList.remove("figmodal-open");
    setLoad(null);
    img.removeAttribute("src");
    if (opener) opener.focus();
    opener = null;
  }

  triggers.forEach((btn) => btn.addEventListener("click", () => open(btn)));
  root.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", close));
  zoom.addEventListener("click", () => setZoom(!view.classList.contains("is-full")));
  view.addEventListener("click", (e) => {
    if (e.target === img) setZoom(!view.classList.contains("is-full"));
  });

  document.addEventListener("keydown", (e) => {
    if (root.hidden) return;
    if (e.key === "Escape") {
      close();
      return;
    }
    if (e.key !== "Tab") return;
    /* keep tabbing inside the dialog while it is open */
    const f = [].slice
      .call(box.querySelectorAll("button"))
      .filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
}

/* ---------------- shared disclosure mechanics ----------------
   Each button owns aria-expanded and toggles the hidden state of the
   region it controls; `itemSel` names the ancestor that carries
   is-open so CSS can turn the chevron. An optional "expand all"
   mirrors their combined state so the control never lies about what
   is open. Height is animated only when motion is welcome. Drives
   both the observations accordion and collapsible panel groups. */
function bindDisclosure(btns, allBtn, itemSel) {
  const isOpen = (b) => b.getAttribute("aria-expanded") === "true";

  function setOpen(btn, open) {
    const panel = document.getElementById(btn.getAttribute("aria-controls"));
    if (!panel) return;
    btn.setAttribute("aria-expanded", String(open));
    const item = btn.closest(itemSel);
    if (item) item.classList.toggle("is-open", open);
    if (open) {
      panel.hidden = false;
      if (!REDUCE) {
        panel.style.height = "0px";
        // next frame so the start height is applied before the target
        requestAnimationFrame(() => {
          panel.style.height = panel.scrollHeight + "px";
        });
        panel.addEventListener("transitionend", function done() {
          panel.style.height = "";
          panel.removeEventListener("transitionend", done);
        });
      }
    } else if (REDUCE) {
      panel.hidden = true;
    } else {
      panel.style.height = panel.scrollHeight + "px";
      requestAnimationFrame(() => {
        panel.style.height = "0px";
      });
      panel.addEventListener("transitionend", function done() {
        panel.hidden = true;
        panel.style.height = "";
        panel.removeEventListener("transitionend", done);
      });
    }
    syncAll();
  }

  function syncAll() {
    if (!allBtn) return;
    const every = btns.filter(isOpen).length === btns.length;
    allBtn.setAttribute("aria-expanded", String(every));
    allBtn.textContent = every ? "Collapse all" : "Expand all";
  }

  btns.forEach((btn) => {
    btn.addEventListener("click", () => setOpen(btn, !isOpen(btn)));
  });

  if (allBtn) {
    allBtn.addEventListener("click", () => {
      const open = allBtn.getAttribute("aria-expanded") !== "true";
      btns.forEach((b) => setOpen(b, open));
    });
  }

  syncAll();
  return { isOpen, setOpen };
}

/* ---------------- key observations: collapsible themes ---------------- */
function initObservations() {
  document.querySelectorAll("[data-obs]").forEach((root) => {
    const btns = [].slice.call(root.querySelectorAll(".obs-btn"));
    if (!btns.length) return;
    const { isOpen, setOpen } = bindDisclosure(
      btns,
      root.querySelector("[data-obs-all]"),
      ".obs-item"
    );

    /* deep link: #theme-id opens that theme and scrolls to it */
    const openFromHash = () => {
      const id = location.hash.slice(1);
      if (!id) return;
      const btn = btns.find((b) => (b.getAttribute("aria-controls") || "") === "obs-p-" + id);
      if (btn && !isOpen(btn)) setOpen(btn, true);
    };
    openFromHash();
    window.addEventListener("hashchange", openFromHash);
  });
}

/* ---------------- panels: collapsible groups of panels ----------------
   A long panels section can declare its groups collapsible so the

/* ---------------- API & data flow: DWT ↔ DIWASS router ----------------
   Picking a destination traces the data flow and shows when the EU
   system is (and isn't) in the loop. Same markup on the front page and
   the api-flow article, so this drives both. */
function initApiRouter() {
  document.querySelectorAll(".apir").forEach((root) => {
    const data = parseData(root, "data-apir") || {};
    const routes = {};
    (data.routes || []).forEach((rt) => (routes[rt.id] = rt));
    const btns = root.querySelectorAll(".apir-route");
    const euState = root.querySelector(".apir-eu-state");
    const destName = root.querySelector(".apir-dest-name");
    const destEg = root.querySelector(".apir-dest-eg");
    const badge = root.querySelector(".apir-badge");
    const vtext = root.querySelector(".apir-verdict-text");
    const detail = root.querySelector(".apir-detail");
    const hub = root.querySelector(".apir-node.hub");
    const eu = root.querySelector(".apir-node.eu");

    function selectRoute(id) {
      const rt = routes[id];
      if (!rt) return;
      btns.forEach((b) => b.classList.toggle("active", b.getAttribute("data-id") === id));
      root.setAttribute("data-diwass", rt.diwass ? "1" : "0");
      if (destName) destName.textContent = rt.label;
      if (destEg) destEg.textContent = rt.example || "";
      if (euState) euState.textContent = rt.diwass ? "Required" : "Not required";
      if (badge) {
        badge.textContent = rt.diwass ? "EU" : "UK";
        badge.className = "apir-badge " + (rt.diwass ? "eu" : "ok");
      }
      if (vtext) vtext.textContent = rt.verdict || "";
      if (detail) detail.textContent = rt.detail || "";
    }
    function showNode(which) {
      const n = which === "eu" ? data.eu : data.hub;
      if (!n) return;
      if (badge) {
        badge.textContent = which === "eu" ? "EU" : "UK";
        badge.className = "apir-badge " + (which === "eu" ? "eu" : "ok");
      }
      if (vtext) vtext.textContent = n.label || "";
      if (detail) detail.textContent = n.detail || "";
    }

    btns.forEach((b) => b.addEventListener("click", () => selectRoute(b.getAttribute("data-id"))));
    if (hub) hub.addEventListener("click", () => showNode("hub"));
    if (eu) eu.addEventListener("click", () => showNode("eu"));

    const first = (data.routes && data.routes[0]) || null;
    if (first) selectRoute(first.id);
  });
}

function parseData(el, attr) {
  const raw = el.getAttribute(attr);
  if (!raw) return null;
  try {
    return JSON.parse(raw.replace(/&#39;/g, "'").replace(/&quot;/g, '"'));
  } catch (e) {
    console.warn("[GLW] could not parse", attr, e.message);
    return null;
  }
}

/* ---------------- count-ups ---------------- */
function initCountUps() {
  function countUp(el) {
    const target = parseFloat(el.getAttribute("data-count"));
    const dec = parseInt(el.getAttribute("data-dec") || "0", 10);
    const pre = el.getAttribute("data-prefix") || "";
    const suf = el.getAttribute("data-suffix") || "";
    const sep = el.getAttribute("data-sep") === "1";
    // format a value with the right decimals and optional thousands separators
    const fmt = (v) =>
      sep
        ? v.toLocaleString("en-GB", { minimumFractionDigits: dec, maximumFractionDigits: dec })
        : v.toFixed(dec);
    if (isNaN(target)) return;
    if (REDUCE) {
      el.textContent = pre + fmt(target) + suf;
      return;
    }
    let start = null;
    const dur = 1300;
    function step(ts) {
      if (!start) start = ts;
      const p = Math.min((ts - start) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + fmt(target * e) + suf;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = pre + fmt(target) + suf;
    }
    requestAnimationFrame(step);
  }
  const seen = new WeakSet();
  const obs = new IntersectionObserver(
    (es) => {
      es.forEach((e) => {
        if (e.isIntersecting) {
          e.target.querySelectorAll("[data-count]").forEach((n) => {
            if (!seen.has(n)) {
              seen.add(n);
              countUp(n);
            }
          });
        }
      });
    },
    { threshold: 0.4 }
  );
  document.querySelectorAll(".metrics").forEach((el) => obs.observe(el));
}

/* ---------------- journeys ---------------- */
function initJourneys() {
  document.querySelectorAll(".journey").forEach((root) => {
    const d = parseData(root, "data-journey");
    if (!d || !d.stages) return;
    const svg = root.querySelector(".j-curve");
    const stages = d.stages;
    const data = d.states || { current: [], future: [] };
    const detail = d.detail || { current: [], future: [] };
    let state = "current";
    let sel = Math.min(1, stages.length - 1);

    const bC = root.querySelector(".btn-current");
    const bF = root.querySelector(".btn-future");

    function draw(animate) {
      const W = 1000, H = 320, padL = 30, padR = 30, padT = 26, padB = 64, n = stages.length;
      const xs = stages.map((_, i) => padL + (W - padL - padR) * (i / (n - 1)));
      const y = (v) => padT + (H - padT - padB) * (1 - v / 100);
      const vals = data[state] || [];
      const color = state === "future" ? "#2f8ca6" : "#c66b3c";
      const soft = state === "future" ? "rgba(47,140,166,.16)" : "rgba(198,107,60,.16)";
      function pathFor(values) {
        let dd = "";
        for (let i = 0; i < n; i++) {
          const x = xs[i], yy = y(values[i] || 0);
          if (i === 0) dd += "M" + x + "," + yy;
          else {
            const px = xs[i - 1], py = y(values[i - 1] || 0), cx = (px + x) / 2;
            dd += " C" + cx + "," + py + " " + cx + "," + yy + " " + x + "," + yy;
          }
        }
        return dd;
      }
      const lp = pathFor(vals);
      const ap = lp + " L" + xs[n - 1] + "," + (H - padB) + " L" + xs[0] + "," + (H - padB) + " Z";
      const txtMain = "#16222e", txtMuted = "#6b7a8c";
      let sgv = "";
      sgv += `<line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#c8d4e2"/>`;
      sgv += `<path d="${ap}" fill="${soft}"/>`;
      sgv += `<path d="${lp}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" ${animate && !REDUCE ? 'class="jline"' : ""}/>`;
      for (let i = 0; i < n; i++) {
        const isSel = i === sel;
        const lbl = String(stages[i]);
        sgv += `<g class="jpt" data-i="${i}" tabindex="0" role="button" aria-label="${lbl}" style="cursor:pointer">`;
        sgv += `<rect x="${xs[i] - 46}" y="${padT}" width="92" height="${H - padT - padB}" fill="transparent"/>`;
        sgv += `<circle cx="${xs[i]}" cy="${y(vals[i] || 0)}" r="${isSel ? 10 : 6}" fill="${isSel ? color : "#f8fafd"}" stroke="${color}" stroke-width="3"/>`;
        sgv += `<text x="${xs[i]}" y="${H - padB + 24}" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="${isSel ? txtMain : txtMuted}">${i + 1}</text>`;
        sgv += `<text x="${xs[i]}" y="${H - padB + 42}" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="${isSel ? txtMain : txtMuted}" font-weight="${isSel ? 600 : 400}">${lbl}</text>`;
        sgv += `</g>`;
      }
      svg.innerHTML = sgv;
      svg.querySelectorAll(".jpt").forEach((g) => {
        const pick = () => {
          sel = parseInt(g.getAttribute("data-i"), 10);
          draw(false);
          update();
        };
        g.addEventListener("click", pick);
        g.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            pick();
          }
        });
      });
      if (animate && !REDUCE) {
        const ln = svg.querySelector(".jline");
        if (ln && ln.getTotalLength) {
          const L = ln.getTotalLength();
          ln.style.strokeDasharray = L;
          ln.style.strokeDashoffset = L;
          ln.getBoundingClientRect();
          ln.style.transition = "stroke-dashoffset 1s ease";
          ln.style.strokeDashoffset = "0";
        }
      }
    }
    function update() {
      const c = (detail.current && detail.current[sel]) || {};
      const f = (detail.future && detail.future[sel]) || {};
      setText(root, ".jd-left-stg", c.stage || stages[sel]);
      setText(root, ".jd-left-p", c.pain || "");
      setText(root, ".jd-right-stg", f.stage || stages[sel]);
      setText(root, ".jd-right-p", f.opportunity || "");
    }

    if (bC)
      bC.addEventListener("click", () => {
        state = "current";
        bC.classList.add("on");
        bC.setAttribute("aria-pressed", "true");
        bF.classList.remove("on", "future");
        bF.setAttribute("aria-pressed", "false");
        draw(true);
      });
    if (bF)
      bF.addEventListener("click", () => {
        state = "future";
        bF.classList.add("on", "future");
        bF.setAttribute("aria-pressed", "true");
        bC.classList.remove("on");
        bC.setAttribute("aria-pressed", "false");
        draw(true);
      });

    let drawn = false;
    const obs = new IntersectionObserver(
      (es) => {
        es.forEach((e) => {
          if (e.isIntersecting && !drawn) {
            drawn = true;
            draw(true);
            update();
          }
        });
      },
      { threshold: 0.25 }
    );
    obs.observe(svg);
  });
}

/* ---------------- ecosystem node-link map ---------------- */
function initEcosystem() {
  document.querySelectorAll(".eco").forEach((root) => {
    const d = parseData(root, "data-eco");
    if (!d || !d.nodes) return;
    const svg = root.querySelector(".eco-svg");
    const nodes = d.nodes;
    const edges = d.edges || [];
    const byId = {};
    nodes.forEach((n) => (byId[n.id] = n));

    const flowColor = { material: "#3568a8", data: "#2f8ca6", money: "#d8a13a" };
    const flowDash = { material: "", data: "6 5", money: "2 6" };
    const kindFill = { actor: "#f8fafd", system: "#e6edf5", loop: "#fbe5d8" };
    const kindStroke = { actor: "#3568a8", system: "#2f8ca6", loop: "#c66b3c" };

    let s = "";
    // edges first (under nodes)
    edges.forEach((e, i) => {
      const a = byId[e.from], b = byId[e.to];
      if (!a || !b) return;
      const col = flowColor[e.flow] || "#6b7a8c";
      const dash = flowDash[e.flow] || "";
      s += `<g class="eco-edge" data-from="${e.from}" data-to="${e.to}" data-i="${i}">`;
      s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="1.8" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
      s += `</g>`;
    });
    // nodes
    nodes.forEach((n) => {
      const w = Math.max(64, String(n.label).length * 7 + 22);
      const h = 34;
      s += `<g class="eco-node" data-id="${n.id}" tabindex="0" role="button" aria-label="${escapeXml(n.label)}">`;
      s += `<rect class="node-body" x="${n.x - w / 2}" y="${n.y - h / 2}" width="${w}" height="${h}" rx="8" fill="${kindFill[n.kind] || "#f8fafd"}" stroke="${kindStroke[n.kind] || "#3568a8"}" stroke-width="${n.kind === "loop" ? 2 : 1.5}"/>`;
      s += `<text x="${n.x}" y="${n.y + 4}" text-anchor="middle" fill="#16222e">${escapeXml(n.label)}</text>`;
      s += `</g>`;
    });
    svg.innerHTML = s;

    const ec = root.querySelector(".ec");
    const h3 = root.querySelector(".eco-h");
    const p = root.querySelector(".eco-p");

    function focusNode(id) {
      const n = byId[id];
      if (!n) return;
      const connected = new Set([id]);
      svg.querySelectorAll(".eco-edge").forEach((g) => {
        const from = g.getAttribute("data-from"), to = g.getAttribute("data-to");
        const hot = from === id || to === id;
        g.classList.toggle("hot", hot);
        g.classList.toggle("dim", !hot);
        if (hot) {
          connected.add(from);
          connected.add(to);
        }
      });
      svg.querySelectorAll(".eco-node").forEach((g) => {
        g.classList.toggle("dim", !connected.has(g.getAttribute("data-id")));
      });
      if (ec) ec.textContent = (n.kind || "node") + " detail";
      if (h3) h3.textContent = n.label;
      if (p) p.textContent = n.detail || "";
    }
    function clearFocus() {
      svg.querySelectorAll(".eco-edge,.eco-node").forEach((g) => g.classList.remove("dim", "hot"));
    }

    svg.querySelectorAll(".eco-node").forEach((g) => {
      const id = g.getAttribute("data-id");
      g.addEventListener("mouseenter", () => focusNode(id));
      g.addEventListener("focus", () => focusNode(id));
      g.addEventListener("click", () => focusNode(id));
      g.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          focusNode(id);
        }
      });
    });
    svg.addEventListener("mouseleave", clearFocus);
  });
}

      s += `<g class="dotpt" data-i="${i}" tabindex="0" role="button" aria-label="${escapeXml(o.title)}">`;
      s += `<circle cx="${cx}" cy="${cy}" r="13" fill="${fill}" stroke="#0f1a28" stroke-width="2"/>`;
      s += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0f1a28" font-weight="700" pointer-events="none">${i + 1}</text>`;
      s += `</g>`;
    });
    svg.innerHTML = s;

    const code = root.querySelector(".opp-code");
    const title = root.querySelector(".opp-title");
    const desc = root.querySelector(".opp-desc");
    const rec = root.querySelector(".opp-rec");
    function sel(i) {
      svg.querySelectorAll(".dotpt").forEach((g, gi) => g.classList.toggle("sel", gi === i));
      const o = opps[i];
      if (code) code.textContent = o.code || `Opportunity ${i + 1}`;

      if (desc) desc.textContent = o.desc || "";
      if (rec) rec.textContent = o.rec || d.priorityNote || "";

    svg.querySelectorAll(".dotpt").forEach((g) => {
      const pick = () => sel(parseInt(g.getAttribute("data-i"), 10));
      g.addEventListener("click", pick);
      g.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          pick();
        }
      });
    });
    sel(0);
  });
}

function parseFrontmatter(raw) {
  const m = /^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/.exec(raw);
  if (!m) return { data: {}, body: raw };
  const body = m[2] || "";
  const lines = m[1].split("\n").filter((l) => l.trim() !== "");
  const data = {};

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const kv = /^([A-Za-z0-9_]+):\s*(.*)$/.exec(line.trim());
    if (!kv) { i++; continue; }
    const key = kv[1];
    const val = kv[2];

    if (val !== "") {
      data[key] = unquote(val);
      i++;
      continue;
    }

    // value empty → a nested list follows (indented "- " lines)
    const list = [];
    i++;
    let current = null;
    while (i < lines.length) {
      const l = lines[i];
      const indent = l.length - l.trimStart().length;
      const t = l.trim();
      if (indent === 0) break; // back to top-level key
      if (t.startsWith("- ")) {
        const rest = t.slice(2);
        const itemKv = /^([A-Za-z0-9_]+):\s*(.*)$/.exec(rest);
        if (itemKv) {
          current = {};
          current[itemKv[1]] = unquote(itemKv[2]);
          list.push(current);
        } else {
          list.push(unquote(rest));
          current = null;
        }
      } else {
        // continuation property of the current object list item
        const propKv = /^([A-Za-z0-9_]+):\s*(.*)$/.exec(t);
        if (propKv && current) current[propKv[1]] = unquote(propKv[2]);
      }
      i++;
    }
    data[key] = list;
  }
  return { data, body };
}

/* ---- inline emphasis marker: [[text]] → leaf-accent span ---- */
function emphasise(str) {
  if (str == null) return "";
  return String(str).replace(/\[\[(.+?)\]\]/g, '<span class="em">$1</span>');
}

/* ---- build the sticky nav rail from enabled sections ----
   Ungrouped sections become plain links; each consecutive run of
   one group becomes a button that discloses a panel listing the
   group's sections. Numbers follow site.json order, the same index
   the section-body kickers use. */
function buildRail(site, sections) {
  const railNav = document.getElementById("railNav");
  if (!railNav) return;
  const groups = {};
  (site.groups || []).forEach((g) => (groups[g.id] = g.label));
  const num = (i) => String(i + 1).padStart(2, "0");
  const chev =
    '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const frag = document.createDocumentFragment();

  /* a registry may declare a link back to its parent page (the appendix
     does); it leads the rail so the way back is always the first stop */
  if (site.backLink && site.backLink.href) {
    const back = document.createElement("a");
    back.className = "rail-back";
    back.href = site.backLink.href;
    const arrow = document.createElement("span");
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "←";
    back.appendChild(arrow);
    back.appendChild(document.createTextNode(" " + (site.backLink.label || "Back")));
    frag.appendChild(back);
  }

  let i = 0;
  while (i < sections.length) {
    const s = sections[i];
    if (!s.group) {
      const a = document.createElement("a");
      a.className = "rail-link";
      a.href = `#${s.id}`;
      a.dataset.spy = s.id;
      a.innerHTML = `<span class="n">${num(i)}</span> ${s.nav}`;
      frag.appendChild(a);
      i++;
      continue;
    }
    const gid = s.group;
    const run = [];
    while (i < sections.length && sections[i].group === gid) {
      run.push({ s: sections[i], n: num(i) });
      i++;
    }
    const label = groups[gid] || gid;
    const wrap = document.createElement("div");
    wrap.className = "rail-group";
    wrap.innerHTML = `<button type="button" class="rail-group-btn" aria-expanded="false" aria-controls="rail-panel-${gid}">${label} <span class="count">${run.length}</span>${chev}</button>
      <div class="rail-panel" id="rail-panel-${gid}">
        <div class="rp-head">${label} · ${run.length} section${run.length === 1 ? "" : "s"}</div>
        <ul class="rp-list">${run
          .map(
            (r) =>
              `<li><a href="#${r.s.id}" data-spy="${r.s.id}"><span class="n">${r.n}</span><span class="t">${r.s.nav}</span></a></li>`
          )
          .join("")}</ul>
      </div>`;
    frag.appendChild(wrap);
  }
  railNav.appendChild(frag);
}

/* ---- grouped nav: disclosure panels (hover, click, keyboard) ----
   Disclosure-navigation pattern: buttons with aria-expanded and
   plain links, no menu roles and no Tab trap. Hover open/close only
   on fine-pointer devices; touch gets click-toggle. */
function initRailMenu() {
  const nav = document.getElementById("railNav");
  if (!nav) return;
  const groups = [].slice.call(nav.querySelectorAll(".rail-group"));
  if (!groups.length) return;
  const HOVER = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  let openGroup = null;

  function setOpen(g, on) {
    g.classList.toggle("open", on);
    g.querySelector(".rail-group-btn").setAttribute("aria-expanded", on ? "true" : "false");
  }
  function close(refocus) {
    if (!openGroup) return;
    const g = openGroup;
    openGroup = null;
    setOpen(g, false);
    document.removeEventListener("click", onOutside, true);
    document.removeEventListener("keydown", onKey, true);
    if (refocus) g.querySelector(".rail-group-btn").focus();
  }
  function open(g) {
    if (openGroup === g) return;
    if (openGroup) {
      setOpen(openGroup, false);
    } else {
      document.addEventListener("click", onOutside, true);
      document.addEventListener("keydown", onKey, true);
    }
    openGroup = g;
    setOpen(g, true);
  }
  function onOutside(e) {
    if (openGroup && !openGroup.contains(e.target)) close(false);
  }
  function panelLinks(g) {
    return [].slice.call(g.querySelectorAll(".rp-list a"));
  }
  function onKey(e) {
    if (!openGroup) return;
    if (e.key === "Escape") {
      e.preventDefault();
      close(true);
      return;
    }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "Home" && e.key !== "End") return;
    if (!openGroup.contains(document.activeElement)) return;
    const links = panelLinks(openGroup);
    if (!links.length) return;
    e.preventDefault();
    let idx = links.indexOf(document.activeElement);
    if (e.key === "Home") idx = 0;
    else if (e.key === "End") idx = links.length - 1;
    else if (e.key === "ArrowDown") idx = idx < 0 ? 0 : (idx + 1) % links.length;
    else idx = idx <= 0 ? links.length - 1 : idx - 1;
    links[idx].focus();
  }

  groups.forEach((g) => {
    const btn = g.querySelector(".rail-group-btn");

    btn.addEventListener("click", () => {
      if (openGroup === g) close(false);
      else open(g);
    });
    btn.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" && openGroup !== g) {
        e.preventDefault();
        open(g);
        const first = panelLinks(g)[0];
        if (first) first.focus();
      }
    });

    // choosing a section closes the panel; native anchor scroll runs
    g.addEventListener("click", (e) => {
      if (e.target.closest(".rp-list a")) close(false);
    });

    // close when keyboard focus moves past the group (no Tab trap)
    g.addEventListener("focusout", (e) => {
      if (openGroup === g && (!e.relatedTarget || !g.contains(e.relatedTarget))) close(false);
    });

    if (HOVER) {
      let openT = null;
      let closeT = null;
      g.addEventListener("pointerenter", () => {
        clearTimeout(closeT);
        openT = setTimeout(() => open(g), 80);
      });
      g.addEventListener("pointerleave", () => {
        clearTimeout(openT);
        closeT = setTimeout(() => {
          if (openGroup === g) close(false);
        }, 250);
      });
    }
  });
}

/* ---- scroll-spy ---- */
function initScrollSpy() {
  const links = [].slice.call(document.querySelectorAll(".rail nav a"));
  const groups = [].slice.call(document.querySelectorAll(".rail nav .rail-group"));
  const obs = new IntersectionObserver(
    (entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const id = e.target.id;
          links.forEach((a) => {
            const on = a.dataset.spy === id;
            a.classList.toggle("active", on);
            if (on) a.setAttribute("aria-current", "true");
            else a.removeAttribute("aria-current");
          });
          groups.forEach((g) => {
            g.querySelector(".rail-group-btn").classList.toggle("active", !!g.querySelector("a.active"));
          });
        }
      });
    },
    { rootMargin: "-45% 0px -50% 0px" }
  );
  links.forEach((a) => {
    const sec = document.getElementById(a.dataset.spy);
    if (sec) obs.observe(sec);
  });
}

/* ---- reveals ---- */
function initReveals() {
  const els = document.querySelectorAll(".reveal");
  if (REDUCE) {
    els.forEach((el) => el.classList.add("in"));
    return;
  }
  const obs = new IntersectionObserver(
    (entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          obs.unobserve(e.target);
        }
      });
    },
    { threshold: 0.12 }
  );
  els.forEach((el) => obs.observe(el));
}

/* ---- load one section's content payload ---- */
async function loadSectionPayload(s) {
  const payload = { content: null, body: "", data: null };
  if (s.content) {
    const raw = await fetchText(s.content);
    if (s.content.endsWith(".md")) {
      const fm = parseFrontmatter(raw);
      payload.content = fm.data;
      payload.body = fm.body;
    } else {
      payload.content = JSON.parse(raw);
    }
  }
  if (s.data) payload.data = await fetchJson(s.data);
  return payload;
}

/* ---- main boot ---- */
async function boot() {
  const root = document.getElementById("sections");
  let site;
  try {
    site = await fetchJson(REGISTRY);
  } catch (e) {
    console.error(`[GLW] Could not load ${REGISTRY}:`, e.message);
    if (root) {
      root.innerHTML =
        `<section class="band dark"><div class="wrap"><div class="placeholder"><span class="ph-lab">Configuration missing</span>Could not load content/${REGISTRY}. Serve the site over HTTP (see README) rather than opening the file directly.</div></div></section>`;
    }
    return;
  }

  // brand text in rail
  const bm = document.querySelector(".rail .bm");
  if (bm) {
    bm.textContent = site.title;
  }
  document.title = `${site.title} · ${site.subtitle || "Discovery"}`;

  const enabled = (site.sections || []).filter((s) => s.enabled !== false);
  buildRail(site, enabled);
  initRailMenu();
  initScrollReturn();

  // render each section; one failure degrades to a placeholder
  for (let i = 0; i < enabled.length; i++) {
    const s = enabled[i];
    const band = document.createElement("section");
    band.className = `band ${i % 2 === 0 ? "dark" : "light"}`;
    band.id = s.id;
    root.appendChild(band);

    let payload = { content: null, body: "", data: null };
    try {
      payload = await loadSectionPayload(s);
    } catch (e) {
      console.warn(`[GLW] Section "${s.id}" content problem:`, e.message);
    }
    try {
      renderSection(band, s, payload, { emphasise });
    } catch (e) {
      console.warn(`[GLW] Section "${s.id}" failed to render:`, e.message);
      band.innerHTML = placeholderHTML(s.title);
    }

    applySectionNumber(band, String(i + 1).padStart(2, "0"));

    // provisional sections carry a "To be validated" badge (deck chip)
    if (s.status === "to-be-validated") {
      const badge = document.createElement("span");
      badge.className = "tbv-badge";
      badge.title = "This content is provisional and not yet validated";
      badge.textContent = "To be validated";
      band.insertBefore(badge, band.firstChild);
    }
  }

  // footer
  buildFooter(site);

  // wire interactions after DOM is in place
  initScrollSpy();
  initReveals();
  initViz({ reduce: REDUCE });
  restoreScrollPosition();
}

/* ---- return-visit scroll restoration ----
   Sections render after load, so the browser cannot restore scroll on
   back/forward by itself, and #section links from the sub-pages point
   at elements that do not exist yet at load time. Once rendering is
   done, jump instantly to the saved position (back/forward/reload) or
   to the requested section. */
function initScrollReturn() {
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("pagehide", () => {
    try {
      sessionStorage.setItem("glw-scroll-y", String(window.scrollY));
    } catch (e) {
      /* storage unavailable: nothing to save */
    }
  });
}

function restoreScrollPosition() {
  const instant = (fn) => {
    const root = document.documentElement;
    root.style.scrollBehavior = "auto";
    fn();
    root.style.scrollBehavior = "";
  };
  const nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
  const returning = nav && (nav.type === "back_forward" || nav.type === "reload");
  let saved = NaN;
  try {
    if (returning) saved = Number(sessionStorage.getItem("glw-scroll-y"));
  } catch (e) {
    /* storage unavailable: fall through to the hash */
  }
  let apply = null;
  if (returning && Number.isFinite(saved)) {
    apply = () => instant(() => window.scrollTo(0, saved));
  } else if (location.hash) {
    const el = document.getElementById(location.hash.slice(1));
    if (el) apply = () => instant(() => el.scrollIntoView());
  }
  if (!apply) return;
  apply();

  // Fonts, images and vizzes keep growing the page after boot, which
  // would leave an early jump short. Re-assert the target while the
  // body is still resizing, and stop the moment the reader acts.
  let done = false;
  let ro = null;
  const cancel = () => {
    if (done) return;
    done = true;
    if (ro) ro.disconnect();
    ["wheel", "touchstart", "pointerdown", "keydown"].forEach((t) => window.removeEventListener(t, cancel));
  };
  ["wheel", "touchstart", "pointerdown", "keydown"].forEach((t) =>
    window.addEventListener(t, cancel, { passive: true })
  );
  if (window.ResizeObserver) {
    ro = new ResizeObserver(() => {
      if (!done) apply();
    });
    ro.observe(document.body);
  }
  setTimeout(cancel, 2500);
}

/* ---- order-derived section numbers, matching the nav rail ----
   The number belongs to site.json's section order, not to content
   files; any hand-written "NN / " left in a content kicker is
   stripped so numbers cannot drift or double up on reorder. */
function applySectionNumber(band, num) {
  let kick = band.querySelector(".head .kick, .problem-head .kick, .tagpill");
  if (!kick) {
    const slot = band.querySelector(".head > div, .problem-head");
    if (!slot) return;
    kick = document.createElement("span");
    kick.className = "label kick";
    slot.insertBefore(kick, slot.firstChild);
  }
  const rest = kick.innerHTML.replace(/^\s*\d{1,3}\s*\/\s*/, "").trim();
  kick.innerHTML = `<span class="knum">${num}</span>${rest ? " / " + rest : ""}`;
}

function placeholderHTML(title) {
  return `<div class="wrap"><div class="head"><div><h2>${title || "Section"}</h2></div></div><div class="placeholder"><span class="ph-lab">Content coming soon</span>This section's content has not been added yet. Drop its file into <code>content/</code> to fill it in.</div></div>`;
}

function buildFooter(site) {
  const f = document.getElementById("siteFooter");
  if (!f) return;
  f.innerHTML = `<div class="wrap">
      <h3>About this readout</h3>
      <p>An interactive discovery readout for the ${site.title} component of Defra's ${site.programme} service.</p>
      ${site.footerNote ? `<div class="illus">${site.footerNote}</div>` : ""}
      ${site.footerSources ? `<div class="src mono" style="font-size:11px;color:#7d93a9;margin-top:18px;line-height:1.9">SOURCES · ${site.footerSources}</div>` : ""}
    </div>`;
}

// expose placeholder for renderers that want it

boot();

window.__glw.placeholderHTML=placeholderHTML;
})();
</script>
