<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* assets/css/tokens.css */
/* ============================================================
   GLW DISCOVERY - design tokens
   Edit this file to change the look globally.
   Palette is semantic: colour carries meaning, not decoration.
   ============================================================ */
:root{
  /* core palette */
  --forest:#0f1a28;       /* deep warm forest, dark bands */
  --forest2:#162436;      /* lifted dark surface */
  --parchment:#eef2f7;    /* warm parchment, light bands */
  --card-light:#f8fafd;   /* lifted light surface */
  --ink:#16222e;          /* text on light */
  --cream:#dde7f0;        /* text on dark */
  --defra:#1d70b8;        /* Defra brand green - canonical (borders, brand bar, solid fills) */
  --leaf:#58a6f0;         /* Defra green, brightened for legibility on dark - brand/accent */
  --leaf-deep:#144e81;    /* Defra green, deepened for WCAG AA on light parchment (4.9:1) - brand/accent */
  --pine:#2f8ca6;         /* positive / future state */
  --clay:#c66b3c;         /* friction / pain / journey breaks (terracotta) */
  --muted-d:#92a3b5;      /* muted on dark */
  --muted-l:#56677a;      /* muted on light, darkened for WCAG AA (4.7:1) */
  --hair-d:#2a3a4e;       /* hairline on dark */
  --hair-l:#c8d4e2;       /* hairline on light */

  /* type families - official GOV.UK Helvetica/Arial stack (GDS Transport fallback) */
  --font-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;

  /* type scale */
  --fs-base:17px;
  --fs-mono-label:12px;

  /* spacing + layout */
  --maxw:1180px;
  --band-pad:96px;
  --radius:12px;
  --radius-sm:6px;

  /* status colours for blueprint storyboard stamps (semantic) */
  --status-not-started:#92a3b5;
  --status-in-progress:#3568a8;
  --status-out-of-scope:#9a8c6a;
  --status-done:#2f8ca6;
}


/* assets/css/base.css */
/* ============================================================
   GLW DISCOVERY - base layout, nav rail, focus, reveals
   ============================================================ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--forest);color:var(--cream);
  font-family:var(--font-body);font-size:var(--fs-base);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.04;letter-spacing:-.02em;margin:0}
p{margin:0 0 1em}
a{color:var(--leaf)}
.mono{font-family:var(--font-mono)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
.label{font-family:var(--font-mono);font-size:var(--fs-mono-label);letter-spacing:.18em;text-transform:uppercase}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;clip:rect(0 0 0 0);overflow:hidden;white-space:nowrap}

/* band theming via custom props */
.band{position:relative;padding:var(--band-pad) 0;scroll-margin-top:64px}
.band.dark{background:var(--forest);--fg:var(--cream);--sub:var(--muted-d);--surface:var(--forest2);--hair:var(--hair-d);--accent-num:var(--leaf);--accent-lab:var(--leaf)}
.band.light{background:var(--parchment);--fg:var(--ink);--sub:var(--muted-l);--surface:var(--card-light);--hair:var(--hair-l);--accent-num:var(--leaf-deep);--accent-lab:var(--leaf-deep)}
.band{color:var(--fg)}

/* skip + focus */
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;z-index:300;border-radius:0 0 6px 0}
.skip:focus{left:0}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:3px}

/* ---------- Defra brand bar (organisation identity, above the site nav) ---------- */
.defra-brand{background:#fff;border-bottom:2px solid var(--defra)}
/* aligns to the centred 1180px content column, same as the nav rail wrap */
.defra-brand-inner{max-width:var(--maxw);margin:0 auto;padding:12px 32px;display:flex;align-items:center}
.defra-brand-logo{display:inline-flex;align-items:center;text-decoration:none;line-height:0}
.defra-brand-logo svg{height:52px;width:auto;display:block}
@media (max-width:640px){
  .defra-brand-logo svg{height:44px}
}

/* ---------- sticky nav rail (always dark) ---------- */
.rail{position:sticky;top:0;z-index:200;background:rgba(15,26,40,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair-d)}
.rail .wrap{display:flex;align-items:center;gap:20px;height:58px}
.rail .bm{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--cream);white-space:nowrap;letter-spacing:-.01em}
.rail nav{display:flex;gap:3px;margin-left:auto;align-items:center}
.rail nav::-webkit-scrollbar{display:none}

/* top-level items: plain links + group disclosure buttons, one pill language */
.rail nav .rail-link,.rail nav .rail-group-btn{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;text-decoration:none;color:var(--muted-d);padding:6px 11px;border-radius:20px;white-space:nowrap;transition:color .15s;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.4}
.rail nav .rail-link:hover,.rail nav .rail-group-btn:hover{color:var(--cream)}
.rail nav .rail-link.active,.rail nav .rail-group-btn.active{background:var(--leaf);color:var(--forest);font-weight:500}
.rail nav .rail-link .n{opacity:.65}
.rail nav .rail-link.active .n{opacity:.85}
.rail nav .count{font-size:10px;opacity:.6}
.rail nav .chev{width:10px;height:10px;flex:none}
.rail-group.open .rail-group-btn{color:var(--cream)}
.rail-group.open .rail-group-btn.active{color:var(--forest)}

/* disclosure panel */
.rail-panel{display:none;position:absolute;z-index:210;background:var(--forest2);border:1px solid var(--hair-d);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.4);padding:8px;min-width:280px}
.rail-group.open .rail-panel{display:block}
.rail-panel .rp-head{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-d);padding:8px 10px 10px;border-bottom:1px solid var(--hair-d);margin-bottom:6px}
.rail-panel .rp-list{list-style:none;margin:0;padding:0}
.rail-panel .rp-list a{display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:7px;font-family:var(--font-mono);font-size:12.5px;text-decoration:none;color:var(--cream)}
.rail-panel .rp-list a .n{color:var(--leaf);opacity:.65;flex:none}
.rail-panel .rp-list a:hover{background:rgba(88,166,240,.1)}
.rail-panel .rp-list a.active{background:var(--leaf);color:var(--forest)}
.rail-panel .rp-list a.active .n{color:var(--forest);opacity:.85}

/* wide screens: panel drops under its own button */
@media(min-width:961px){
  .rail nav{overflow:visible}
  .rail-group{position:relative}
  .rail-group .rail-panel{top:calc(100% + 10px);left:0}
}
/* narrow screens: button row scrolls, panel is a full-width sheet under the bar */
@media(max-width:960px){
  .rail nav{overflow-x:auto;scrollbar-width:none}
  .rail-group{position:static}
  .rail-group .rail-panel{top:100%;left:0;right:0;border-radius:0 0 12px 12px;border-top:0}
}
@media(prefers-reduced-motion:no-preference){
  .rail nav .chev{transition:transform .15s}
  .rail-group-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .rail-group.open .rail-panel{animation:railPop .16s ease}
  @keyframes railPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
  .rail-group-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
}

/* ---------- section heads ---------- */
.head{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:end;margin-bottom:48px}
.head .kick{color:var(--accent-lab);margin-bottom:16px;display:block}
/* number keeps full accent colour for WCAG contrast; opacity dimming failed AA */
.kick .knum,.tagpill .knum{font-weight:600}
.head h2{font-size:clamp(30px,4.4vw,50px)}
.head .stand{color:var(--sub);font-size:16.5px;line-height:1.65;margin:0;border-left:2px solid var(--accent-lab);padding-left:22px}
@media(max-width:760px){.head{grid-template-columns:1fr;gap:18px}.head .stand{font-size:15.5px;padding-left:18px}}

/* ---------- graceful placeholder ---------- */
.placeholder{border:1px dashed var(--hair);border-radius:var(--radius);padding:40px;text-align:center;color:var(--sub);background:var(--surface)}
.placeholder .ph-lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--clay);display:block;margin-bottom:10px}

/* ---------- reveals ---------- */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ---------- footer ---------- */
footer.site-footer{background:var(--forest);color:var(--muted-d);padding:60px 0 76px;border-top:1px solid var(--hair-d)}
footer.site-footer h3{color:var(--cream);font-size:22px;margin-bottom:12px}
footer.site-footer p{font-size:13.5px;line-height:1.65;color:#9dafc2;max-width:80ch}
footer.site-footer .illus{border-left:3px solid var(--leaf);padding:11px 16px;margin-top:20px;background:var(--forest2);font-size:13px;color:#ccd7e3}

/* ---------- Defra statutory footer (Open Government Licence + Crown copyright) ----------
   Injected on every page at build time. Follows the Defra/GOV.UK branding footer,
   themed for the site's dark forest palette with the Defra-green top rule. */
.defra-footer{background:var(--forest);border-top:2px solid var(--defra);color:var(--muted-d);padding:34px 0 44px}
.defra-footer-inner{max-width:var(--maxw);margin:0 auto;padding:0 32px}
.defra-footer__nav{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--hair-d)}
.defra-footer__list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 28px}
.defra-footer__list a{font-size:14px}
.defra-footer__crown{display:block;fill:currentColor;margin:0 0 18px}
.defra-footer__meta{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px}
.defra-footer__licence{flex:1 1 340px;display:flex;align-items:flex-start;gap:12px;font-size:13.5px;line-height:1.6}
.defra-footer__licence-logo{flex:none;margin-top:3px;fill:currentColor}
.defra-footer__copyright{font-size:13.5px;white-space:nowrap}
.defra-footer a{color:var(--cream);text-decoration:underline;text-underline-offset:2px}
.defra-footer a:hover{color:var(--leaf)}
@media(max-width:640px){.defra-footer__meta{flex-direction:column;align-items:flex-start;gap:16px}}


/* assets/css/components.css */
/* ============================================================
   GLW DISCOVERY - section components + blueprint
   Carried over from the warm-green prototype, tokenised.
   ============================================================ */

/* ---------- HERO ---------- */
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.tagpill{display:inline-block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--leaf);border:1px solid var(--leaf);border-radius:20px;padding:7px 15px;margin-bottom:30px}
.hero h1{font-size:clamp(40px,6.2vw,65px);font-weight:700;letter-spacing:-.03em;line-height:1.0;max-width:15ch}
.hero h1 .em{color:var(--leaf)}
.hero .stand{color:var(--muted-d);font-size:clamp(16px,1.8vw,19px);max-width:48ch;margin-top:26px}
.hero .attr{font-family:var(--font-mono);font-size:12px;color:#758ba1;margin-top:14px;letter-spacing:.02em}
.meta{display:flex;flex-wrap:wrap;gap:38px;margin-top:42px}
.meta .label{color:var(--muted-d);font-size:11px;letter-spacing:.14em;display:block;margin-bottom:7px}
.meta .v{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--cream)}
.sig{position:relative}
.sig svg{width:100%;height:auto;display:block;overflow:visible}
.sig .cap{font-family:var(--font-mono);font-size:15px;color:var(--muted-d);text-align:right;margin:0 0 0 auto;letter-spacing:.03em;max-width:54ch}
.sig .cap b{color:var(--clay)}
@media(max-width:860px){.hero .grid{grid-template-columns:1fr;gap:30px}.sig{order:2}}

/* recycling-plant animation */
.plant-line{fill:none;stroke:var(--leaf);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plant-dim{fill:none;stroke:#5b7086;stroke-width:1.5;stroke-linecap:round}
.plant-fill{fill:#162436}
.hatch{stroke:#33475e;stroke-width:2}
.belt-move{animation:beltscroll 1.1s linear infinite}
.roller-spoke{stroke:#92a3b5;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:rollspin 2.6s linear infinite}
.item{transform-box:fill-box;animation:ride 7s linear infinite}
.item-1{animation-delay:0s}.item-2{animation-delay:-1.17s}.item-3{animation-delay:-2.33s}
.item-4{animation-delay:-3.5s}.item-5{animation-delay:-4.67s}.item-6{animation-delay:-5.83s}
.scanline{stroke:#c66b3c;stroke-width:2;animation:scan 5s ease-in-out infinite}
.fillbar{fill:var(--leaf);opacity:.45;transform-box:fill-box;transform-origin:bottom;animation:fillrise 7s ease-in-out infinite}
@keyframes ride{0%{transform:translateX(0);opacity:0}9%{opacity:1}86%{opacity:1}100%{transform:translateX(348px);opacity:0}}
@keyframes beltscroll{to{transform:translateX(-16px)}}
@keyframes rollspin{to{transform:rotate(360deg)}}
@keyframes scan{0%{opacity:0;transform:translateY(0)}8%{opacity:.9}40%{opacity:.9;transform:translateY(22px)}55%{opacity:0;transform:translateY(22px)}100%{opacity:0;transform:translateY(0)}}
@keyframes fillrise{0%{transform:scaleY(.1)}75%{transform:scaleY(1)}100%{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){
  .item,.roller-spoke,.belt-move,.scanline,.fillbar{animation:none}
  .item{opacity:1}.fillbar{transform:scaleY(1)}
  .item-1{transform:translateX(0)}.item-2{transform:translateX(58px)}.item-3{transform:translateX(116px)}
  .item-4{transform:translateX(174px)}.item-5{transform:translateX(232px)}.item-6{transform:translateX(290px)}
}

/* ---------- metrics strip ---------- */
.problem-intro{max-width:62ch;margin-bottom:44px;color:var(--sub)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr)}
.metrics .m{padding:6px 30px 6px 0;border-left:1px solid var(--hair);padding-left:26px}
.metrics .m:first-child{border-left:0;padding-left:0}
.metrics .m .num{font-family:var(--font-display);font-weight:700;font-size:clamp(38px,5vw,62px);line-height:1;color:var(--accent-num);letter-spacing:-.03em}
.metrics .m.warn .num{color:var(--clay)}
.metrics .m .lab{font-size:16px;color:var(--sub);margin-top:14px;line-height:1.4;max-width:22ch}
.metrics .m .src{display:block;font-family:var(--font-mono);font-style:italic;font-size:13px;color:var(--sub);margin-top:16px;letter-spacing:.02em}
@media(max-width:820px){.metrics{grid-template-columns:1fr 1fr;gap:34px 0}.metrics .m:nth-child(3){border-left:0;padding-left:0}}
@media(max-width:460px){.metrics{grid-template-columns:1fr;gap:30px 0}.metrics .m{border-left:0;padding-left:0}}

/* ---------- persona / theme cards ---------- */
.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:48px}
.pc{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:22px 20px}
.pc h3{font-size:19px;margin-bottom:6px}
.pc .who{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);margin-bottom:12px}
.pc p{font-size:16px;color:var(--sub);margin:0;line-height:1.5}
@media(max-width:760px){.personas{grid-template-columns:1fr}}

/* ---------- friction chart + quote ---------- */
.frik{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin:14px 0 56px}
.frik .chart{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:24px 24px 16px}
.frik .ct{font-family:var(--font-mono);font-size:12px;color:var(--sub);margin-bottom:14px;letter-spacing:.02em}
.bar-row{display:flex;align-items:center;gap:14px;padding:9px 0;cursor:pointer;border:none;background:none;width:100%;text-align:left;font:inherit;color:inherit}
.bar-row .bl{flex:0 0 160px;font-size:14px;line-height:1.2}
.bar-row .track{flex:1;height:22px;background:rgba(0,0,0,.07);border-radius:5px;position:relative;overflow:hidden}
.band.dark .bar-row .track{background:rgba(255,255,255,.07)}
.bar-row .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-lab);opacity:.55;border-radius:5px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar-row .pct{flex:0 0 40px;text-align:right;font-family:var(--font-mono);font-size:13px;color:var(--sub)}
.bar-row[aria-pressed="true"] .bl{font-weight:600}
.bar-row[aria-pressed="true"] .fill{background:var(--clay);opacity:1}
.bar-row:hover .fill{opacity:.8}
@media(prefers-reduced-motion:reduce){.bar-row .fill{transition:none}}
.frik .quote{background:var(--forest2);color:var(--cream);border:1px solid var(--hair-d);border-radius:12px;padding:28px;display:flex;flex-direction:column;justify-content:center}
.band.light .frik .quote{background:var(--forest)}
.frik .quote .qlab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);margin-bottom:10px}
.frik .quote h3{font-size:24px;color:var(--cream);margin-bottom:14px}
.frik .quote blockquote{border-left:3px solid var(--clay);margin:0;padding-left:16px;font-size:16px;line-height:1.5;color:#dee6f0}
.frik .quote .who{font-family:var(--font-mono);font-size:11px;color:var(--muted-d);margin-top:14px;letter-spacing:.02em}
.frik .quote .illus{font-family:var(--font-mono);font-size:9.5px;color:#607488;margin-top:16px;border-top:1px solid var(--hair-d);padding-top:11px;letter-spacing:.06em;text-transform:uppercase}

/* themes */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.theme{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:24px 26px}
.theme .tg{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--clay)}
.theme h3{font-size:19px;margin:9px 0 9px}
.theme p{font-size:16px;color:var(--sub);margin:0;line-height:1.5}
@media(max-width:740px){.frik{grid-template-columns:1fr}.themes{grid-template-columns:1fr}}

/* ---------- constraints / risks / dependencies ---------- */
.constraint-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cgroup{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:8px 0 6px}
.cgroup > .cg-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-lab);padding:14px 22px 6px}
.cgroup ul{list-style:none;margin:0;padding:0}
.citem{padding:14px 22px;border-top:1px solid var(--hair)}
.citem .ci-top{display:flex;align-items:baseline;gap:9px}
.citem h3{font-size:16px;margin:0;line-height:1.3}
.citem p{font-size:13.5px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.rag{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--muted-l)}
.rag.green{background:var(--pine)}
.rag.amber{background:#d8a13a}
.rag.red{background:var(--clay)}
@media(max-width:820px){.constraint-groups{grid-template-columns:1fr}}

/* ---------- blueprint-link preview (main page) ---------- */
.bp-link{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.bp-link .bp-strip{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:18px;overflow:hidden}
.bp-link .bp-strip-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.bp-link .bp-cellmini{border:1px solid var(--hair);border-radius:6px;padding:10px 8px;font-size:11px;color:var(--sub);min-height:54px}
.bp-link .bp-cellmini .s{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);display:block;margin-bottom:5px}
.bp-link .blurb p{color:var(--sub);font-size:16px}

/* stacked variant: full-width blurb, no side strip (policy preview) */
.bp-link--stack{display:block}
.bp-link--stack .blurb{max-width:none}
/* sequence chain (governing instruments, service blueprint) */
.seq-chain{display:flex;align-items:stretch;gap:0;margin:24px 0 28px}
.seq-chain .seq-node{flex:1 1 0;display:flex;flex-direction:column;gap:9px;border:1px solid var(--hair);border-top:2px solid var(--accent-lab);border-radius:10px;background:var(--surface);padding:16px 16px 18px}
.seq-chain .seq-tier{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-lab)}
.seq-chain .seq-name{font-size:15px;line-height:1.35;color:var(--fg)}
.seq-chain .seq-arrow{flex:0 0 auto;align-self:center;padding:0 12px;font-size:18px;line-height:1;color:var(--accent-lab)}
@media(max-width:760px){
  .seq-chain{flex-direction:column}
  .seq-chain .seq-arrow{padding:8px 0;transform:rotate(90deg)}
}
/* numbered variant: a wrapping grid, for journeys too long for one row */
.seq-chain--grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.seq-chain--grid .seq-node{position:relative;gap:7px;padding-top:14px}
.seq-chain--grid .seq-num{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent-lab)}
@media(max-width:760px){.seq-chain--grid{grid-template-columns:1fr}}
/* blueprint preview: numbered stage cards, tone-shaded by where the
   regulatory controls sit, so the legend describes something visible */
.bps-grid{list-style:none;margin:0 0 20px;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bps-node{display:flex;flex-direction:column;gap:7px;border:1px solid var(--hair);border-radius:10px;
  background:var(--surface);padding:16px 18px 18px}
.bps-node.is-control{border-color:transparent;background:var(--leaf-deep);color:#fff}
.band.dark .bps-node.is-control{background:var(--pine)}
.bps-n{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent-lab)}
.bps-label{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.25;color:var(--fg)}
.bps-body{font-size:14px;line-height:1.5;color:var(--sub);margin:0}
.bps-actors{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;line-height:1.5;
  color:var(--sub);margin-top:auto;padding-top:8px;border-top:1px solid var(--hair)}
.bps-node.is-control .bps-n{color:rgba(255,255,255,.75)}
.bps-node.is-control .bps-label{color:#fff}
.bps-node.is-control .bps-body{color:rgba(255,255,255,.92)}
.bps-node.is-control .bps-actors{color:rgba(255,255,255,.75);border-top-color:rgba(255,255,255,.25)}
.bps-node.is-control .em{color:#fff;font-style:italic}
.bps-legend{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-wrap:wrap;gap:10px 26px}
.bps-key{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.5;color:var(--sub);max-width:52ch}
.bps-swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;margin-top:4px;
  border:1px solid var(--hair);background:var(--surface)}
.bps-key.is-control .bps-swatch{background:var(--leaf-deep);border-color:transparent}
.band.dark .bps-key.is-control .bps-swatch{background:var(--pine)}
.bps-exc{margin:22px 0 0;padding-left:14px;border-left:2px solid var(--clay)}
.bps-exc-lab{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--clay);font-weight:600;margin-bottom:6px}
.bps-exc p{margin:0;font-size:14.5px;line-height:1.6;color:var(--sub)}
.bps-says{list-style:none;margin:26px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bps-says li{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.3;color:var(--fg);
  border-top:2px solid var(--accent-lab);padding-top:12px}
.bps-says + .btn{margin-top:28px}
@media(max-width:640px){.bps-grid,.bps-says{grid-template-columns:1fr}}
/* preview sub-headings and inline note */
.blurb .bp-sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-lab);font-weight:600;margin:26px 0 10px}
.blurb .bp-sub:first-child{margin-top:0}
.blurb .bp-note{margin:14px 0 0;padding-left:14px;border-left:2px solid var(--accent-pine,var(--accent-lab));
  font-size:15px;line-height:1.6;color:var(--sub)}
/* pain-points ownership tiles */
.pp-strip{display:flex;gap:10px;margin:24px 0 28px}
.pp-strip .pp-tile{flex:1 1 0;display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);border-top:2px solid var(--accent-lab);border-radius:10px;background:var(--surface);padding:14px 12px 16px}
.pp-strip .pp-count{font-family:var(--font-mono);font-size:22px;line-height:1;color:var(--accent-lab)}
.pp-strip .pp-label{font-size:13px;line-height:1.3;color:var(--fg)}
@media(max-width:760px){
  .pp-strip{flex-wrap:wrap}
  .pp-strip .pp-tile{flex:1 1 calc(50% - 5px)}
}
/* overlaps preview: two regimes meeting at export */
.ov-meet{display:flex;align-items:stretch;gap:0;margin:24px 0 12px}
.ov-meet .ov-regime{flex:1 1 0;display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);border-top:2px solid var(--accent-lab);border-radius:10px;background:var(--surface);padding:16px 18px}
.ov-meet .ov-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-lab)}
.ov-meet .ov-rname{font-size:15px;line-height:1.3;color:var(--fg);font-weight:600}
.ov-meet .ov-rsub{font-size:13px;color:var(--sub)}
.ov-meet .ov-join{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.ov-meet .ov-join-line{width:1px;flex:1 1 0;background:var(--hair)}
.ov-meet .ov-join-txt{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);max-width:96px;text-align:center;line-height:1.3}
/* overlaps preview: quantified population stats */
.ov-stats{display:flex;gap:10px;margin:12px 0 28px}
.ov-stats .ov-stat{flex:1 1 0;display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);padding:14px 14px 16px}
.ov-stats .ov-val{font-family:var(--font-mono);font-size:22px;line-height:1.05;color:var(--accent-lab)}
.ov-stats .ov-slabel{font-size:13px;line-height:1.3;color:var(--fg)}
@media(max-width:760px){
  .ov-meet{flex-direction:column}
  .ov-meet .ov-join{flex-direction:row;padding:10px 0}
  .ov-meet .ov-join-line{width:auto;height:1px}
  .ov-stats{flex-wrap:wrap}
  .ov-stats .ov-stat{flex:1 1 calc(50% - 5px)}
}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;text-decoration:none;background:var(--leaf-deep);color:#fff;padding:13px 22px;border-radius:8px;border:none;cursor:pointer;transition:background .15s}
.band.dark .btn{background:var(--leaf);color:var(--forest)}
.btn:hover{filter:brightness(1.06)}
@media(max-width:760px){.bp-link{grid-template-columns:1fr}}

/* inline link block (e.g. pain points from Users section) */
.users-painlink{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:34px;padding:22px 24px;
  border:1px solid var(--hair);border-radius:12px;background:var(--surface)}
.users-painlink p{margin:0;color:var(--sub);font-size:16px;flex:1;min-width:240px}

/* ---------- journeys ---------- */
.j-toggle{display:inline-flex;border:1px solid var(--hair);border-radius:30px;overflow:hidden}
.j-toggle button{font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;padding:9px 18px;background:transparent;border:none;cursor:pointer;color:var(--sub)}
.j-toggle button.on{background:var(--ink);color:var(--parchment)}
.band.dark .j-toggle button.on{background:var(--cream);color:var(--forest)}
.j-toggle button.on.future{background:var(--pine);color:#fff}
.j-wrap{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:22px 16px 8px;margin-top:22px}
.j-curve{width:100%;height:auto;display:block}
.j-detail{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;padding:0 8px 6px}
.jd{border:1px solid var(--hair);border-radius:10px;padding:18px 20px;background:var(--parchment)}
.band.dark .jd{background:var(--forest)}
.jd.pain{border-left:4px solid var(--clay)}
.jd.opp{border-left:4px solid var(--pine)}
.jd .h{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.jd.pain .h{color:var(--clay)}
.jd.opp .h{color:var(--pine)}
.jd .stg{font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:6px}
.jd p{font-size:16px;color:var(--sub);margin:0}
.j-hint{font-family:var(--font-mono);font-size:13px;color:var(--sub);padding:0 8px 12px;margin-top:4px}
@media(max-width:640px){.j-detail{grid-template-columns:1fr}}

/* ---------- ecosystem node-link map ---------- */
.eco{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;align-items:start}
.eco-wrap{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:10px}
.eco-svg{width:100%;height:auto;display:block}
.eco-node{cursor:pointer}
.eco-node .node-body{transition:fill .15s,stroke .15s}
.eco-node text{pointer-events:none;font-family:var(--font-mono);font-size:11px}
.eco-node.dim{opacity:.28}
.eco-edge{transition:opacity .15s,stroke-width .15s}
.eco-edge.dim{opacity:.12}
.eco-edge.hot{opacity:1}
.eco-d{position:sticky;top:78px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:22px 24px;min-height:140px}
.eco-d .ec{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab)}
.eco-d h3{font-size:21px;margin:8px 0 9px}
.eco-d p{font-size:16px;color:var(--sub);margin:0}
.eco-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-family:var(--font-mono);font-size:11px;color:var(--sub)}
.eco-legend span{display:inline-flex;align-items:center;gap:6px}
.eco-legend i{width:18px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block}
.eco-legend .material i{border-top-color:var(--leaf-deep)}
.eco-legend .data i{border-top-color:var(--pine);border-top-style:dashed}
.eco-legend .money i{border-top-color:#d8a13a;border-top-style:dotted}
@media(max-width:820px){.eco{grid-template-columns:1fr}.eco-d{position:static}}

/* ---------- opportunity matrix ---------- */
.mx{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:start}
.mx-wrap{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:10px}
.mx-svg{width:100%;height:auto;display:block}
.dotpt{cursor:pointer}
.dotpt circle{transition:r .12s}
.dotpt:hover circle,.dotpt.sel circle{stroke:var(--fg);stroke-width:2.5}
.opp-d{position:sticky;top:78px}
.opp-d .oc{font-family:var(--font-mono);font-size:12px;color:var(--accent-lab);letter-spacing:.05em}
.opp-d h3{font-size:24px;margin:9px 0 11px}
.opp-d p{font-size:16px;color:var(--sub)}
.opp-d .rec{border-top:1px solid var(--hair);margin-top:14px;padding-top:14px}
.opp-d .rec .h{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--pine);margin-bottom:6px}
.opp-d .rec p{font-size:16px;color:var(--fg);margin:0;font-weight:500}
@media(max-width:820px){.mx{grid-template-columns:1fr}.opp-d{position:static}}

/* ---------- roadmap ---------- */
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.phase{border:1px solid var(--hair);border-radius:12px;background:var(--surface);overflow:hidden}
.phase .pt{padding:18px 22px;border-bottom:1px solid var(--hair)}
.phase .pn{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-lab)}
.phase h3{font-size:20px;margin:8px 0 3px}
.phase .dur{font-family:var(--font-mono);font-size:11.5px;color:var(--sub)}
.phase ul{margin:0;padding:16px 22px 20px;list-style:none}
.phase li{font-size:16px;color:var(--sub);padding:8px 0 8px 20px;position:relative;border-bottom:1px dotted var(--hair)}
.phase li:last-child{border-bottom:0}
.phase li::before{content:"";position:absolute;left:0;top:14px;width:8px;height:8px;border:1.5px solid var(--accent-lab);border-radius:2px}
@media(max-width:780px){.road{grid-template-columns:1fr}}

/* ---------- "To be validated" badge ----------
   Mirrors the deck's grey "TO BE VALIDATED" chip. Sits top-right of the
   band (deck placement). Band-aware via the inherited --fg/--hair tokens. */
.tbv-badge{position:absolute;top:22px;right:32px;z-index:2;
  font-family:var(--font-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
  color:var(--clay);background:var(--surface);border:1.5px solid var(--clay);border-radius:5px;
  padding:8px 14px;white-space:nowrap}
@media(max-width:760px){.tbv-badge{position:static;display:inline-block;margin:0 32px 14px;top:auto;right:auto}}

/* ---------- kv-table (deck-style two-column table) ---------- */
.kv-table{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--surface)}
.kv-row{display:grid;grid-template-columns:minmax(180px,260px) 1fr;border-bottom:1px solid var(--hair)}
.kv-row:last-child{border-bottom:0}
.kv-key{padding:18px 22px;font-family:var(--font-display);font-weight:600;font-size:16px;color:#fff;background:var(--leaf-deep);display:flex;align-items:center}
.band.dark .kv-key{background:var(--pine)}
.kv-val{padding:18px 24px;font-size:16px;line-height:1.6;color:var(--fg);display:flex;align-items:center}
.kv-val .em{color:var(--accent-lab);font-weight:500}
@media(max-width:640px){.kv-row{grid-template-columns:1fr}.kv-key{padding-bottom:10px}}
.kv-btn{margin-top:20px}

/* ---------- card-grid (deck-style titled cards) ---------- */
.card-grid{display:grid;grid-template-columns:repeat(var(--cg-cols,3),1fr);gap:16px}
.cg-card{position:relative;border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:24px 24px;border-top:3px solid var(--accent-lab)}
.cg-card .cg-index{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:rgba(29,112,184,.14);color:var(--accent-lab);font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:12px}
.band.dark .cg-card .cg-index{background:rgba(88,166,240,.18)}
.cg-card h3{font-size:18px;margin-bottom:9px;line-height:1.25}
.cg-card p{font-size:16px;color:var(--sub);margin:0;line-height:1.55}
@media(max-width:900px){.card-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.card-grid{grid-template-columns:1fr}}

/* ---------- recommendations (recommendation -> evidence -> policy outcomes) ---------- */
.rec-list{list-style:none;margin:0;padding:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--surface);counter-reset:none}
/* column header, shown on wide screens only */
.rec-head{display:grid;grid-template-columns:64px minmax(0,1.15fr) minmax(0,1.35fr) minmax(0,0.9fr);gap:0;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--leaf-deep);border-radius:12px 12px 0 0;margin-bottom:-1px;position:relative;z-index:1}
.band.dark .rec-head{background:var(--pine)}
.rec-head>span{padding:12px 20px}
.rec-head .rec-h-ref{padding-left:20px}
.rec-row{display:grid;grid-template-columns:64px minmax(0,1.15fr) minmax(0,1.35fr) minmax(0,0.9fr);border-bottom:1px solid var(--hair)}
.rec-row:last-child{border-bottom:0}
.rec-ref{padding:22px 12px 22px 20px;display:flex;justify-content:center}
.rec-ref span{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;
  background:rgba(53,104,168,.14);color:var(--accent-lab);font-family:var(--font-display);font-weight:700;font-size:14px}
.band.dark .rec-ref span{background:rgba(111,163,216,.18)}
.rec-rec{padding:22px 20px;font-size:14.5px;line-height:1.55;color:var(--fg);font-weight:500}
.rec-rec .em{color:var(--accent-lab)}
.rec-ev{padding:22px 20px;font-size:13.5px;line-height:1.6;color:var(--sub)}
.rec-ev .em{color:var(--accent-lab)}
.rec-out{padding:22px 20px}
.rec-out-lab{display:none;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:10px}
.rec-out ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rec-outcome{display:block;font-size:12.5px;line-height:1.35;color:var(--accent-lab);text-decoration:none;
  padding:7px 11px;border:1px solid var(--hair);border-left:3px solid var(--leaf-deep);border-radius:6px;background:transparent;transition:background .15s ease,border-color .15s ease}
.band.dark .rec-outcome{border-left-color:var(--leaf)}
a.rec-outcome:hover{background:rgba(53,104,168,.08);border-color:var(--leaf-deep)}
.band.dark a.rec-outcome:hover{background:rgba(111,163,216,.10);border-color:var(--leaf)}
a.rec-outcome:focus-visible{outline:2px solid var(--accent-lab);outline-offset:2px}
@media(max-width:820px){
  .rec-head{display:none}
  .rec-row{grid-template-columns:1fr;gap:0}
  .rec-ref{padding:20px 22px 0;justify-content:flex-start}
  .rec-rec{padding:12px 22px 6px;font-size:16px}
  .rec-ev{padding:6px 22px 14px}
  .rec-out{padding:0 22px 22px}
  .rec-out-lab{display:block}
  .rec-out ul{flex-direction:row;flex-wrap:wrap}
  .rec-outcome{flex:0 1 auto}
}

/* ---------- data table (multi-column section table) ---------- */
.data-table-wrap{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--surface)}
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#fff;
  background:var(--leaf-deep);text-align:left;padding:13px 16px;vertical-align:middle}
.band.dark .data-table th{background:var(--pine)}
.data-table td{padding:14px 16px;border-top:1px solid var(--hair);vertical-align:top;color:var(--fg);line-height:1.55}
.data-table td .em{color:var(--accent-lab)}
.data-table ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.data-table li{position:relative;padding-left:14px;font-size:13.5px;line-height:1.45;color:var(--sub)}
.data-table li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--accent-lab)}
.data-table tr.dt-empty td{text-align:center;color:var(--sub);font-style:italic;padding:30px 16px}
.data-table tr.dt-group td{background:rgba(53,104,168,.07);border-top:2px solid var(--accent-lab);
  font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.4;color:var(--fg);padding:14px 16px}
.band.dark .data-table tr.dt-group td{background:rgba(111,163,216,.09)}
.data-table tr.dt-group td .em{color:var(--accent-lab)}
@media(max-width:640px){.data-table,.data-table thead,.data-table tbody,.data-table th,.data-table td,.data-table tr{display:block}
  .data-table thead{display:none}
  .data-table td{border-top:0;border-bottom:1px solid var(--hair);padding:10px 16px}
  .data-table td::before{content:attr(data-col);display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);margin-bottom:5px}
  .data-table tr{border-bottom:2px solid var(--hair);padding:6px 0}}

/* ---------- figure (lead text, embedded diagram, strip, callout) ---------- */
.fig-lead{max-width:74ch;font-size:16.5px;line-height:1.6;color:var(--sub);margin:0 0 14px}
.fig-lead.is-strong{color:var(--fg);font-weight:600;font-size:18px}
.fig-lead .em{color:var(--accent-lab)}
.fig-strip{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:8px 0 24px}
.fig-step{flex:1 1 150px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.fig-sn{font-family:var(--font-display);font-weight:600;font-size:14px;line-height:1.25;color:var(--fg)}
.fig-sb{font-size:12.5px;line-height:1.45;color:var(--sub)}
.fig-arrow{align-self:center;color:var(--accent-lab);font-size:16px;flex:0 0 auto}
.fig-media{margin:6px 0 0}
.fig-media .fig-media-view{border:1px solid var(--hair);border-radius:12px;background:var(--surface);overflow:hidden}
.fig-media.is-scroll .fig-media-view{overflow-x:auto}
.fig-media img{display:block;max-width:100%}
.fig-media.is-scroll img{max-width:none;height:auto;width:auto;min-width:100%}
.fig-media figcaption{font-family:var(--font-mono);font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6}
.fig-media figcaption a{color:var(--accent-lab)}
.fig-callout{margin:26px 0 0;border-radius:12px;background:var(--leaf-deep);color:#fff;padding:22px 26px}
.band.dark .fig-callout{background:var(--pine)}
.fig-callout h3{font-size:19px;margin:0 0 12px;line-height:1.3;color:#fff}
.fig-callout h3 .em{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.fig-callout ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.fig-callout li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.94)}
.fig-callout li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7)}
.fig-callout li .em{color:#fff;font-style:italic}
.fig-src{display:inline-block;margin-top:16px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.02em;color:#fff;text-decoration:underline;text-underline-offset:3px}
.fig-src:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:640px){.fig-strip{flex-direction:column}.fig-arrow{transform:rotate(90deg)}}
/* labelled prose blocks under a figure */
.fig-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px;margin-top:30px}
.fig-block{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:24px 26px 26px}
.fig-blab{font-size:18px;line-height:1.3;margin:0 0 12px;color:var(--fg)}
.fig-block p{max-width:70ch;font-size:15px;line-height:1.6;color:var(--sub);margin:0 0 12px}
.fig-block p:last-of-type{margin-bottom:0}
.fig-block .em{color:var(--accent-lab);font-weight:600}
.fig-value{margin:16px 0 0;padding-left:14px;border-left:2px solid var(--accent-lab)}
.fig-vlab{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-lab);font-weight:600;margin-bottom:6px}
.fig-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.fig-link{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;
  color:var(--accent-lab);text-decoration:none;border:1px solid var(--hair);border-radius:20px;padding:8px 14px}
.fig-link:hover{border-color:var(--accent-lab)}
.fig-link:focus-visible{outline:2px solid var(--accent-lab);outline-offset:2px}
.fig-tbc{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);
  border:1px solid var(--hair);border-radius:10px;padding:2px 7px}
.fig-blocks + .btn{margin-top:26px}
.bp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}
.bp-actions .btn{margin-top:0}
button.fig-link{font:inherit;font-family:var(--font-mono);font-size:12px;cursor:pointer;background:none}
.fig-expand{width:12px;height:12px;flex:0 0 auto}
/* diagram lightbox */
body.figmodal-open{overflow:hidden}
.figmodal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.figmodal[hidden]{display:none}
.figmodal-back{position:absolute;inset:0;background:rgba(8,16,12,.82)}
.figmodal-box{position:relative;display:flex;flex-direction:column;width:min(1600px,100%);max-height:100%;
  background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.figmodal-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.figmodal-cap{flex:1 1 auto;min-width:0;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent-lab);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.figmodal-zoom{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-lab);background:none;border:1px solid var(--hair);border-radius:20px;padding:6px 14px;cursor:pointer}
.figmodal-zoom:hover,.figmodal-x:hover{border-color:var(--accent-lab)}
.figmodal-x{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:0 0 auto;
  color:var(--fg);background:none;border:1px solid var(--hair);border-radius:50%;cursor:pointer}
.figmodal-x svg{width:12px;height:12px}
.figmodal-zoom:focus-visible,.figmodal-x:focus-visible{outline:2px solid var(--accent-lab);outline-offset:2px}
.figmodal-view{flex:1 1 auto;overflow:auto;background:#fff;padding:14px}
.figmodal-view img{display:block;width:100%;height:auto;cursor:zoom-in}
.figmodal-view.is-full img{width:auto;max-width:none;cursor:zoom-out}
/* the diagrams are multi-MB, so the pane would sit blank while one
   downloads; swap in a status line until it loads or fails */
.figmodal-load{display:none;align-items:center;justify-content:center;gap:10px;min-height:min(320px,42vh);margin:0;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-l)}
.figmodal-view.is-loading .figmodal-load,.figmodal-view.is-error .figmodal-load{display:flex}
.figmodal-view.is-loading img,.figmodal-view.is-error img{display:none}
.figmodal-spin{width:15px;height:15px;flex:0 0 auto;border:2px solid var(--hair-l);border-top-color:var(--leaf-deep);
  border-radius:50%;animation:figspin .8s linear infinite}
@keyframes figspin{to{transform:rotate(360deg)}}
/* no spinner under reduced motion; the wording carries the state */
@media(prefers-reduced-motion:reduce){.figmodal-spin{display:none}}
@media(max-width:640px){.figmodal{padding:10px}.figmodal-cap{display:none}}
@media(max-width:640px){.fig-blocks{grid-template-columns:1fr}}

/* ---------- key observations (collapsible themes) ---------- */
.obs{border:1px solid var(--hair);border-radius:12px;background:var(--surface);overflow:hidden}
.obs-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--hair)}
.obs-count{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.obs-all{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);
  background:none;border:1px solid var(--hair);border-radius:20px;padding:6px 14px;cursor:pointer}
.obs-all:hover{border-color:var(--accent-lab)}
.obs-all:focus-visible,.obs-btn:focus-visible{outline:2px solid var(--accent-lab);outline-offset:-2px}
.obs-item{border-bottom:1px solid var(--hair)}
.obs-item:last-child{border-bottom:0}
.obs-h{margin:0;font-size:inherit;font-weight:inherit}
.obs-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:16px;
  background:none;border:0;padding:20px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.obs-btn:hover{background:rgba(53,104,168,.05)}
.band.dark .obs-btn:hover{background:rgba(111,163,216,.07)}
.obs-n{font-family:var(--font-mono);font-size:12px;color:var(--accent-lab);padding-top:3px}
.obs-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.obs-title{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.3;color:var(--fg)}
.obs-insight{font-size:14px;line-height:1.5;color:var(--sub)}
.obs-insight .em{color:var(--accent-lab)}
.obs-chev{width:14px;height:14px;color:var(--accent-lab);margin-top:6px;transition:transform .25s ease}
.obs-item.is-open .obs-chev{transform:rotate(180deg)}
.obs-panel{overflow:hidden;transition:height .3s cubic-bezier(.2,.7,.2,1)}
.obs-inner{padding:0 20px 24px 56px}
.obs-await{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:0}
.obs-o{margin-bottom:22px}
.obs-o:last-child{margin-bottom:0}
.obs-o h4{font-size:15.5px;margin:0 0 10px;line-height:1.35;color:var(--fg)}
.obs-o h4 .em,.obs-points .em{color:var(--accent-lab);font-weight:600}
.obs-o > p{font-size:14px;color:var(--sub);margin:0 0 10px;line-height:1.6}
.obs-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.obs-points > li{position:relative;padding-left:18px;font-size:14px;line-height:1.6;color:var(--sub)}
.obs-points > li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent-lab)}
.obs-sub{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.obs-sub li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.5}
.obs-sub li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--sub)}
.obs-q{margin:0 0 18px;border-left:3px solid var(--clay);padding-left:16px;font-size:14.5px;line-height:1.55;color:var(--fg)}
.obs-q cite{display:block;font-family:var(--font-mono);font-size:11px;font-style:normal;color:var(--sub);margin-top:8px}
.obs-imp{border-top:1px solid var(--hair);padding-top:14px;margin-top:18px}
.obs-imp-lab{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-lab);margin-bottom:7px}
.obs-imp p{margin:0;font-size:14.5px;line-height:1.6;color:var(--fg)}
@media(prefers-reduced-motion:reduce){.obs-panel{transition:none}.obs-chev{transition:none}}
@media(max-width:640px){.obs-inner{padding-left:20px}.obs-btn{padding:16px}}

/* contexts: same rules, different contexts */
.obs-ctx{margin:26px 0 22px;border-top:1px solid var(--hair);padding-top:20px}
.octx-h{font-size:16px;margin:0 0 4px;line-height:1.3}
.octx-stand{font-size:13.5px;color:var(--sub);margin:0 0 16px}
.octx-cols{display:grid;grid-template-columns:repeat(var(--octx-cols,3),1fr);gap:14px;align-items:start}
.octx-col{border:1px solid var(--hair);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.octx-head{padding:12px 14px;border-bottom:1px solid var(--hair)}
.octx-lab{display:block;font-family:var(--font-display);font-weight:600;font-size:14px;line-height:1.25}
.octx-meta{display:block;font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.4}
.octx-body{padding:12px 14px;flex:1}
.octx-body ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.octx-body li{position:relative;padding-left:14px;font-size:12.5px;line-height:1.45;color:var(--sub)}
.octx-body li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.octx-g{margin-bottom:14px}
.octx-g:last-child{margin-bottom:0}
.octx-glab{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.octx-quote{margin:0;padding:11px 14px;border-top:1px solid var(--hair);font-size:12px;line-height:1.5;font-style:italic;color:var(--sub)}
.octx-quote::before{content:"“"}
.octx-quote::after{content:"”"}
.octx-verdict{padding:11px 14px;border-top:1px solid var(--hair);background:rgba(0,0,0,.03)}
.band.dark .octx-verdict{background:rgba(255,255,255,.04)}
.octx-vlab{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.octx-vbody{display:block;font-size:12px;line-height:1.45;color:var(--sub)}
/* semantic tone: pine = works well, terracotta = friction/risk, muted = neutral */
.octx-col.tone-positive{border-color:var(--pine)}
.octx-col.tone-positive .octx-head{border-bottom-color:var(--pine)}
.octx-col.tone-positive .octx-vlab{color:var(--pine)}
.octx-col.tone-caution{border-color:var(--clay)}
.octx-col.tone-caution .octx-head{border-bottom-color:var(--clay)}
.octx-col.tone-caution .octx-vlab{color:var(--clay)}
.octx-col.tone-neutral .octx-vlab{color:var(--sub)}
.octx-shapers{margin-top:14px;border:1px solid var(--hair);border-radius:10px;padding:13px 15px}
.octx-slab{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:10px}
.octx-shapers ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.octx-shapers li{font-size:12px;line-height:1.35;color:var(--sub);border:1px solid var(--hair);border-radius:6px;padding:6px 10px}
.octx-snote{margin:12px 0 0;font-size:12.5px;line-height:1.5;color:var(--sub)}
.octx-snote .em{color:var(--accent-lab)}
/* flow: per-step detail list */
.oflow-items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.oflow-items li{position:relative;padding-left:12px;font-size:11px;line-height:1.4;color:var(--sub)}
.oflow-items li::before{content:"";position:absolute;left:0;top:6px;width:3px;height:3px;border-radius:50%;background:var(--accent-lab)}
@media(max-width:860px){.octx-cols{grid-template-columns:1fr}}

/* flow: where the chain is digital and where it drops to paper */
.obs-flow{margin:26px 0 22px;border-top:1px solid var(--hair);padding-top:20px}
.oflow-h{font-size:16px;margin:0 0 4px;line-height:1.3}
.oflow-stand{font-size:13.5px;color:var(--sub);margin:0 0 18px}
.oflow-chain{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:6px}
.oflow-cap{flex:0 0 auto;display:flex;align-items:center;text-align:center;border:1px dashed var(--accent-lab);border-radius:8px;
  padding:10px 12px;max-width:120px}
.oflow-cap span{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);line-height:1.4}
.oflow-step{flex:1 0 130px;border:1px solid var(--hair);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;background:transparent}
.oflow-step.is-friction{border-color:var(--clay)}
.oflow-n{font-family:var(--font-mono);font-size:10px;color:var(--accent-lab)}
.oflow-name{font-family:var(--font-display);font-weight:600;font-size:13px;line-height:1.25}
.oflow-body{font-size:11.5px;line-height:1.45;color:var(--sub)}
.oflow-arrow{align-self:center;color:var(--accent-lab);font-size:14px;flex:0 0 auto}
.oflow-note{font-size:12.5px;color:var(--sub);margin:14px 0 0;line-height:1.5}
.oflow-note .em{color:var(--accent-lab)}
.oflow-panels{display:grid;grid-template-columns:repeat(var(--ofp-cols,3),1fr);gap:14px;margin-top:18px}
.oflow-panel{border:1px solid var(--hair);border-radius:10px;padding:14px}
.oflow-panel.tone-caution{border-color:var(--clay)}
.ofp-lab{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);margin-bottom:10px}
.oflow-panel.tone-caution .ofp-lab{color:var(--clay)}
.oflow-panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.oflow-panel li{position:relative;padding-left:14px;font-size:12.5px;line-height:1.45;color:var(--sub)}
.oflow-panel li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.oflow-panel li .em{color:var(--clay);font-weight:600}
@media(max-width:860px){.oflow-panels{grid-template-columns:1fr}}

/* ---------- taxonomy (lead finding, then stacked tiers) ---------- */
.tx-finding{background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--accent-lab);border-radius:12px;padding:22px 26px;margin-bottom:26px}
.tx-finding h3{font-size:19px;margin:0 0 14px;line-height:1.3}
.tx-finding ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tx-finding li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--sub)}
.tx-finding li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent-lab)}
.tx-finding .em{color:var(--accent-lab);font-weight:600}
.tx-tiers{display:flex;flex-direction:column;align-items:stretch}
.tx-arrow{text-align:center;color:var(--accent-lab);font-size:20px;line-height:1;padding:8px 0}
.tx-tier{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:16px 18px 18px}
.tx-tier.is-lead{border-color:var(--accent-lab);box-shadow:inset 0 2px 0 var(--accent-lab)}
.tx-tlab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-lab);text-align:center;margin-bottom:14px}
.tx-items{display:grid;grid-template-columns:repeat(var(--tx-cols,3),1fr);gap:12px}
.tx-item{border:1px solid var(--hair);border-radius:8px;padding:12px 14px;background:transparent;display:flex;flex-direction:column;gap:6px}
.tx-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.25;color:var(--fg)}
.tx-body{font-size:12.5px;line-height:1.45;color:var(--sub)}
@media(max-width:900px){.tx-items{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.tx-items{grid-template-columns:1fr 1fr}}

/* ---------- panels (titled panels: bullet lists and/or count tables) ---------- */
.panels{display:grid;grid-template-columns:repeat(var(--pn-cols,2),1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:22px 24px 24px}
.panel .pn-label{font-size:18px;margin:0 0 4px;line-height:1.25}
.panel .pn-intro{font-size:13px;color:var(--sub);margin:10px 0 0;line-height:1.55;font-weight:500}
.panel ul{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.panel li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--sub)}
.panel li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent-lab)}
.panel li .em{color:var(--accent-lab);font-weight:600}
.panel .pn-intro .em{color:var(--accent-lab)}
.panel .pn-body{font-size:15px;color:var(--sub);margin:10px 0 0;line-height:1.6}
.panel .pn-body .em{color:var(--accent-lab);font-weight:600}
/* labelled bands of panels stacked down one section */
.pn-groups{display:flex;flex-direction:column;gap:36px}
.pn-glab{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-lab);font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.pn-gintro{font-size:15px;color:var(--sub);margin:-4px 0 16px;line-height:1.6;max-width:74ch}
/* collapsible variant: the group label becomes the disclosure button */
.pn-groups.is-collapsible{gap:0}
.pn-bar{display:flex;justify-content:flex-end;margin-bottom:8px}
.pn-all{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab);
  background:none;border:1px solid var(--hair);border-radius:20px;padding:6px 14px;cursor:pointer}
.pn-all:hover{border-color:var(--accent-lab)}
.pn-all:focus-visible,.pn-gbtn:focus-visible{outline:2px solid var(--accent-lab);outline-offset:-2px}
.pn-gh{margin:0;font-size:inherit;font-weight:inherit}
.pn-gbtn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;
  border-bottom:1px solid var(--hair);padding:16px 4px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.pn-gbtn:hover{background:rgba(53,104,168,.05)}
.band.dark .pn-gbtn:hover{background:rgba(111,163,216,.07)}
.pn-glab-t{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-lab);font-weight:600}
.pn-gcount{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--sub)}
.pn-gchev{width:14px;height:14px;color:var(--accent-lab);flex:0 0 auto;transition:transform .25s ease}
.pn-group.is-open .pn-gchev{transform:rotate(180deg)}
.pn-gpanel{overflow:hidden;transition:height .3s cubic-bezier(.2,.7,.2,1)}
.pn-ginner{padding:22px 0 34px}
@media(prefers-reduced-motion:reduce){.pn-gpanel{transition:none}.pn-gchev{transition:none}}
.pt-cap{font-size:12.5px;color:var(--sub);margin:20px 0 8px;line-height:1.5}
.pn-table{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
.pn-table th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-lab);
  text-align:left;padding:7px 10px;border-bottom:1px solid var(--hair)}
.pn-table th:last-child,.pn-table td:last-child{text-align:right}
.pn-table td{padding:7px 10px;border-bottom:1px solid var(--hair);color:var(--fg)}
.pn-table tbody tr:last-child td{border-bottom:1px solid var(--hair)}
.pn-table tfoot td{font-weight:600;color:var(--fg);border-bottom:0;padding-top:9px}
@media(max-width:820px){.panels{grid-template-columns:1fr}.pn-groups{gap:28px}}

/* ---------- appendix link (preview of what the appendix holds) ---------- */
.apx-groups{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:4px 0 24px}
.apx-group{border-left:2px solid var(--hair);padding-left:16px}
.apx-glab{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-lab);margin-bottom:10px}
.apx-group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.apx-group li{font-size:14.5px;line-height:1.45;color:var(--sub)}
.apx-group li::before{content:"·";color:var(--accent-lab);margin-right:8px}
@media(max-width:640px){.apx-groups{grid-template-columns:1fr;gap:20px}}

/* rail: link back to the parent page (appendix -> readout) */
.rail-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;
  color:var(--muted-d);text-decoration:none;padding:6px 12px;margin-right:6px;border:1px solid var(--hair-d);border-radius:20px;white-space:nowrap}
.rail-back:hover{color:var(--leaf);border-color:var(--leaf)}
.rail-back:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

/* shared small note under a section body */
.section-note{font-family:var(--font-mono);font-size:14px;color:var(--sub);margin-top:18px;line-height:1.7;font-style:normal}

/* problem section: single-column header so the statement reads as a lead
   line directly under the H1, not a detached right-column caption */
.problem-head{margin-bottom:40px;max-width:62ch}
.problem-head .kick{color:var(--accent-lab);margin-bottom:16px;display:block}
.problem-head h2{font-size:clamp(30px,4.4vw,50px);margin-bottom:20px}
.problem-lead{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.4vw,27px);
  line-height:1.3;letter-spacing:-.01em;color:var(--fg);margin:0;max-width:24ch}
.problem-lead .em{color:var(--accent-lab)}
@media(max-width:760px){.problem-lead{font-size:20px;max-width:none}}

/* ============================================================
   AS-IS ARCHITECTURE - front-page diagram + reuse
   Interactive tiered map of the DWT estate. Theme-agnostic: uses
   the band-scoped custom props so it reads on dark and light bands.
   ============================================================ */
.arch-intro{max-width:74ch;margin-bottom:34px}
.arch-intro p{color:var(--sub);font-size:16px;line-height:1.7;margin:0 0 14px}
.arch-intro p:last-child{margin-bottom:0}
.arch-intro .em{color:var(--accent-lab);font-weight:500}

/* diagram + live detail panel */
.arch{display:grid;grid-template-columns:1.35fr .65fr;gap:26px;align-items:start}
.arch-stage{border:1px solid var(--hair);border-radius:14px;background:var(--surface);padding:20px 20px 16px}
.arch-grid{display:flex;flex-direction:column;gap:14px}
.arch-tier{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px dashed var(--hair);position:relative}
.arch-tier:last-child{border-bottom:none;padding-bottom:0}
.arch-tier-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.arch-nodes{display:flex;flex-wrap:wrap;gap:8px}

.arch-node{position:relative;display:inline-flex;align-items:center;gap:8px;font:inherit;text-align:left;cursor:pointer;
  background:transparent;color:var(--fg);border:1px solid var(--hair);border-left:3px solid var(--muted-d);
  border-radius:8px;padding:9px 13px;font-size:13.5px;line-height:1.2;transition:border-color .15s,background .15s,transform .15s}
.arch-node .an-label{font-weight:500}
.arch-node:hover,.arch-node:focus-visible{background:rgba(88,166,240,.10);transform:translateY(-1px)}
.arch-node.active{background:rgba(88,166,240,.14)}
/* kind accents (semantic left border) */
.arch-node.gov{border-left-color:var(--leaf-deep)}
.arch-node.stream{border-left-color:var(--clay)}
.arch-node.iface{border-left-color:var(--pine)}
.arch-node.backend{border-left-color:var(--muted-d)}
.arch-node.platform{border-left-color:#b98b4a}
.arch-node.person{border-left-color:#6c5c99}
/* reuse candidates: full leaf ring + badge */
.arch-node.reuse{border-color:var(--leaf-deep);border-left-color:var(--leaf-deep);background:rgba(29,112,184,.10)}
.arch-node.reuse.active,.arch-node.reuse:hover{background:rgba(29,112,184,.18)}
.band.dark .arch-node.reuse{border-color:var(--leaf);border-left-color:var(--leaf);background:rgba(88,166,240,.12)}
.arch-badge{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--leaf-deep);border-radius:4px;padding:2px 6px;line-height:1.4}
.band.dark .arch-badge{background:var(--leaf);color:var(--forest)}

.arch-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--sub)}
.arch-legend .al{display:inline-flex;align-items:center;gap:6px}
.arch-legend .al i{width:14px;height:0;border-top:3px solid var(--muted-d);border-radius:2px}
.arch-legend .al.gov i{border-top-color:var(--leaf-deep)}
.arch-legend .al.stream i{border-top-color:var(--clay)}
.arch-legend .al.iface i{border-top-color:var(--pine)}
.arch-legend .al.backend i{border-top-color:var(--muted-d)}
.arch-legend .al.platform i{border-top-color:#b98b4a}
.arch-legend .al.person i{border-top-color:#6c5c99}

.arch-d{position:sticky;top:78px;border:1px solid var(--hair);border-radius:14px;background:var(--surface);padding:22px 24px;min-height:150px}
.arch-d .ac{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-lab)}
.arch-d h3{font-size:20px;margin:9px 0 10px;line-height:1.15}
.arch-d p{font-size:16px;color:var(--sub);margin:0;line-height:1.6}

.arch-hint{font-family:var(--font-mono);font-size:13px;color:var(--sub);margin:14px 0 0}
.arch-livelink{font-family:var(--font-mono);font-size:13px;color:var(--accent-lab);text-decoration:none;margin:8px 0 0;display:inline-block}
.arch-livelink:hover,.arch-livelink:focus-visible{text-decoration:underline}

/* reuse call-out cards */
.arch-reuse{margin-top:40px}
.arch-reuse-lead{font-family:var(--font-display);font-weight:600;font-size:clamp(18px,2vw,22px);line-height:1.35;color:var(--fg);max-width:52ch;margin:0 0 18px}
.arch-reuse-lead .em{color:var(--accent-lab)}
.arch-reuse-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.arch-reuse-card{border:1px solid var(--hair);border-top:3px solid var(--leaf-deep);border-radius:12px;background:var(--surface);padding:20px 22px}
.band.dark .arch-reuse-card{border-top-color:var(--leaf)}
.arch-reuse-card .arr-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-lab);display:block;margin-bottom:10px}
.arch-reuse-card h3{font-size:19px;margin:0 0 9px}
.arch-reuse-card p{font-size:16px;color:var(--sub);line-height:1.6;margin:0}

.arch-cta{margin-top:34px}

@media(max-width:900px){.arch{grid-template-columns:1fr}.arch-d{position:static}}
@media(max-width:620px){.arch-tier{grid-template-columns:1fr;gap:8px}.arch-reuse-grid{grid-template-columns:1fr}}

/* ============================================================
   API & DATA FLOW - front-page DWT ↔ DIWASS router + constraints
   Theme-agnostic (band vars) with fixed EU-blue / UK-green semantics.
   ============================================================ */
.apir{margin:0}
.apir-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.apir-controls-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.apir-routes{display:flex;flex-wrap:wrap;gap:8px}
.apir-route{display:inline-flex;flex-direction:column;gap:2px;font:inherit;text-align:left;cursor:pointer;
  background:transparent;color:var(--fg);border:1px solid var(--hair);border-radius:9px;padding:8px 13px;transition:border-color .15s,background .15s,transform .15s}
.apir-route .ar-name{font-size:13.5px;font-weight:500;line-height:1.15}
.apir-route .ar-eg{font-family:var(--font-mono);font-size:10px;color:var(--sub);letter-spacing:.02em}
.apir-route:hover{transform:translateY(-1px);border-color:var(--accent-lab)}
.apir-route.active{background:var(--accent-lab);border-color:var(--accent-lab);color:#fff}
.band.dark .apir-route.active{color:var(--forest)}
.apir-route.active .ar-eg{color:inherit;opacity:.8}

.apir-stage{border:1px solid var(--hair);border-radius:14px;background:var(--surface);padding:24px 22px 20px}
.apir-flow{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr) 52px minmax(0,1fr);align-items:center;gap:6px}
.apir-node{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--fg);
  background:var(--surface);border:1px solid var(--hair);border-top:3px solid var(--muted-d);border-radius:11px;padding:14px 15px;min-height:84px;justify-content:center;transition:opacity .2s,border-color .2s,box-shadow .2s}
button.apir-node{cursor:pointer}
.apir-node .apir-k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.apir-node .apir-name{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.apir-node .apir-state{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--sub)}
.apir-node.hub{border-top-color:var(--leaf-deep)}
.band.dark .apir-node.hub{border-top-color:var(--leaf)}
.apir-node.eu{border-top-color:#4a90b8}
.apir-node.dest{border-top-color:var(--clay)}

/* connector legs: muted by default, EU-blue when DIWASS is in the loop,
   dashed green (bypass) when the movement stays sovereign */
.apir-leg{position:relative;height:3px;color:var(--hair);background:currentColor;border-radius:2px}
.apir-leg::after{content:"";position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.apir[data-diwass="1"] .apir-leg{color:#4a90b8}
.apir[data-diwass="0"] .apir-leg{color:var(--leaf-deep);background:transparent;
  background-image:linear-gradient(to right,currentColor 60%,transparent 40%);background-size:11px 3px;background-repeat:repeat-x}
.band.dark .apir[data-diwass="0"] .apir-leg{color:var(--leaf)}
.apir[data-diwass="0"] .apir-node.eu{opacity:.4}

.apir-verdict{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
.apir-badge{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.06em;color:#fff;border-radius:5px;padding:4px 9px;white-space:nowrap}
.apir-badge.ok{background:var(--leaf-deep)}
.apir-badge.eu{background:#4a90b8}
.band.dark .apir-badge.ok{background:var(--leaf);color:var(--forest)}
.apir-verdict-text{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--fg)}
.apir-detail{color:var(--sub);font-size:16px;line-height:1.6;margin:12px 0 0;max-width:76ch}
.apir-hint{font-family:var(--font-mono);font-size:13px;color:var(--sub);margin:14px 0 0}

@media(max-width:760px){
  .apir-flow{grid-template-columns:1fr;gap:0}
  .apir-leg{width:3px;height:30px;justify-self:center;margin:2px 0;background:currentColor}
  .apir-leg::after{right:auto;top:auto;left:50%;bottom:-2px;transform:translateX(-50%);
    border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid currentColor;border-bottom:0}
  .apir[data-diwass="0"] .apir-leg{background-image:linear-gradient(to bottom,currentColor 60%,transparent 40%);background-size:3px 11px;background-repeat:repeat-y}
}

/* DIWASS constraint cards */
.api-constraints{margin-top:40px}
.apic-lead{font-family:var(--font-display);font-weight:600;font-size:clamp(18px,2vw,22px);line-height:1.35;color:var(--fg);max-width:60ch;margin:0 0 18px}
.apic-lead .em{color:var(--accent-lab)}
.apic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.apic-card{border:1px solid var(--hair);border-top:3px solid #4a90b8;border-radius:12px;background:var(--surface);padding:20px 22px}
.apic-card .apic-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#4a90b8;display:block;margin-bottom:10px}
.apic-card h3{font-size:18px;margin:0 0 9px;line-height:1.2}
.apic-card p{font-size:13.5px;color:var(--sub);line-height:1.6;margin:0}
@media(max-width:820px){.apic-grid{grid-template-columns:1fr}}

/* roadmap phase emphasis: current focus vs future phases */
.phase-tag{display:inline-block;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:3px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.phase-tag.focus{background:var(--pine);color:#fff}
.phase-tag.future{background:transparent;color:var(--sub);border:1px solid var(--hair)}
.phase.is-focus{border-color:var(--pine);border-width:2px;box-shadow:0 0 0 1px var(--pine)}
.phase.is-focus .pt{background:rgba(47,140,166,.14)}
.phase.is-focus .pn{color:var(--pine)}
.phase.is-future{opacity:.72}
.phase.is-future .pn{color:var(--sub)}

/* ---- ALPHA PLAN (front-page teaser: goal + timeline gantt) ---- */
.alpha-goal{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:start;
  border:1px solid var(--hair);border-left:3px solid var(--accent-lab);border-radius:12px;
  background:var(--surface);padding:24px 28px;margin-bottom:30px}
.alpha-goal .ag-side{display:flex;flex-direction:column;gap:8px}
.alpha-goal .ag-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-lab)}
.alpha-goal .ag-window{font-family:var(--font-mono);font-size:12px;color:var(--sub)}
.alpha-goal p{margin:0;font-size:18px;line-height:1.55;color:var(--fg);max-width:60ch}
.alpha-sublabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:12px}

.gantt{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:20px 22px;margin-bottom:30px}
.gantt-months{display:grid;gap:8px;margin-bottom:12px}
.gantt-months span{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sub);text-align:center;padding-bottom:9px;border-bottom:1px solid var(--hair)}
.gantt-rows{display:flex;flex-direction:column;gap:9px}
.gantt-row{display:grid;gap:8px}
.gbar{border-radius:8px;padding:11px 16px;color:#fff;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.gbar .gb-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.2}
.gbar .gb-focus{font-size:11.5px;line-height:1.3;opacity:.9}
.p-align{background:#4a7fb5}
.p-explore{background:#1d70b8}
.p-validate{background:#2f8ca6}
.p-prepare{background:#c66b3c}
/* statement-of-work bands sit above the phases, spanning what each covers */
.gantt-bands{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.gband{border-radius:8px;padding:8px 14px;min-height:32px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.gband.p-discovery{background:rgba(111,163,216,.10);color:var(--sub);border:1px solid var(--hair)}
.gband.p-alpha{background:rgba(88,166,240,.16);color:var(--accent-lab);border:1px solid rgba(88,166,240,.34)}

.gbar.is-narrow{padding:9px 11px;min-height:42px}
.gbar.is-narrow .gb-name{font-size:12.5px;line-height:1.15}
.gbar.is-narrow .gb-focus{display:none}

.alpha-obj{margin-bottom:30px}
.alpha-obj ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px 34px}
.alpha-obj li{font-size:16px;color:var(--sub);line-height:1.5;padding:9px 0 9px 22px;position:relative;border-bottom:1px dotted var(--hair)}
.alpha-obj li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:8px;border:1.5px solid var(--accent-lab);border-radius:2px}

@media(max-width:760px){
  .alpha-goal{grid-template-columns:1fr;gap:14px}
  .alpha-goal p{font-size:16px}
  .alpha-obj ul{grid-template-columns:1fr}
  .gbar .gb-focus{display:none}
}

/* ---- WAYS OF WORKING (front-page teaser: goal + sprint loop) ---- */
.wow-goal{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:start;
  border:1px solid var(--hair);border-left:3px solid var(--accent-lab);border-radius:12px;
  background:var(--surface);padding:24px 28px;margin-bottom:26px}
.wow-goal .wg-side{display:flex;flex-direction:column;gap:8px}
.wow-goal .wg-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-lab)}
.wow-goal .wg-window{font-family:var(--font-mono);font-size:12px;color:var(--sub)}
.wow-goal p{margin:0;font-size:18px;line-height:1.55;color:var(--fg);max-width:60ch}

.wow-flow{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px;align-items:stretch}
.wf-stage{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:16px 18px}
.wf-out{border-left:3px solid var(--pine)}
.wf-stage .wf-k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);display:block;margin-bottom:12px}
.wf-stage ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wf-stage li{font-size:16px;color:var(--fg);line-height:1.35;padding-left:16px;position:relative}
.wf-stage li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:2px;background:var(--accent-lab);opacity:.7}
.wf-out li::before{background:var(--pine);opacity:1}

.wf-loop{border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.wf-loop .wl-node{border-radius:10px;padding:11px 14px;width:100%;font-family:var(--font-display);font-weight:600;font-size:14px;line-height:1.2;color:#fff}
.wf-loop .wl-explore{background:var(--leaf-deep)}
.wf-loop .wl-synth{background:var(--pine)}
.wf-loop .wl-cycle{font-size:22px;color:var(--accent-lab);line-height:1}
.wf-loop .wl-loops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.wf-loop .wl-chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;color:var(--accent-lab);
  border:1px solid var(--hair);border-radius:999px;padding:5px 11px;background:transparent}
.wf-loop .wl-chip-alt{color:#6b4f9e;border-color:rgba(107,79,158,.4)}
.band.dark .wf-loop .wl-chip-alt{color:#b6a4dc;border-color:rgba(182,164,220,.4)}

@media(max-width:760px){
  .wow-goal{grid-template-columns:1fr;gap:14px}
  .wow-goal p{font-size:16px}
  .wow-flow{grid-template-columns:1fr}
}

/* ---- GUIDING PRINCIPLES (audience-grouped principle cards) ---- */
.principles{display:grid;grid-template-columns:repeat(var(--pr-cols,3),1fr);gap:20px;align-items:start}
.pr-group{--pr-accent:var(--accent-lab)}
.pr-g0{--pr-accent:#4a7fb5}
.pr-g1{--pr-accent:#2f8ca6}
.pr-g2{--pr-accent:#c66b3c}
.pr-aud{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--pr-accent);margin-bottom:14px}
