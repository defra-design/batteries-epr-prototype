nce where they may. Heavy coordination.\" },\n    { \"code\": \"O5 · S5.1\", \"title\": \"Take-back workflow\", \"impact\": 6.8, \"effort\": 6.6, \"desc\": \"The legal duty to repatriate a rejected load is clear; the operational path is opaque. Run returns on the same data spine.\", \"rec\": \"Defer to phase 3 once the export spine exists to hang it on.\" },\n    { \"code\": \"API\", \"title\": \"Large-operator API integration\", \"impact\": 7.0, \"effort\": 6.0, \"desc\": \"Most volume sits with large operators who will integrate by API rather than use the web form.\", \"rec\": \"Phase 3. Lets the web service stay focused on the non-compliant long tail.\" }\n  ]\n}\n","04-findings-constraints.json":"{\n  \"kicker\": \"Key constraints, risks and dependencies\",\n  \"standfirst\": \"What the design must work within, what could derail it, and what it relies on others to deliver. RAG status is illustrative until validated with delivery and policy.\",\n  \"groups\": [\n    {\n      \"id\": \"constraints\",\n      \"label\": \"Constraints\",\n      \"items\": [\n        {\n          \"title\": \"Research sample breadth\",\n          \"detail\": \"The sample captured a range of perspectives and experiences, though findings may not reflect the full diversity of views across the wider industry and regulatory landscape.\",\n          \"rag\": \"amber\"\n        },\n        {\n          \"title\": \"Article 18 keeps the regime light-touch\",\n          \"detail\": \"Green List shipments carry no prior consent and no notification by design. Any solution must add assurance without reintroducing the burden the regime deliberately removed.\",\n          \"rag\": \"amber\"\n        },\n        {\n          \"title\": \"Four-nation operating model\",\n          \"detail\": \"EA, SEPA, NRW and NIEA each run their own systems and processes. The service must converge where it must and allow divergence where it may.\",\n          \"rag\": \"amber\"\n        },\n        {\n          \"title\": \"Paper is the legal artefact today\",\n          \"detail\": \"The Annex VII travels physically with the load and is the document of record. Any digital capture must coexist with paper through the transition.\",\n          \"rag\": \"green\"\n        }\n      ]\n    },\n    {\n      \"id\": \"risks\",\n      \"label\": \"Risks\",\n      \"items\": [\n        {\n          \"title\": \"Code mapping proves intractable\",\n          \"detail\": \"EWC, Basel, OECD and HMRC codes may not reconcile cleanly, weakening risk-targeting downstream.\",\n          \"rag\": \"amber\",\n          \"likelihood\": 3,\n          \"impact\": 4\n        },\n        {\n          \"title\": \"Overseas facility data is unverifiable\",\n          \"detail\": \"A trusted-facility register depends on source data the UK does not control and a workable dispute process.\",\n          \"rag\": \"amber\",\n          \"likelihood\": 3,\n          \"impact\": 4\n        },\n        {\n          \"title\": \"Four-nation coordination\",\n          \"detail\": \"A shared case workflow needs four regulators to agree; misalignment slows the whole programme.\",\n          \"rag\": \"red\",\n          \"likelihood\": 3,\n          \"impact\": 5\n        }\n      ]\n    },\n    {\n      \"id\": \"dependencies\",\n      \"label\": \"Dependencies\",\n      \"items\": [\n        {\n          \"title\": \"EA retrospective Annex VII returns\",\n          \"detail\": \"From 1 July 2026 monthly returns give the first structured view. The bridge phase depends on this feed arriving and being usable.\",\n          \"rag\": \"green\"\n        },\n        {\n          \"title\": \"HMRC CDS reconciliation\",\n          \"detail\": \"Joining customs data to the waste record depends on an HMRC CDS interface and a shared code mapping.\",\n          \"rag\": \"amber\"\n        },\n        {\n          \"title\": \"Policy decisions on phase 2 mandate\",\n          \"detail\": \"The scope and timing of mandatory digital tracking is a policy call the delivery plan must sequence around.\",\n          \"rag\": \"amber\"\n        },\n        {\n          \"title\": \"NI/DIWASS mandate lands 1 January 2027\",\n          \"detail\": \"Northern Ireland operators and authorities must use DIWASS from 1 January 2027 under the Windsor Framework. This is a separate, earlier deadline from the phase 3 mandate targeted for October 2027 in the alpha plan - worth keeping distinct so the two dates are not conflated in planning.\",\n          \"rag\": \"amber\"\n        }\n      ]\n    }\n  ]\n}\n","service-overview.json":"{\n  \"kicker\": \"Service design\",\n  \"lead\": [\n    \"Green List Waste classification and reporting, covered by [[Article 18]], is the simplified process for exporting and importing most non-hazardous waste for recovery.\",\n    \"Rules vary across UK nations. Northern Ireland follows EU requirements, and OECD and non-OECD countries apply different controls.\",\n    \"There is no prior consent, but every shipment must be properly sorted, carry a fully completed Annex VII form, and be subject to an Article 18 take-back contract between the person arranging the shipment and the overseas consignee.\"\n  ],\n  \"callout\": {\n    \"title\": \"The defining complexity is divergence.\",\n    \"points\": [\n      \"The EA (England) regulates [[exports only]] and, from 1 July 2026, layers registration, retrospective Annex VII reporting and overseas-facility evidence on top of the base regime.\",\n      \"SEPA and NIEA require Annex VII [[before]] shipment.\",\n      \"NRW has not adopted England's July 2026 reporting reforms.\",\n      \"NIEA follows EU requirements under the [[Windsor Framework]], bringing Northern Ireland movements into scope of EU DIWASS.\"\n    ],\n    \"source\": { \"label\": \"Waste: export and import — GOV.UK\", \"href\": \"https://www.gov.uk/guidance/importing-and-exporting-waste\" }\n  },\n  \"note\": \"Illustrative overview, to be validated. Content reproduced from the Green List waste overview slide.\"\n}\n","landscape-link.json":"{\n  \"kicker\": \"Service design\",\n  \"standfirst\": \"Where Green List Waste sits in the wider circular economy and the Digital Waste Tracking landscape, and the end-to-end lifecycle chain that connects them.\",\n  \"showLink\": false,\n  \"blocks\": [\n    {\n      \"label\": \"Where does Green List Waste fit in the wider context?\",\n      \"body\": [\n        \"Green List Waste connects the UK circular economy to international recycling markets. Digital Waste Tracking (DWT) provides the infrastructure to link and manage these exports and imports to the wider UK waste and materials lifecycle.\",\n        \"Green List Waste shares similar users and data requirements with other DWT services, including Collections of Waste, Receipt of Waste, REACT and PRN/PERN.\",\n        \"Key actors include waste producers, exporters, carriers, brokers, ports, customs authorities, overseas importers, recovery facilities and environmental regulators.\"\n      ],\n      \"links\": [\n        {\n          \"label\": \"Circular economy diagram\",\n          \"image\": \"content/media/circular-economy.webp\",\n          \"caption\": \"Circular economy\",\n          \"alt\": \"The circular economy for packaging waste: producers place packaging on the market, consumers discard it, local authorities and waste management companies collect it, materials facilities sort it, and reprocessors either recycle it domestically or export it. Green list waste imports feed in as raw materials and green list waste exports flow out. Money flows back through Extended Producer Responsibility, the Deposit Return Scheme, local authority payments, and Packaging Recovery Notes.\"\n        },\n        {\n          \"label\": \"DWT landscape diagram\",\n          \"image\": \"content/media/dwt-service-landscape.webp\",\n          \"caption\": \"Waste landscape view 2\",\n          \"alt\": \"Waste landscape view 2: the Digital Waste Tracking landscape mapped as clustered actors, information, legislation, processes and systems. Clusters cover industry waste-tracking data providers, other industry parties, the European Union, regulators and the work of regulating the industry, Defra and waste-tracking policy, local authorities and local action, HMRC and tax offices in devolved administrations, Parliament, emergency services, the joint unit for waste crime, and Crimestoppers.\"\n        }\n      ]\n    },\n    {\n      \"label\": \"Green List Waste service lifecycle chain\",\n      \"body\": [\n        \"Maps and visualises the end-to-end journey of Green List Waste from its original source material, then as non-hazardous waste across existing DWT service touchpoints, to Green List Waste classification and then export or import back into the circular economy.\"\n      ],\n      \"value\": {\n        \"label\": \"Value: end-to-end visibility\",\n        \"body\": \"Helps teams understand how waste moves through the circular economy and Digital Waste Tracking lifecycle, while highlighting key dependencies, touchpoints, handoffs and potential reuse of existing services and data touchpoints.\"\n      },\n      \"links\": [\n        {\n          \"label\": \"End-to-end lifecycle chain diagram\",\n          \"image\": \"content/media/glw-lifecycle-chain.webp\",\n          \"caption\": \"Green List Waste end-to-end lifecycle chain\",\n          \"alt\": \"The Green List Waste end-to-end lifecycle chain with service and data touchpoints: source material through waste generated, across existing Digital Waste Tracking service touchpoints, to Green List Waste classification and export or import back into the circular economy, with the data captured at each step shown beneath.\"\n        }\n      ]\n    }\n  ],\n  \"note\": \"Illustrative service landscape, to be validated.\"\n}\n","journey-map.json":"{\n  \"title\": \"Green List Waste As-Is end-to-end export journey\",\n  \"illustrative\": true,\n  \"columnWidth\": 300,\n  \"kicker\": \"Service design\",\n  \"href\": \"journey-map.html\",\n  \"linkLabel\": \"Open the As-Is journey map\",\n  \"links\": [\n    {\n      \"label\": \"View the journey map\",\n      \"image\": \"content/media/glw-user-journey.webp\",\n      \"caption\": \"Green List Waste As-Is end-to-end export journey\",\n      \"alt\": \"The Green List Waste As-Is end-to-end export journey map: eight stages from set up and register through assess and triage, contract and due diligence, prepare transport paperwork, move the waste, receive and recover, keep records and report, to oversight and enforcement. Each stage records the UK exports and imports perspective, who is involved, touchpoints, external and internal user needs, pain points, ideas and opportunities, and ownership.\"\n    }\n  ],\n  \"overviewLabel\": \"Overview\",\n  \"previewBlurb\": \"This high-level user journey map captures how people currently understand, navigate and experience the end-to-end Green List Waste process, from initial set up and waste classification through documentation, shipment, movement and completion.\",\n  \"note\": \"Imports mirror exports; the GB facility carries the receiving-side duties.\",\n  \"showStages\": false,\n  \"meta\": [\n    \"Discovery phase, v1.0\",\n    \"Last updated July 2026\",\n    \"Created by David Krohnn (Service Designer) and Sanjeet Bhachu (User Researcher)\",\n    \"Sources: desk research, regulator workshops and 1-2-1 interviews\"\n  ],\n  \"aboutUsersLabel\": \"About the users\",\n  \"aboutUsers\": \"Based on research evidence, it illustrates an activity-based approach rather than a traditional persona-based approach, reflecting the tasks, interactions and challenges shared across different user groups. See the user research discovery report for further information.\",\n  \"lanes\": [\n    {\n      \"id\": \"steps\",\n      \"label\": \"Cadence\",\n      \"tier\": \"header\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"exportGoal\",\n      \"label\": \"Exports: goal\",\n      \"type\": \"text\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"exportDoing\",\n      \"label\": \"Exports: doing\",\n      \"type\": \"cards\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"importGoal\",\n      \"label\": \"Imports: goal\",\n      \"type\": \"text\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"importDoing\",\n      \"label\": \"Imports: doing\",\n      \"type\": \"cards\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"whoInvolved\",\n      \"label\": \"Who is involved\",\n      \"type\": \"chips\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"touchpoints\",\n      \"label\": \"Touchpoints\",\n      \"type\": \"chips\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"externalNeeds\",\n      \"label\": \"External user needs\",\n      \"type\": \"cards\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"internalNeeds\",\n      \"label\": \"Internal user needs\",\n      \"type\": \"cards\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"externalPains\",\n      \"label\": \"External pain points\",\n      \"type\": \"cards\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"internalPains\",\n      \"label\": \"Internal pain points\",\n      \"type\": \"cards\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"externalIdeas\",\n      \"label\": \"External ideas and opportunities\",\n      \"type\": \"cards\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"internalIdeas\",\n      \"label\": \"Internal ideas and opportunities\",\n      \"type\": \"cards\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"ownership\",\n      \"label\": \"Ownership and responsibilities\",\n      \"type\": \"cards\",\n      \"visible\": false\n    }\n  ],\n  \"stages\": [\n    {\n      \"id\": \"set-up-register\",\n      \"label\": \"Set up and register\",\n      \"steps\": [\n        {\n          \"id\": \"s1\",\n          \"label\": \"Once per business, new users\",\n          \"cells\": {\n            \"exportGoal\": \"Get set up once, quickly, without paying for or repeating the same registration multiple times.\",\n            \"exportDoing\": [\n              \"Complete registrations\",\n              \"Complete online applications\",\n              \"Pay fees\",\n              \"England: file the annual export declaration\",\n              \"SEPA green-list pre-registration, and NIEA TFS team registration, for both exports and imports\",\n              \"Store registration numbers\"\n            ],\n            \"importGoal\": \"Be registered and accredited to carry out import and recovery operations.\",\n            \"importDoing\": [\n              \"Ensure the site holds an environmental permit, or exemption, covering the waste and recovery operation\",\n              \"Get an EORI for customs operations\",\n              \"England: include exempt permits in the advance declaration and monthly returns\",\n              \"Scotland: pre-register with SEPA, whose green-list controls cover imports as well as exports\",\n              \"Northern Ireland: register with NIEA's TFS team\"\n            ],\n            \"whoInvolved\": [\n              \"New registrant\",\n              \"Waste producers\",\n              \"Broker or dealer\",\n              \"Waste carrier\",\n              \"Waste receiving sites\",\n              \"Waste recovery site\",\n              \"Regulator registration teams (EA, NRW, SEPA, NIEA)\",\n              \"HMRC (EORI)\",\n              \"Trade bodies and consultants\"\n            ],\n            \"touchpoints\": [\n              \"GOV.UK and regulator websites (NPWD)\",\n              \"Online registration portals\",\n              \"Email confirmations\",\n              \"Phone helplines\",\n              \"Payment gateway\"\n            ],\n            \"externalNeeds\": [\n              \"Understand my legal role, responsibilities and applicable regulator\",\n              \"Register my organisation and users without repeatedly entering the same information\",\n              \"Reuse verified licences, permits, contacts and facility details\",\n              \"Delegate tasks while keeping accountability clear\"\n            ],\n            \"internalNeeds\": [\n              \"Identify the legal entity and accountable person\",\n              \"Verify registrations, permissions and user authority\",\n              \"Maintain accurate operator and contact records\",\n              \"Identify operators requiring additional support or oversight\"\n            ],\n            \"externalPains\": [\n              \"Four separate UK registrations with different processes and fees\",\n              \"NI movements need dual registration\",\n              \"The new EA interim solution adds a further interaction\",\n              \"NPWD is being retired\",\n              \"Compliance obligations introduce administrative and operational overheads\"\n            ],\n            \"internalPains\": [\n              \"All: data fragmentation across systems and regulators\",\n              \"SEPA: lack of dedicated admin support\",\n              \"SEPA: data security concerns\"\n            ],\n            \"externalIdeas\": [\n              \"A single UK-wide, or mutually recognised, registration with tell-us-once data sharing between the four regulators\",\n              \"Guided onboarding checklist\"\n            ],\n            \"internalIdeas\": [\n              \"Ability to focus on particular waste types and exporters of interest, and target compliance work accordingly\",\n              \"See volumes of particular wastes to particular countries for reporting and planning\",\n              \"Train a model to review submitted photographs and flag potential issues\",\n              \"Use the system to issue bulk email or guidance to operators on regulatory updates and controls\"\n            ],\n            \"ownership\": [\n              \"Each UK regulator owns and maintains its register\",\n              \"Defra owns registration policy\",\n              \"HMRC owns EORI\",\n              \"Defra owns DIWASS\"\n            ]\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"assess-triage\",\n      \"label\": \"Assess and triage\",\n      \"steps\": [\n        {\n          \"id\": \"s2\",\n          \"label\": \"Per material stream, per shipment\",\n          \"cells\": {\n            \"exportGoal\": \"Be confident the material qualifies and the destination is legal before committing to a shipment.\",\n            \"exportDoing\": [\n              \"Inspect, sample and potentially test material for quality assessment\",\n              \"Assign correct waste code or codes\",\n              \"Document materials and contamination levels\",\n              \"Look up destination and transit country rules\",\n              \"Decide green-list versus notified route\",\n              \"Onboarding and vetting of suppliers and partners to evaluate operation and quality control\"\n            ],\n            \"importGoal\": \"Have a legitimate overseas supplier and partners who can provide quality GLW.\",\n            \"importDoing\": [\n              \"Have evidence and confidence material qualifies as green-list and matches the site permit\",\n              \"Agree specifications and contamination limits with the overseas supplier\",\n              \"Confirm the export is permitted from the dispatch country under its rules, not just the UK's\"\n            ],\n            \"whoInvolved\": [\n              \"Exporter\",\n              \"Waste producer\",\n              \"Sampling laboratory\",\n              \"Broker or consultant\",\n              \"Regulator technical or classification teams\",\n              \"Destination country authority rules\"\n            ],\n            \"touchpoints\": [\n              \"Published waste code lists and guidance pages\",\n              \"Lab reports\",\n              \"Regulator helplines\",\n              \"OECD and Basel country-rule documents\",\n              \"Trade association advice\"\n            ],\n            \"externalNeeds\": [\n              \"Judge whether a specific waste type, consignee and recovery facility is compliant\",\n              \"Determine whether the specific waste, route and recovery plan qualifies for green-list controls\",\n              \"Apply the correct waste codes and assess composition, contamination and hazardous properties\",\n              \"Understand what evidence is required to support the classification\",\n              \"Reuse classifications while being prompted to review them when the waste or production process changes\"\n            ],\n            \"internalNeeds\": [\n              \"Ensure classification rules are applied consistently\",\n              \"Review the evidence and assumptions supporting a decision\",\n              \"Identify misdescription, contamination and inappropriate use of green-list controls\",\n              \"Maintain current technical guidance and decision criteria\"\n            ],\n            \"externalPains\": [\n              \"Classification is self-service and open to interpretation\",\n              \"Misclassification cascades downstream in waste chain\",\n              \"Differing contamination thresholds, material and jurisdiction\",\n              \"Non-OECD country rules scattered across PDFs and change without notice\",\n              \"No binding pre-shipment ruling service\",\n              \"High cost of getting it wrong, internal or external\",\n              \"Unclear regulatory requirements\"\n            ],\n            \"internalPains\": [\n              \"All: waste misclassification and poor data quality\",\n              \"All: falsifying the destination to a permitted overseas facility when it is actually heading elsewhere\",\n              \"All: resource and ts\",\n              \"Container stop notices\",\n              \"Enforcement letters and notices\",\n              \"Court proceedings\",\n              \"Published enforcement outcomes\"\n            ],\n            \"externalNeeds\": [\n              \"Reconcile what was planned, shipped, received and recovered\",\n              \"Retain a complete, version-controlled shipment record\",\n              \"Complete requested reporting without re-entering information\",\n              \"Retrieve an audit-evidence pack quickly\",\n              \"Use discrepancy and recovery information to improve suppliers, routes and waste quality\"\n            ],\n            \"internalNeeds\": [\n              \"Access complete and reconciled records\",\n              \"Identify late, missing or inconsistent reporting\",\n              \"Analyse patterns across operators, routes, facilities and waste streams\",\n              \"Proactively target repeat non-compliance and emerging risks\",\n              \"Use service data to inform inspection, enforcement and policy decisions\"\n            ],\n            \"externalPains\": [\n              \"Regulators see fragments, registration here, customs there, returns elsewhere\",\n              \"Compliant operators subjected to inspection friction as a consequence of non-compliant operators\",\n              \"Regulatory changes poorly communicated\",\n              \"Regulatory changes create operational uncertainty\",\n              \"Administrative and operational overheads\"\n            ],\n            \"internalPains\": [\n              \"All: manual, paper-heavy Annex VII processes\",\n              \"All: inability to perform proactive, risk-based interventions\",\n              \"All: data fragmentation across systems and regulators\",\n              \"All: resource and staffing constraints\",\n              \"All: producer may not know what happened to their waste\",\n              \"All: evidence and validity of documentation submitted\",\n              \"All: delay for responses from Notifiers\",\n              \"SEPA: lack of management recognition and prioritisation\",\n              \"SEPA: lack of dedicated admin support\"\n            ],\n            \"externalIdeas\": [\n              \"Joined-up data, registrations, declarations, customs and returns\"\n            ],\n            \"internalIdeas\": [\n              \"Reporting functions should allow 1 click reporting\",\n              \"Stop all the chat about SOCGs and focus HMRC\",\n              \"Stop Organised Crime Groups\",\n              \"Complete records without having to chase, what can be wrong with that?\",\n              \"Getting service to hold these would speed up our compliance and enforcement tasks\",\n              \"More resources\"\n            ],\n            \"ownership\": [\n              \"UK regulators own enforcement in their nation\"\n            ]\n          }\n        }\n      ]\n    }\n  ]\n}\n","05-service-blueprint.json":"{\n  \"title\": \"Green List Waste As-Is service blueprint\",\n  \"illustrative\": false,\n  \"columnWidth\": 300,\n  \"kicker\": \"Service design\",\n  \"href\": \"service-blueprint.html\",\n  \"linkLabel\": \"Open the service blueprint\",\n  \"links\": [\n    {\n      \"label\": \"View the blueprint\",\n      \"image\": \"content/media/glw-service-blueprint.webp\",\n      \"caption\": \"Green List Waste As-Is service blueprint\",\n      \"alt\": \"The Green List Waste As-Is service blueprint: nine stages across the Before, Begin, During and After phases, from setup and registration through to oversight and enforcement. Each stage records policy, user and regulator outcomes, pre and post conditions, artefacts and evidence, actors, frontstage and backstage interactions, support processes, touchpoints, systems and data captured, pain points, failure points, and takeaways.\"\n    }\n  ],\n  \"meta\": [\n    \"Discovery phase, v1.0\",\n    \"Last updated July 2026\",\n    \"Created by David Holmes (Service Designer)\",\n    \"Sources: desk research, regulator workshops and 1-2-1 interviews\"\n  ],\n  \"overviewLabel\": \"Green List Waste service at a glance\",\n  \"previewBlurb\": \"Level 0: the UK exports and imports service map for non-hazardous ([[Article 18]]) waste, as-is, July 2026. The full grid is its own page you can move through, with a Lanes menu to show or hide rows.\",\n  \"stagesLabel\": \"The eight stages\",\n  \"previewStages\": [\n    {\n      \"tone\": \"control\",\n      \"label\": \"Set up and register\",\n      \"body\": \"Register with your regional regulator, get customs numbers and create accounts, once per business. EU DIWASS where applicable.\",\n      \"actors\": \"EA / NRW / SEPA / NIEA / EU DIWASS\"\n    },\n    {\n      \"tone\": \"control\",\n      \"label\": \"Classify and check rules\",\n      \"body\": \"Confirm the waste is genuinely green list and that the destination country allows it.\",\n      \"actors\": \"Producer and exporter decide / regulators publish the rules\"\n    },\n    {\n      \"tone\": \"control\",\n      \"label\": \"Contract and due diligence\",\n      \"body\": \"Sign the Article 18 contract and evidence that the overseas site is real and authorised.\",\n      \"actors\": \"Exporter and waste chain parties / EA sets the evidence bar\"\n    },\n    {\n      \"tone\": \"control\",\n      \"label\": \"Prepare the paperwork\",\n      \"body\": \"Complete the Annex VII, the customs entry and any destination certificates.\",\n      \"actors\": \"Exporter / HMRC / UK regulators / IWS / EU DIWASS\"\n    },\n    {\n      \"tone\": \"paper\",\n      \"label\": \"Move the waste\",\n      \"body\": \"Check, collect, ship and clear ports. The Annex VII travels with the container.\",\n      \"actors\": \"Carrier / freight forwarders / Border Force / ports\"\n    },\n    {\n      \"tone\": \"paper\",\n      \"label\": \"Receive and recover\",\n      \"body\": \"The receiver confirms arrival and checks the load before accepting it. The recovery facility confirms real recycling, or take-back applies.\",\n      \"actors\": \"Carrier and exporter / consignee / recovery facility\"\n    },\n    {\n      \"tone\": \"paper\",\n      \"label\": \"Keep records and report\",\n      \"body\": \"Keep everything for 3 years. England reports monthly, and the UK reports internationally.\",\n      \"actors\": \"Exporter / regulators / Defra / EU DIWASS\"\n    },\n    {\n      \"tone\": \"control\",\n      \"label\": \"Oversight and enforcement\",\n      \"body\": \"Regulators audit, inspect and enforce continuously in the background.\",\n      \"actors\": \"UK regulators\"\n    }\n  ],\n  \"legend\": [\n    {\n      \"tone\": \"control\",\n      \"text\": \"Where regulatory controls are concentrated. Stages 1 to 4 hold the majority of data touchpoints, with more at stage 8.\"\n    },\n    {\n      \"tone\": \"paper\",\n      \"text\": \"Where all parties rely on the shipment's own paperwork.\"\n    }\n  ],\n  \"exceptions\": {\n    \"label\": \"Exceptions can enter from any stage\",\n    \"text\": \"Misclassification, rejection, port holds, transit challenge, recovery failure, lost evidence, illegal-shipment treatment, and take-back at the arranger's cost.\"\n  },\n  \"statements\": [\n    \"No approval gate means no second chance.\",\n    \"Two signatures carry the legal closure.\",\n    \"One design covers both directions.\"\n  ],\n  \"overview\": [\n    \"Green List Waste is a lower-control route for moving eligible, non-hazardous waste internationally for recycling or recovery. It is not a “no-checks” service.\",\n    \"The aim is to ensure that the waste is correctly classified, clean and properly sorted, transported legally, and processed safely at an authorised destination facility.\",\n    \"The end-to-end service starts when an exporter identifies the waste and checks whether Green List controls are permitted for the destination and any countries it will pass through.\",\n    \"The exporter must confirm the organisations involved are legitimate, agree a written contract with the importer, and complete an Annex VII form. This form travels with every shipment and provides the key information about the waste, journey and recovery facility.\",\n    \"The carrier transports the waste to the named destination. On arrival, the importer and recovery facility check that the load matches the paperwork, accept or quarantine it, and sign the Annex VII form.\",\n    \"The exporter and importer must keep the documents and contract for three years. If the shipment is rejected, cannot be completed or is found to be illegal, the exporter remains responsible for arranging its return, safe storage or alternative recovery.\"\n  ],\n  \"lanes\": [\n    {\n      \"id\": \"steps\",\n      \"label\": \"Stage\",\n      \"tier\": \"header\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"subSteps\",\n      \"label\": \"Cadence\",\n      \"tier\": \"header\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"policyOutcomes\",\n      \"label\": \"Policy outcomes\",\n      \"type\": \"cards\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"userOutcomes\",\n      \"label\": \"User outcomes\",\n      \"type\": \"text\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"regulatorOutcomes\",\n      \"label\": \"Regulator operational outcomes\",\n      \"type\": \"text\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"preConditions\",\n      \"label\": \"Pre-conditions\",\n      \"type\": \"text\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"postConditions\",\n      \"label\": \"Post-conditions\",\n      \"type\": \"text\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"actors\",\n      \"label\": \"Actors\",\n      \"type\": \"chips\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"artefacts\",\n      \"label\": \"Artefacts and evidence\",\n      \"type\": \"chips\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"frontstageUser\",\n      \"label\": \"Frontstage: user actions\",\n      \"type\": \"text\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"touchpoints\",\n      \"label\": \"Touchpoints\",\n      \"type\": \"chips\",\n      \"visible\": true\n    },\n    {\n      \"id\": \"frontstageService\",\n      \"label\": \"Frontstage: service (line of visibility)\",\n      \"type\": \"text\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"backstage\",\n      \"label\": \"Backstage (line of internal interaction)\",\n      \"type\": \"text\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"supportProcess\",\n      \"label\": \"Support process\",\n      \"type\": \"text\",\n      \"visible\": false\n    },\n    {\n      \"id\": \"failurePoints\",\n      \"label\": \"Failure points and exceptions\",\n      \"type\": \"cards\",\n      \"visible\": true\n    }\n  ],\n  \"stages\": [\n    {\n      \"id\": \"before\",\n      \"label\": \"BEFORE\",\n      \"steps\": [\n        {\n          \"id\": \"setup-registration\",\n          \"label\": \"Setup and registration\",\n          \"subSteps\": [\n            \"Before any shipment\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Regulators can detect non-compliance\"\n            ],\n            \"userOutcomes\": \"Authorised to trade or operate on every intended route, so no latent registration gaps waiting at the border\",\n            \"regulatorOutcomes\": \"A traceable, accountable operator base, rogue actors excluded before any waste moves\",\n            \"preConditions\": \"Eligible to handle or trade GLW domestically and cross international borders\",\n            \"postConditions\": \"All registrations, permits, accreditations and accounts live and diarised for renewal\",\n            \"actors\": [\n              \"New exporter\",\n              \"Waste producers\",\n              \"Broker or dealer\",\n              \"Waste carrier\",\n              \"Regulator registration teams (EA, NRW, SEPA, NIEA)\",\n              \"HMRC (EORI)\",\n              \"Trade bodies and consultants\"\n            ],\n            \"artefacts\": [\n              \"Regional and national registration IDs\",\n              \"Permits\",\n              \"EORI\",\n              \"Accreditations\",\n              \"EU DIWASS registration IDs\"\n            ],\n            \"frontstageUser\": \"Understand obligations; complete online applications; pay fees; store registration numbers; (England) file annual export declaration.\",\n            \"touchpoints\": [\n              \"GOV.UK and regulator websites\",\n              \"Online registration portals\",\n              \"Email confirmations\",\n              \"Phone helplines\",\n              \"Payment gateway\"\n            ],\n            \"frontstageService\": \"Online guidance, regulator websites, trade networks, phone helplines, registration services, application forms, fee payment, confirmation emails, registration certificates and numbers issued.\",\n            \"backstage\": \"Validate applications; fit-and-proper checks; update public registers; process fees; issue numbers; triage England advance declarations.\",\n            \"supportProcess\": \"Helpdesks; ID verification services; payment processing; trade body onboarding guides.\",\n            \"failurePoints\": [\n              \"Expired registrations\"\n            ]\n          }\n        },\n        {\n          \"id\": \"assess-triage\",\n          \"label\": \"Assess / Triage\",\n          \"subSteps\": [\n            \"Per material stream / per shipment\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Waste is correctly classified\",\n              \"Legitimate recovery is enabled\"\n            ],\n            \"userOutcomes\": \"A defensible, current determination the business can ship against with confidence\",\n            \"regulatorOutcomes\": \"Correct classification first time, reduction in misclassified loads, borderline queries resolved pre-shipment, not at the border\",\n            \"preConditions\": \"Waste stream exists, samples obtainable, destination country identified\",\n            \"postConditions\": \"Correct codes assigned, contamination checked and evidenced, destination check passed, documented determination\",\n            \"actors\": [\n              \"Exporter\",\n              \"Waste producer\",\n              \"Sampling laboratory\",\n              \"Broker or consultant\",\n              \"Regulator technical and classification teams\",\n              \"Destination country authority (rules)\"\n            ],\n            \"artefacts\": [\n              \"Determination\",\n              \"Lab certs\",\n              \"Destination check confirmations\"\n            ],\n            \"frontstageUser\": \"Inspect and sample material; assign waste code; document contamination levels; look up destination and transit country rules; decide green-list versus notified route.\",\n            \"touchpoints\": [\n              \"Published waste code lists and guidance pages\",\n              \"Lab reports\",\n              \"Regulator helplines\",\n              \"OECD and Basel country-rule documents\",\n              \"Trade association advice\"\n            ],\n            \"frontstageService\": \"Regulator guidance and helpline answers; lab certificates; limited pre-shipment advice, mostly self-service and inspections.\",\n            \"backstage\": \"Accredited laboratories; consultants; regulator technical panels; OECD and Basel secretariat publications.\",\n            \"supportProcess\": \"Accredited laboratories; consultants; regulator technical panels; OECD and Basel secretariat publications. Regulators field inspections.\",\n            \"failurePoints\": [\n              \"Misclassification, illegal shipment exposure\"\n            ]\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"begin\",\n      \"label\": \"BEGIN\",\n      \"steps\": [\n        {\n          \"id\": \"contract-due-diligence\",\n          \"label\": \"Contract, Due Diligence\",\n          \"subSteps\": [\n            \"Per contract / Per shipment\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Legitimate recovery is enabled\",\n              \"Responsibility is clear throughout the movement\",\n              \"Regulators can detect non-compliance\",\n              \"Waste movement information supports circular economy goals (not the priority, but part of strategic objectives for CE)\"\n            ],\n            \"userOutcomes\": \"A legal contracted, verified destination with all parties vetted and failure take-back costs capped in advance\",\n            \"regulatorOutcomes\": \"Verifiable accountability chains; evidence packs producible on demand\",\n            \"preConditions\": \"Green-list determination current and correct, candidate facility identified, commercial outline agreed\",\n            \"postConditions\": \"Article 18 contract executed with take-back, facility evidence pack verified, all parties vetted\",\n            \"actors\": [\n              \"Exporter\",\n              \"Consignee (overseas importer)\",\n              \"Recovery facility operator\",\n              \"Lawyers or insurers\",\n              \"EA (evidence requirements, England)\",\n              \"Third-party auditors (EU regime)\"\n            ],\n            \"artefacts\": [\n              \"Article 18 contract\",\n              \"Evidence packs\",\n              \"Permit and licence check confirmations\",\n              \"EU DIWASS, future (EU movements)\"\n            ],\n            \"frontstageUser\": \"Negotiate terms; sign the Article 18 contract; include a take-back clause. Request and verify facility authorisation documents, GPS or photo evidence; set up payment and insurance.\",\n            \"touchpoints\": [\n              \"Email and calls with consignee\",\n              \"Contract documents\",\n              \"Internal bespoke systems and spreadsheets\",\n              \"Facility evidence pack (photos, permits)\",\n              \"EA guidance on evidence standards\"\n            ],\n            \"frontstageService\": \"Contract exchange between the exporter, consignee and other parties in the chain. EA communicates evidence expectations via guidance and letters (England).\",\n            \"backstage\": \"12-month export activity registration with EA (England); complete Annex VII blocks 1 to 12; enter data in DIWASS, notify SEPA and NIEA more than 2 working days pre-shipment (EU-bound); lodge customs export declaration.\",\n            \"supportProcess\": \"Due diligence checks, legal services; credit and insurance checks; translation; third-party facility audit providers.\",\n            \"failurePoints\": [\n              \"Illegal shipment exposure\"\n            ]\n          }\n        },\n        {\n          \"id\": \"prepare-paperwork\",\n          \"label\": \"Prepare transport paperwork\",\n          \"subSteps\": [\n            \"Per shipment\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Legitimate recovery is enabled\",\n              \"Responsibility is clear throughout the movement\",\n              \"Regulators can detect non-compliance\",\n              \"Waste movement information supports circular economy goals (not the priority, but part of strategic objectives for CE)\"\n            ],\n            \"userOutcomes\": \"A legal contracted, verified destination with all parties vetted and failure take-back costs capped in advance\",\n            \"regulatorOutcomes\": \"Pre-departure visibility of movements; declarations matching cleanly across EA / DIWASS / CDS. Regulators can see and risk-target shipments before departure, no anonymous movements\",\n            \"preConditions\": \"Executed Article 18 contract, verified facility, EA registration live, schedule agreed\",\n            \"postConditions\": \"Annex VII signed (block 12), DIWASS lodged more than 2 working days ahead, SEPA and NIEA notified pre shipment, customs declarations complete and accepted\",\n            \"actors\": [\n              \"Exporter's admin or compliance team\",\n              \"Freight forwarder\",\n              \"Shipping line\",\n              \"Customs agent\",\n              \"HMRC\",\n              \"EA reporting team (England)\",\n              \"Destination inspection agencies\"\n            ],\n            \"artefacts\": [\n              \"Annex VII\",\n              \"EA interim solution\",\n              \"DIWASS\",\n              \"HMRC CDS\",\n              \"EU DIWASS, future (EU movements)\"\n            ],\n            \"frontstageUser\": \"Confirms schedule and quantities; signs Annex VII declaration (block 12). Ensure every movement is documented (Annex VII) and, in England, visible in advance via declarations and monthly returns.\",\n            \"touchpoints\": [\n              \"Annex VII form (paper or PDF)\",\n              \"Customs declaration service\",\n              \"Freight booking platforms\",\n              \"Transport docs\",\n              \"Destination inspection bodies\",\n              \"SEPA pre-notification NPWD uploads or email transfrontier\",\n              \"NIEA pre-notification email TFS\",\n              \"EU DIWASS, future\"\n            ],\n            \"frontstageService\": \"Fill in Annex VII; instruct the customs agent; assemble the invoice, packing list and certificates; book the container and vessel. Booking confirmation; document pack issued to customer and driver; keep copies of everything. Pre-notify SEPA and NIEA respectively.\",\n            \"backstage\": \"12-month export activity registration with EA (England); complete Annex VII blocks 1 to 12; enter data in DIWASS (EU-bound); SEPA and NIEA more than 2 working days pre-shipment; lodge customs export declaration.\",\n            \"supportProcess\": \"SEPA and NIEA Annex VII pre-notification review, customs agents; freight forwarders; software vendors (ERP, compliance tools); shipping line documentation teams. EA registration service; EU digital system; HMRC customs.\",\n            \"failurePoints\": [\n              \"Illegal shipment exposure\"\n            ]\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"during\",\n      \"label\": \"DURING\",\n      \"steps\": [\n        {\n          \"id\": \"move-transport\",\n          \"label\": \"Move, Transport waste\",\n          \"subSteps\": [\n            \"Per shipment\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Legitimate recovery is enabled\",\n              \"Responsibility is clear throughout the movement\",\n              \"Waste movements are traceable\"\n            ],\n            \"userOutcomes\": \"Load delivered with evidence intact and minimal hold-ups, delays and costs\",\n            \"regulatorOutcomes\": \"Inspections targeted by risk, not chance; documents produced in minutes at stops. Any authority at any point can verify what the load is, whose it is, and where it is going\",\n            \"preConditions\": \"Annex VII signed by producer and carrier, document pack complete, load matches classification, bookings and seals ready\",\n            \"postConditions\": \"Arrived with seal and Annex VII, transport documents intact, load evidence captured, no unresolved holds\",\n            \"actors\": [\n              \"Carrier or haulier\",\n              \"Port and terminal operators\",\n              \"Shipping line\",\n              \"Border Force and HMRC\",\n              \"Regulator port inspection teams\",\n              \"Transit country authorities\"\n            ],\n            \"artefacts\": [\n              \"Weighbridge\",\n              \"Photos and seal\",\n              \"Annex VII producer and carrier copy\",\n              \"Customs declaration\",\n              \"Bill of lading\",\n              \"Transport documents pack\",\n              \"EU DIWASS, future (receipt updates)\"\n            ],\n            \"frontstageUser\": \"Supervise or evidence loading and weighing of waste before handing over and being accepted by the carrier. Sign and hand over Annex VII, which must travel with the waste. Transport waste to port and final destination.\",\n            \"touchpoints\": [\n              \"Weighbridge ticket\",\n              \"Signed Annex VII with the load\",\n              \"Port and terminal systems\",\n              \"Customs release messages\",\n              \"Inspection notices at the port\"\n            ],\n            \"frontstageService\": \"Collect and load at customer site; photograph load; record weighbridge weight; apply container seal and sign Annex VII. Sea or rail leg including transit states; monitor and relay milestones to customer.\",\n            \"backstage\": \"Load inspection and photos; Annex VII placed with load, it must travel with the waste at all times; driver briefed on inspection stops.\",\n            \"supportProcess\": \"Haulier, port operator, shipping line; EA and Border Force inspections; transit-state competent authorities. Port processing: customs release, possible EA or Border Force container inspection. Data analysis for anomalies and regulatory targeting.\",\n            \"failurePoints\": [\n              \"Illegal shipment exposure\",\n              \"Port hold\",\n              \"Transit challenge\",\n              \"Take-back or CA-approved alternative recovery, at the responsible party's cost\"\n            ]\n          },\n          \"break\": true\n        },\n        {\n          \"id\": \"receive\",\n          \"label\": \"Receive\",\n          \"subSteps\": [\n            \"Per shipment\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Legitimate recovery is enabled\",\n              \"Environmental harm is prevented\",\n              \"Waste movements are traceable\",\n              \"Regulators can detect non-compliance\"\n            ],\n            \"userOutcomes\": \"Confirmed receipt, exposure capped early, disputes resolved fast\",\n            \"regulatorOutcomes\": \"No waste disappears between border and facility; refusals trigger take-back, not abandonment. Despatched and received tonnage reconciling; rejections visibly routed to lawful handling\",\n            \"preConditions\": \"Load arrived and customs-cleared, Annex VII intact and correct\",\n            \"postConditions\": \"Load accepted, block 13 signed, facility authorised for R-code, capacity available\",\n            \"actors\": [\n              \"Consignee\",\n              \"Recovery facility\",\n              \"Destination competent authority\",\n              \"Exporter (take-back duty)\",\n              \"Shipping line (returns)\",\n              \"UK regulator (if take-back enforced)\"\n            ],\n            \"artefacts\": [\n              \"Annex VII block 13 signed\",\n              \"Emails\",\n              \"Photos\",\n              \"Invoices\",\n              \"EU DIWASS, future (receipt and take-backs)\"\n            ],\n            \"frontstageUser\": \"Arrive at receiving site, gate check: seal intact, documents present and matching.\",\n            \"touchpoints\": [\n              \"Signed Annex VII copies returned\",\n              \"Recovery confirmation certificate\",\n              \"Emails or portal of destination authority\",\n              \"Rejection and take-back notices\",\n              \"EU DIWASS, future\"\n            ],\n            \"frontstageService\": \"Weigh and reconcile against the dispatched quantity, and quality inspection versus contract specification. Consignee signs Annex VII block 13 confirming receipt; copy returned to arranger.\",\n            \"backstage\": \"Arranger or exporter receives arrival confirmation, or chases consignee block 13 signature; reconcile dispatched versus received tonnage or quality disputes.\",\n            \"supportProcess\": \"Destination customs clearance; consignee weighbridge. Rejection take-back process.\",\n            \"failurePoints\": [\n              \"Rejections, take-back or CA-approved alternative recovery, at the responsible party's cost\"\n            ]\n          },\n          \"break\": true\n        },\n        {\n          \"id\": \"recovery\",\n          \"label\": \"Recovery\",\n          \"subSteps\": [\n            \"Per shipment, receipt part 2. Moment that matters\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Legitimate recovery is enabled\",\n              \"Environmental harm is prevented\",\n              \"Regulators can detect non-compliance\",\n              \"Waste movement information supports circular economy goals (not the priority, but part of strategic objectives for CE)\"\n            ],\n            \"userOutcomes\": \"Legal closure plus usable value, recovery proof, PRN or PERN, commodity payment\",\n            \"regulatorOutcomes\": \"Material recovered properly. Recovery evidence and confirmations closing chains on time. EPR and PERN evidence integrity maintained\",\n            \"preConditions\": \"Load accepted, block 13 signed, facility authorised for R-code, capacity available\",\n            \"postConditions\": \"Recovery complete, block 14 signed and returned, PRN or PERN issued where due\",\n            \"actors\": [\n              \"Recovery facility\",\n              \"Exporter\",\n              \"Producer\"\n            ],\n            \"artefacts\": [\n              \"Annex VII block 14 signed\",\n              \"Invoices\",\n              \"EU DIWASS, future (recovery update)\",\n              \"PRN or PERN request submissions\"\n            ],\n            \"frontstageUser\": \"Perform the contracted R-code recovery operation under the facility's authorisation.\",\n            \"touchpoints\": [\n              \"Signed Annex VII copies returned, block 14\",\n              \"Emails\",\n              \"PRN or PERN\",\n              \"EU DIWASS, future\"\n            ],\n            \"frontstageService\": \"Facility signs Annex VII block 14 on completion of recovery. Recovery confirmation or certificate forwarded.\",\n            \"backstage\": \"Track recovery completion. The arranger receives signed Annex VII (block 14), recovery proof. Forwards recovery evidence to customer, feeding PRN and PERN claims. Chase block 14; escalate per contract if overdue.\",\n            \"supportProcess\": \"Facility operations under local authorisation; destination competent authority oversight. PERN claim service. Data analysis for regulatory targeting and fraud checks.\",\n            \"failurePoints\": [\n              \"Recovery failure, lost evidence\"\n            ]\n          },\n          \"break\": true\n        }\n      ]\n    },\n    {\n      \"id\": \"after\",\n      \"label\": \"AFTER\",\n      \"steps\": [\n        {\n          \"id\": \"records-reporting\",\n          \"label\": \"Records, reporting\",\n          \"subSteps\": [\n            \"Ongoing, minimum 3 years\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Regulators can detect non-compliance\",\n              \"Waste movement information supports circular economy goals (not the priority, but part of strategic objectives for CE)\"\n            ],\n            \"userOutcomes\": \"Audit-proof records, the light-touch permission to operate retained\",\n            \"regulatorOutcomes\": \"An enforceable evidence trail and a national picture of green list flows\",\n            \"preConditions\": \"Shipments in flight or complete, signed documents returning, reporting calendar live\",\n            \"postConditions\": \"3-year archive complete, monthly EA report filed, audits closed, registrations refreshed\",\n            \"actors\": [\n              \"Exporter and consignee (record keepers)\",\n              \"Regulator data and returns teams\",\n              \"Defra analysts\"\n            ],\n            \"artefacts\": [\n              \"3 year archive\",\n              \"Internal systems\",\n              \"Monthly reports, EA\",\n              \"EU DIWASS, future (reports)\"\n            ],\n            \"frontstageUser\": \"Retain contract and Annex VII copies for 3 years. Contract and stock management, reconcile records and internal audits.\",\n            \"touchpoints\": [\n              \"Company filing systems\",\n              \"EA returns channel\",\n              \"Regulator information notice\",\n              \"EU DIWASS upload, future\"\n            ],\n            \"frontstageService\": \"Submit monthly returns (England); upload records to DIWASS; respond to regulator requests within deadlines.\",\n            \"backstage\": \"Refresh annual EA export-activity registration; horizon-scan (EU export rule changes from May 2027; end of paper Annex VII in EU from 1 January 2027).\",\n            \"supportProcess\": \"Monthly returns process and data analysis for regulatory targeting.\",\n            \"failurePoints\": [\n              \"Lost evidence\"\n            ]\n          }\n        },\n        {\n          \"id\": \"oversight-enforcement\",\n          \"label\": \"Oversight and enforcement\",\n          \"subSteps\": [\n            \"Continuous, regulator-led\"\n          ],\n          \"cells\": {\n            \"policyOutcomes\": [\n              \"Regulators can detect non-compliance\",\n              \"Waste movement information supports circular economy goals (not the priority, but part of strategic objectives for CE)\"\n            ],\n            \"userOutcomes\": \"Audit-proof records, the light-touch permission to operate retained\",\n            \"regulatorOutcomes\": \"An enforceable evidence trail and a national picture of green list flows\",\n            \"preConditions\": \"Records up to date, complete and accurate, full supporting evidence available ready for audits and inspections\",\n            \"postConditions\": \"Audits complete and compliant, able to continue trading\",\n            \"actors\": [\n              \"Exporter and consignee (record keepers)\",\n              \"UK regulators (EA, NRW, SEPA, NIEA)\"\n            ],\n            \"artefacts\": [\n              \"3 year archive\",\n              \"Internal systems\",\n              \"Monthly reports, EA\",\n              \"EU DIWASS, future (reports)\"\n            ],\n            \"frontstageUser\": \"Facilitate regulatory inspections and audits. Provide records on demand and implement remedial or corrective actions.\",\n            \"touchpoints\": [\n              \"Inspection visits\",\n              \"Container stop notices\",\n              \"Enforcement letters and notices\",\n              \"Court proceedings\",\n              \"Published enforcement outcomes\"\n            ],\n            \"frontstageService\": \"Respond to competent authority information requests and inspections, on site or remotely.\",\n            \"backstage\": \"Periodic internal audit: classification review dates, facility evidence refresh, contract expiry, DIWASS and EA data reconciliation.\",\n            \"supportProcess\": \"EA compliance monitoring and audit; PRN and PERN accreditation checks.\",\n            \"failurePoints\": []\n          }\n        }\n      ]\n    }\n  ]\n}\n","overlaps.json":"{\n  \"kicker\": \"Service design\",\n  \"title\": \"Service Overlaps\",\n  \"standfirst\": \"Where Green List Waste meets the rest of the Digital Waste Tracking service, and in particular the reprocessors and exporters who report packaging waste.\",\n  \"asAt\": \"Illustrative. Planning estimates for discussion, to be validated with policy and RREPW data owners.\",\n  \"previewBlurb\": \"Green List Waste users are likely to have previously engaged with other CE or DWT services, such as collections, receipt-of-waste, PERN and RE/EX. This suggests commonalities in user journeys, data requirements, terminology and interaction patterns.\",\n  \"strip\": [\n    {\n      \"tag\": \"GLW\",\n      \"label\": \"Article 18 and Annex VII\"\n    },\n    {\n      \"tag\": \"RREPW\",\n      \"label\": \"PRNs and PERNs\"\n    },\n    {\n      \"tag\": \"Overlap\",\n      \"label\": \"Accredited exporters\"\n    }\n  ],\n  \"framing\": {\n    \"lead\": \"GLW and RREPW are separate regimes that meet at the point of export. They are not the same thing, and one does not replace the other.\",\n    \"columns\": [\n      {\n        \"id\": \"glw\",\n        \"tag\": \"GLW\",\n        \"title\": \"Batteries EPR\",\n        \"points\": [\n          \"The export of certain non-hazardous waste for recovery under Article 18 controls.\",\n          \"Supported by Annex VII shipment information that travels with the load.\",\n          \"Digital Waste Tracking captures that shipment data as a digital record.\"\n        ]\n      },\n      {\n        \"id\": \"rrepw\",\n        \"tag\": \"RREPW\",\n        \"title\": \"Reprocessors and exporters of packaging waste\",\n        \"points\": [\n          \"The reporting of reprocessed or exported packaging waste.\",\n          \"The issuing of PRNs and PERNs by registered and accredited operators.\",\n          \"Packaging-specific and PERN-specific requirements that GLW does not cover.\"\n        ]\n      }\n    ]\n  },\n  \"population\": {\n    \"title\": \"How large is the overlap?\",\n    \"lead\": \"The main overlap is likely to be accredited RREPW exporters who export packaging waste under Green List Waste controls. These users may already hold shipment-level data for Annex VII purposes that could support RREPW reporting and PERN assurance.\",\n    \"stats\": [\n      {\n        \"value\": \"~360\",\n        \"label\": \"RREPW users in total\",\n        \"note\": \"Approximate population.\"\n      },\n      {\n        \"value\": \"80 to 140\",\n        \"label\": \"may have meaningful GLW relevance\",\n        \"note\": \"Informed planning estimate.\"\n      },\n      {\n        \"value\": \"100 to 120\",\n        \"label\": \"reasonable working assumption\",\n        \"note\": \"The figure we plan against.\"\n      }\n    ],\n    \"note\": \"The overlap is probably modest by user count, but significant by other measures.\"\n  },\n  \"significance\": {\n    \"lead\": \"Modest by user count, significant by what those users move and the risk they carry.\",\n    \"cards\": [\n      {\n        \"title\": \"Exported tonnage\",\n        \"body\": \"A small number of accredited exporters can account for a large share of the material leaving the country.\"\n      },\n      {\n        \"title\": \"PERN value\",\n        \"body\": \"Export recycling notes carry financial value, so the exporting users sit at a high-value point in the system.\"\n      },\n      {\n        \"title\": \"Compliance burden\",\n        \"body\": \"These users carry obligations under both regimes, which is where duplicated effort concentrates.\"\n      },\n      {\n        \"title\": \"Duplicated reporting\",\n        \"body\": \"Shipment facts are captured once for Annex VII and again for RREPW, with no shared record today.\"\n      },\n      {\n        \"title\": \"Fraud and assurance risk\",\n        \"body\": \"High value plus paper-based evidence is exactly where assurance and fraud risk are highest.\"\n      }\n    ]\n  },\n  \"opportunity\": {\n    \"tag\": \"Opportunity\",\n    \"title\": \"Data reuse, not replacement\",\n    \"body\": [\n      \"The key service design opportunity is data reuse. GLW shipment data could potentially support RREPW validation, reduce re-keying and strengthen audit trails.\",\n      \"It would not replace RREPW. RREPW has packaging-specific and PERN-specific requirements that GLW does not capture.\"\n    ]\n  },\n  \"flow\": {\n    \"title\": \"How the parts connect\",\n    \"lead\": \"Collections and exports connect, but they do not necessarily overlap. The waste receiving site, where waste is taken to, is really where the export starts for Green List Waste.\",\n    \"stages\": [\n      {\n        \"id\": \"collections\",\n        \"label\": \"Collections\",\n        \"detail\": \"Waste is gathered from many sources.\"\n      },\n      {\n        \"id\": \"receiving\",\n        \"label\": \"Waste receiving site\",\n        \"detail\": \"Where waste is taken to. For Green List Waste, this is where the export begins.\",\n        \"start\": true\n      },\n      {\n        \"id\": \"exports\",\n        \"label\": \"Exports\",\n        \"detail\": \"The load is shipped for recovery under Article 18 controls with the Annex VII.\"\n      }\n    ],\n    \"parallel\": {\n      \"tag\": \"Parallel route\",\n      \"label\": \"Re-export above GLW\",\n      \"detail\": \"A separate re-export route runs in parallel above the Green List Waste path. It connects to exports without passing through the same collections-to-receiving chain.\"\n    }\n  },\n  \"hypothesis\": {\n    \"heading\": \"Working hypothesis\",\n    \"body\": \"The GLW and RREPW overlap is not large across the whole service, but it may be highly significant for exporters by value, risk and burden.\"\n  },\n  \"sources\": \"Planning estimates from discovery. Figures are illustrative and to be validated with policy owners and RREPW data owners.\",\n  \"showImagery\": false,\n  \"groupsHeading\": \"Examples of wider service and ecosystem data touchpoint overlaps\",\n  \"groups\": [\n    {\n      \"label\": \"Circular economy and DWT services\",\n      \"items\": [\n        \"Local Authority Payments (pEPR)\",\n        \"Waste Management and Environmental Permit Service\",\n        \"National Packaging Waste Database (NPWD)\",\n        \"Collections of waste\",\n        \"Receipt of waste\",\n        \"Reprocessors and Exporters (Re/Ex)\",\n        \"EPR Batteries and Packaging\",\n        \"International Waste Shipments (IWS)\",\n        \"EA interim solution\"\n      ]\n    },\n    {\n      \"label\": \"Wider government agency services\",\n      \"items\": [\n        \"HMRC EORI registration\",\n        \"HMRC CDS registration\",\n        \"HMRC CDS exports and imports service\",\n        \"Border Force service\"\n      ]\n    },\n    {\n      \"label\": \"External bodies and third-party services\",\n      \"items\": [\n        \"EU DIWASS registration\",\n        \"EU DIWASS exports and imports service\",\n        \"Other overseas OECD and non-OECD border force services\",\n        \"Container and ship tracking services\"\n      ]\n    }\n  ]\n}\n","key-takeaways.json":"{\n  \"kicker\": \"Service design\",\n  \"standfirst\": \"What the discovery found about how Green List Waste works today, and what each finding means for the shape of the service we build.\",\n  \"columns\": 3,\n  \"collapsible\": true,\n  \"groups\": [\n    {\n      \"id\": \"takeaways\",\n      \"open\": true,\n      \"label\": \"Service design takeaways\",\n      \"intro\": \"The regime as it stands: six findings that set the conditions any future service has to work within.\",\n      \"panels\": [\n        {\n          \"label\": \"It is a trust-based, paper-based regime\",\n          \"items\": [\n            \"Green list shipments move on self-declared paper Annex VII forms with [[no routine regulator approval]], so regulators only see problems after the waste has moved, and enforcement is largely reactive and intelligence led.\"\n          ]\n        },\n        {\n          \"label\": \"The UK is one policy, four regulators\",\n          \"items\": [\n            \"Defra owns the policy; the Environment Agency (England), Natural Resources Wales, SEPA (Scotland) and NIEA (Northern Ireland) each run their own registers, processes and digital maturity levels.\",\n            \"Businesses operating UK wide repeat themselves; Northern Ireland has extra complexity under the Windsor Framework.\"\n          ]\n        },\n        {\n          \"label\": \"The ground is shifting fast in 2026\",\n          \"items\": [\n            \"England introduced advance declarations, monthly reporting and receiving site evidence requirements from [[1 July 2026]].\",\n            \"The EU's new Waste Shipment Regulation and its digital platform (DIWASS) went live on [[21 May 2026]], with an EU ban on plastic waste exports to non-OECD countries from 21 November 2026.\",\n            \"UK exporters trading with or through the EU must align even though the UK is outside DIWASS.\"\n          ]\n        },\n        {\n          \"label\": \"The riskiest decisions happen earliest, with the least support\",\n          \"items\": [\n            \"Classifying waste correctly and checking per country rules for non-OECD destinations are the hardest, most error prone steps, and today they rely on scattered guidance and exporter judgement.\",\n            \"Misclassification turns a routine shipment into an illegal one.\"\n          ]\n        },\n        {\n          \"label\": \"Data exists but does not join up\",\n          \"items\": [\n            \"Annex VII forms, customs declarations, port inspections, monthly returns and overseas receipt confirmations are held in separate systems, or on paper.\",\n            \"No single view of a shipment exists for the exporter or the regulator: [[the biggest opportunity for improvement]].\"\n          ]\n        },\n        {\n          \"label\": \"Wider landscape: reuse potential\",\n          \"items\": [\n            \"Reusing familiar patterns and existing data could reduce duplicate data entry, improve consistency across services, lower the learning curve for users and reduce delivery risk.\"\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": \"considerations\",\n      \"open\": false,\n      \"label\": \"Service design considerations\",\n      \"intro\": \"What those findings ask of the design: the constraints to work with rather than against.\",\n      \"panels\": [\n        {\n          \"label\": \"Light touch by law, heavyweight in practice\",\n          \"body\": \"No approval gate means every control is self-managed; assurance is pushed to the edges, with 8 registrations before shipping and a 3-year reported evidence trail after. Design with this shape, not against it.\"\n        },\n        {\n          \"label\": \"Closure is the weakest link\",\n          \"body\": \"Two signatures (blocks 13 and 14) legally end every shipment: the [[highest consequence, least systematised]] data in the service, still paper or PDF chased by email.\"\n        },\n        {\n          \"label\": \"Classification is the master gate\",\n          \"body\": \"Nearly every downstream failure, including detention, rejection and illegal shipment findings, can be traced back to Stage 2. Outcomes depend on the quality of evidence gathered at this stage, such as laboratory results, photographs and dated destination checks.\"\n        },\n        {\n          \"label\": \"Liability does not travel\",\n          \"body\": \"It stays with the arranger, whoever holds the waste. The design question is not \\\"who does what\\\" but \\\"how does the accountable party see and prove what everyone else did\\\".\"\n        },\n        {\n          \"label\": \"Data plumbing is the biggest friction\",\n          \"body\": \"One shipment, three unconnected systems (IWS Online, DIWASS, CDS). [[Mismatch, not missing paperwork]], is the top cause of border holds, so anything that does not fix triple keying only works around the problem.\"\n        },\n        {\n          \"label\": \"CE and DWT service overlaps\",\n          \"body\": \"Green List Waste users are likely to have previously engaged with other CE or DWT services, such as collections, receipt-of-waste, PERN and RE/EX. This suggests commonalities in user journeys, data requirements, terminology and interaction patterns.\"\n        },\n        {\n          \"label\": \"Four regimes, one name\",\n          \"body\": \"England only duties, devolved variation, Northern Ireland under EU rules, and EU, OECD and non-OECD routes. Handle the variants explicitly or drive convergence: ignoring them creates loopholes at internal borders.\"\n        },\n        {\n          \"label\": \"Cost lives in exceptions\",\n          \"body\": \"Take back, demurrage and enforcement dwarf routine spend; value every upstream improvement by the exception volume it removes.\"\n        },\n        {\n          \"label\": \"Hard deadlines need failure paths\",\n          \"body\": \"The 2 working day DIWASS rule and customs cut-offs strand lawful loads unless rebooking and correction routes are designed in.\"\n        },\n        {\n          \"label\": \"Proportionality is a coverage issue\",\n          \"body\": \"Burden that outgrows small operators risks pushing them out of the regime, losing sight of exactly who it most needs to see.\"\n        },\n        {\n          \"label\": \"API integration\",\n          \"body\": \"Any API integration service should be managed as an end to end service that enables people and organisations to achieve meaningful outcomes. Its value is not determined solely by technical availability, but by how easily consumers can discover, integrate, adopt and operate it, and by the quality of experience ultimately delivered to customers, employees and partners.\"\n        }\n      ]\n    }\n  ]\n}\n","architecture.json":"{\n  \"kicker\": \"Technical Overview\",\n  \"title\": \"As-Is Technical Architecture\",\n  \"standfirst\": \"Before designing anything new, map what Digital Waste Tracking already runs - then reuse it wherever a Green List Waste service would otherwise rebuild it.\",\n  \"intro\": [\n    \"Green List Waste will not be built on a blank sheet. It sits inside Defra's Digital Waste Tracking (DWT) programme, which already runs a set of interconnected services covering the waste-tracking journey - from the external-facing APIs industry submits to, through to the backends that identify, record and process movements.\",\n    \"The first job of this discovery is therefore not to design new systems, but to map the ones that already exist and work out what a Green List Waste service could reuse rather than rebuild. Every capability we inherit is one less thing to build, secure and pay to run twice - and it keeps industry on a single, consistent way of working across DWT.\",\n    \"Four existing services stand out immediately. The [[Waste Tracking ID service]] already mints the unique identifiers every movement needs; the [[Waste Organisation service]] already solves organisation registration, API-credential management and the regulatory service charge; [[Defra ID]] already provides the identity a user signs in with; and the [[Waste Organisation Frontend]] already gives organisations the screens to register themselves and generate the API codes their systems integrate with. A Green List Waste service would need all four - so the starting assumption is reuse, with a clear reason required to build anew.\"\n  ],\n  \"reuseLead\": \"Four services already solve problems a Green List Waste service will face on day one:\",\n  \"reuse\": [\n    {\n      \"name\": \"Waste Tracking ID service\",\n      \"node\": \"wtid-be\",\n      \"body\": \"A small, single-purpose microservice whose only job is to mint unique waste tracking identifiers (format YYXXXXXX - a year prefix plus a Sqids-encoded counter). Any GLW movement needs an identifier; this one is collision-free, short, and resets safely each year.\"\n    },\n    {\n      \"name\": \"Waste Organisation service\",\n      \"node\": \"worg-be\",\n      \"body\": \"The system of record for organisations: registration and ownership, the API codes external parties integrate with, and the GOV.UK Pay service-charge payment. GLW onboarding, credentials and charging would otherwise rebuild all of this from scratch.\"\n    },\n    {\n      \"name\": \"Defra ID\",\n      \"node\": \"defraid\",\n      \"body\": \"The OIDC identity provider organisations already sign in through on the Waste Organisation Frontend. A GLW service authenticating users would inherit this rather than integrating a second identity provider - and with it, GOV.UK One Login and Government Gateway come along automatically as the two credential routes Defra ID already supports, with no separate integration work.\"\n    },\n    {\n      \"name\": \"Waste Organisation Frontend\",\n      \"node\": \"worg-fe\",\n      \"body\": \"The self-service screens where an organisation registers itself and generates an API code. Those codes are expected to be scoped so the same one works for both green-list waste exports and domestic movements (receipt of waste), giving exporters a single registration and a single credential across DWT.\"\n    }\n  ],\n  \"diagram\": {\n    \"hint\": \"Hover or tap any box to read what it is and where it sits.\",\n    \"legend\": [\n      { \"kind\": \"gov\", \"label\": \"Programme\" },\n      { \"kind\": \"stream\", \"label\": \"Workstream / team\" },\n      { \"kind\": \"iface\", \"label\": \"External interface\" },\n      { \"kind\": \"backend\", \"label\": \"Backend service\" },\n      { \"kind\": \"platform\", \"label\": \"Shared platform\" }\n    ],\n    \"tiers\": [\n      {\n        \"label\": \"Governance\",\n        \"nodes\": [\n          { \"id\": \"defra\", \"label\": \"Defra\", \"kind\": \"gov\", \"short\": \"The department. Digital Waste Tracking is delivered within Defra's wider Waste & Circular Economy function.\" },\n          { \"id\": \"ce\", \"label\": \"Waste & Circular Economy\", \"kind\": \"gov\", \"short\": \"The Defra function that owns waste and resources policy - the strategic home of the DWT programme.\" },\n          { \"id\": \"dwt\", \"label\": \"Digital Waste Tracking\", \"kind\": \"gov\", \"short\": \"The programme delivering the interconnected services that track waste from receipt through to export. Green List Waste is one of its workstreams.\" }\n        ]\n      },\n      {\n        \"label\": \"Workstreams\",\n        \"nodes\": [\n          { \"id\": \"row\", \"label\": \"Receipt of Waste - Team A\", \"kind\": \"stream\", \"short\": \"The workstream that records waste receipts at the point waste arrives at a facility. Owns the Waste Movement External API and its backends.\" },\n          { \"id\": \"worg\", \"label\": \"Waste Organisation - Team B\", \"kind\": \"stream\", \"short\": \"The workstream that manages the organisations themselves - registration, API credentials, service-charge payments and bulk spreadsheet uploads.\" },\n          { \"id\": \"glw\", \"label\": \"Green List Waste\", \"kind\": \"stream\", \"short\": \"This discovery. A future service for green-list waste exports that should reuse the ID, organisation and platform services rather than rebuild them.\" },\n          { \"id\": \"collections\", \"label\": \"Collections\", \"kind\": \"stream\", \"short\": \"A further DWT workstream in the wider estate, shown here for context of where GLW sits alongside its siblings.\" }\n        ]\n      },\n      {\n        \"label\": \"External interfaces\",\n        \"nodes\": [\n          { \"id\": \"wm-api\", \"label\": \"Waste Movement External API\", \"kind\": \"iface\", \"short\": \"The external-facing entry point industry uses to record waste receipts. An orchestration layer - it stores nothing itself, coordinating the ID, organisation and movement backends over authenticated calls.\" },\n          { \"id\": \"worg-fe\", \"label\": \"Waste Organisation Frontend\", \"kind\": \"iface\", \"reuse\": true, \"short\": \"Reuse candidate. The GOV.UK-styled web app organisations log into to register themselves and generate API codes. A thin presentation layer over the Waste Organisation Backend; authentication is via Defra ID. Codes are expected to be scoped for both green-list exports and domestic movements.\" },\n          { \"id\": \"ss-upload\", \"label\": \"Spreadsheet Upload\", \"kind\": \"iface\", \"short\": \"The bulk-submission on-ramp. Not a standalone system but a callback-driven pipeline spanning the frontend, the shared CDP Uploader and the organisation backend.\" }\n        ]\n      },\n      {\n        \"label\": \"Backend services\",\n        \"nodes\": [\n          { \"id\": \"wm-be\", \"label\": \"Waste Movement Backend\", \"kind\": \"backend\", \"short\": \"The system of record behind the External API. Persists movements in MongoDB with revision-based versioning, immutable history, optimistic locking and audit logs.\" },\n          { \"id\": \"wm-be-uat\", \"label\": \"Waste Movement Backend (UAT)\", \"kind\": \"backend\", \"short\": \"The UAT deployment of the Waste Movement Backend used for pre-production testing of the movement persistence service.\" },\n          { \"id\": \"wtid-be\", \"label\": \"Waste Tracking ID Backend\", \"kind\": \"backend\", \"reuse\": true, \"short\": \"Reuse candidate. A single-purpose microservice that mints unique waste tracking IDs (YYXXXXXX). Called by the External API every time a new movement is logged.\" },\n          { \"id\": \"worg-be\", \"label\": \"Waste Organisation Backend\", \"kind\": \"backend\", \"reuse\": true, \"short\": \"Reuse candidate. The system of record for organisations, API codes, service-charge payments and spreadsheet uploads - already solving GLW onboarding and charging.\" }\n        ]\n      },\n      {\n        \"label\": \"Shared platform\",\n        \"nodes\": [\n          { \"id\": \"defraid\", \"label\": \"Defra ID\", \"kind\": \"platform\", \"reuse\": true, \"short\": \"Reuse candidate. The OIDC identity provider (real in production, a stub locally) organisations already sign in through via the Waste Organisation Frontend. GLW would inherit this identity dependency rather than integrate a second one.\" },\n          { \"id\": \"on
