.pr-dot{width:9px;height:9px;border-radius:50%;background:var(--pr-accent);flex:0 0 auto}
.pr-cards{display:flex;flex-direction:column;gap:14px}
.pr-card{position:relative;border:1px solid var(--hair);border-radius:12px;background:var(--surface);
  padding:20px 22px 22px;border-top:3px solid var(--pr-accent)}
.pr-card h3{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.2;margin:0 0 9px;color:var(--fg)}
.pr-card p{margin:0;font-size:16px;line-height:1.6;color:var(--sub)}

@media(max-width:820px){
  .principles{grid-template-columns:1fr}
}

,\n      \"type\": \"blueprint-link\",\n      \"data\": \"05-service-blueprint.json\",\n      \"group\": \"service-outline\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"overlaps\",\n      \"nav\": \"Overlaps\",\n      \"title\": \"Service Overlaps\",\n      \"type\": \"overlaps-link\",\n      \"data\": \"overlaps.json\",\n      \"group\": \"service-outline\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"key-takeaways\",\n      \"nav\": \"Key takeaways\",\n      \"title\": \"Key Takeaways and Considerations\",\n      \"type\": \"panels\",\n      \"data\": \"key-takeaways.json\",\n      \"group\": \"service-outline\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"tech-architecture\",\n      \"nav\": \"As-Is architecture\",\n      \"title\": \"As-Is Technical Architecture\",\n      \"type\": \"arch-link\",\n      \"data\": \"architecture.json\",\n      \"group\": \"technical-overview\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"tech-api\",\n      \"nav\": \"API and data flow\",\n      \"title\": \"API and Data Flow Approach\",\n      \"type\": \"api-link\",\n      \"data\": \"api-flow.json\",\n      \"group\": \"technical-overview\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"tech-assumptions\",\n      \"nav\": \"Assumptions\",\n      \"title\": \"Architecture Assumptions and Constraints\",\n      \"type\": \"assumptions-link\",\n      \"data\": \"architecture-assumptions.json\",\n      \"group\": \"technical-overview\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"recommendations\",\n      \"nav\": \"Recommendations\",\n      \"title\": \"Discovery Recommendations\",\n      \"type\": \"recommendations\",\n      \"data\": \"recommendations.json\",\n      \"group\": \"recommendations\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"alpha\",\n      \"nav\": \"Alpha plan\",\n      \"title\": \"The Alpha Plan\",\n      \"type\": \"alpha-link\",\n      \"data\": \"alpha-plan.json\",\n      \"group\": \"recommendations\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"sow-outcomes\",\n      \"nav\": \"SOW outcomes\",\n      \"title\": \"Statement of Work Outcomes\",\n      \"type\": \"table\",\n      \"data\": \"sow-outcomes.json\",\n      \"group\": \"recommendations\",\n      \"enabled\": true\n    },\n    {\n      \"id\": \"appendix\",\n      \"nav\": \"Appendix\",\n      \"title\": \"Appendix\",\n      \"type\": \"appendix-link\",\n      \"data\": \"appendix-link.json\",\n      \"enabled\": true\n    }\n  ]\n}\n","01-introduction.md":"---\nkicker: \"Discovery Readout\"\nheadline: \"[[Waste without a trace]]: the import export data & accountability gap\"\nstandfirst: \"A discovery engagement into Green List Waste: the highest-volume, lowest-visibility flow in the UK's transboundary system. It runs on a single paper form, the exporter's own judgement, and trust in a recovery facility nobody has verified.\"\nmeta:\n  - label: \"Engagement\"\n    value: \"Batteries EPR\"\n  - label: \"Duration\"\n    value: \"10 weeks\"\n  - label: \"Readout\"\n    value: \"Findings and opportunities\"\ncaption: \"sorted, shipped, exported · around 10m tonnes a year, of which [[<1% is inspected]]\"\n---\n\nThis readout consolidates what the discovery has surfaced so far: who the users are, where the journey breaks, how the wider circular-economy and Digital Waste Tracking ecosystem fits together, and where there is most value in acting first.\n","strategic-overview.json":"{\n  \"kicker\": \"Strategic context\",\n  \"standfirst\": \"Problem, opportunity and policy goals at a glance, and how the work aligns to the wider programme.\",\n  \"rows\": [\n    { \"key\": \"User value\", \"value\": \"Make compliance simpler, regulation smarter, and waste-export data actionable.\" },\n    { \"key\": \"Problem summarised\", \"value\": \"A paper, self-declared Annex VII regime gives regulators almost no live view of green-listed exports, until something goes wrong.\" },\n    { \"key\": \"Opportunity\", \"value\": \"Use the move to digital (Phase 2, October 2027) to remove specific failure modes, not just to digitise the form.\" },\n    { \"key\": \"Policy goals\", \"value\": \"Higher compliance, intelligence-led enforcement, verified destinations and a single four-nation service.\" },\n    { \"key\": \"Strategic alignment\", \"value\": \"Supports Defra circular-economy ambitions, the EA's 2026 reporting reforms and the mandatory DWT programme.\" }\n  ],\n  \"link\": { \"href\": \"key-dates.html\", \"label\": \"Open key dates and milestones →\" },\n  \"note\": \"Source: GLW internal briefing and discovery plan, Defra DWT (May 2026).\"\n}\n","02-the-problem.md":"---\nkicker: \"Problem statement\"\nstandfirst: \"The UK lacks a data-driven framework for overseeing Green List Waste movements across imports and exports.\"\n---\n\nFragmented paper-based Annex VII processes and inconsistencies across England, Scotland, Wales and Northern Ireland give regulators poor visibility of waste flows.\n\n**What it leads to.** This evidence gap undermines proportionate export controls, enables regulatory arbitrage between nations, and weakens enforcement. The figures below frame the scale of the gap.\n","metrics.json":"{\n  \"items\": [\n    { \"value\": 10, \"prefix\": \"~\", \"suffix\": \"Mt\", \"decimals\": 0, \"label\": \"waste exported from the UK each year; plastic alone 598kt in 2024 (UK is the 3rd-largest plastic-waste exporter)\", \"source\": \"Statista UK plastic-waste exports, 2024\", \"tone\": \"default\" },\n    { \"value\": 238741, \"decimals\": 0, \"separator\": true, \"label\": \"businesses offering waste services in England appear unregistered, about 63% of the total\", \"source\": \"Material Focus study, 2021\", \"tone\": \"warn\" },\n    { \"value\": 1, \"prefix\": \"<\", \"suffix\": \"%\", \"decimals\": 0, \"label\": \"of export containers inspected at port, roughly 1,000 to 1,900 a year\", \"source\": \"EA port-inspection data, 2018/19 to 2021\", \"tone\": \"warn\" },\n    { \"value\": 4, \"prefix\": \"~1 in \", \"decimals\": 0, \"label\": \"inspected containers stopped as non-compliant, about 200 to 470 turned back each year\", \"source\": \"EA enforcement data\", \"tone\": \"default\" },\n    { \"value\": 900, \"prefix\": \"£\", \"suffix\": \"m\", \"decimals\": 0, \"label\": \"estimated annual cost of waste crime to England\", \"source\": \"NAO waste crime report, 2022\", \"tone\": \"warn\" },\n    { \"value\": 6000, \"prefix\": \"~\", \"decimals\": 0, \"separator\": true, \"label\": \"sites routinely report waste data, of 10,000+ permits the EA regulates\", \"source\": \"EA regulated-business data, 2024\", \"tone\": \"default\" },\n    { \"value\": 500, \"prefix\": \"~\", \"suffix\": \"k\", \"decimals\": 0, \"label\": \"exports of green-list waste estimated annually; a rough, multi-source estimate that could differ significantly in reality\", \"source\": \"EA discussion, July 2026\", \"tone\": \"default\" },\n    { \"value\": 90, \"prefix\": \"~\", \"suffix\": \"%\", \"decimals\": 0, \"label\": \"of notified amber-list exports went to the EU last year (253 of 283); the same trend is expected for green-list waste\", \"source\": \"EA discussion, July 2026\", \"tone\": \"warn\" }\n  ]\n}\n","governing-instruments.json":"{\n  \"title\": \"Governing instruments and policy intent\",\n  \"subtitle\": \"The four instruments that govern Green List Waste, and the policy intent they serve\",\n  \"intro\": \"How the Basel Convention, the OECD Decision, the EU Waste Shipment Regulation and the UK Transfrontier Shipment of Waste Regulations stack together, and feed the UK's Digital Waste Tracking and green-list shipment policy. Read top to bottom, they form a single nested chain rather than four separate rules.\",\n  \"asAt\": \"Status as at June 2026\",\n  \"instruments\": [\n    {\n      \"id\": \"basel\",\n      \"name\": \"Basel Convention (1989)\",\n      \"tier\": \"Global floor\",\n      \"what\": \"UN treaty controlling transboundary movements of hazardous and \\\"other\\\" wastes and their disposal. Aim: protect human health and the environment, especially in developing countries, from unsound waste dumping. Core mechanism is Prior Informed Consent (PIC): notify exporting, transit and importing states; ship only once consent and a movement document are issued.\",\n      \"greenList\": \"Annex IX lists non-hazardous \\\"green\\\" wastes generally outside PIC; B-codes (for example B3011) identify them. 2019 plastics and 2022 e-waste amendments pulled more streams into PIC.\",\n      \"status\": \"In force; UK is a Party. Plastics (2021) and e-waste (in force 1 Jan 2025) amendments tightened scope.\",\n      \"feedsIntent\": \"The global floor. It defines what counts as hazardous versus green-listed and the notify-consent-track logic that UK tracking and shipment controls must reproduce.\"\n    },\n    {\n      \"id\": \"oecd\",\n      \"name\": \"OECD Decision C(2001)107/FINAL\",\n      \"tier\": \"OECD recovery fast track\",\n      \"what\": \"OECD Council Decision establishing a risk-based control system for wastes destined for recovery moving between OECD member countries. Built to harmonise with Basel and avoid duplicate procedures.\",\n      \"greenList\": \"Two tiers replace the old green/amber/red split: a Green control procedure (general information requirements) and an Amber control procedure (notification and consent). Uses two-letter codes (for example AC300). Lets recyclable material move more freely between OECD states than Basel's default.\",\n      \"status\": \"In force across 38 OECD members including the UK; periodically updated to track Basel list changes.\",\n      \"feedsIntent\": \"Provides the recovery-focused, OECD-to-OECD fast track. It is why green-list recyclables can move on information-only terms, the regime UK exporters most rely on.\"\n    },\n    {\n      \"id\": \"eu-wsr\",\n      \"name\": \"EU Waste Shipment Regulation (EU) 2024/1157\",\n      \"tier\": \"EU direction of travel\",\n      \"what\": \"New EU regulation on shipments of waste; repeals and replaces Regulation (EC) 1013/2006. Goal: protect environment and health, support circular economy, climate neutrality and zero pollution by curbing problem exports.\",\n      \"greenList\": \"Keeps green-listed shipments within EU/OECD on general information requirements (Annex VII). Introduces stricter conditions on green-listed waste exports to non-OECD countries and stronger anti-illegal-shipment and digitalisation provisions.\",\n      \"status\": \"In force 20 May 2024; most provisions apply from 21 May 2026, most export rules from 21 May 2027. Replaces 1013/2006.\",\n      \"feedsIntent\": \"Not binding on the UK post-Brexit, but the reference point for alignment, trade with EU partners, and the direction of travel on digital, traceable shipments.\"\n    },\n    {\n      \"id\": \"uk-tfs\",\n      \"name\": \"UK Transfrontier Shipment of Waste Regulations 2007 (as amended)\",\n      \"tier\": \"UK legal hook\",\n      \"what\": \"The domestic regime giving effect in the UK to Basel and the OECD Decision (originally via retained EU Reg 1013/2006). Governs all imports and exports of waste, including for recovery and recycling.\",\n      \"greenList\": \"Permits export of specified non-hazardous green-list waste for recovery to OECD states and certain non-OECD states, with an Annex VII movement form travelling with the load. Green-list to non-OECD countries may be banned, need written consent, or be uncontrolled depending on the destination.\",\n      \"status\": \"In force; operated by the four UK environmental regulators. Being updated alongside the new UK Plan for Shipments of Waste and digital tracking reforms.\",\n      \"feedsIntent\": \"The legal hook in UK law. It is the instrument Digital Waste Tracking plugs into: the Annex VII data set for green-list shipments becomes a tracked, digital record.\"\n    }\n  ],\n  \"thread\": {\n    \"heading\": \"The policy-intent thread\",\n    \"lead\": \"Basel sets the global floor, defining hazardous versus green-listed waste and the prior-informed-consent logic. The OECD Decision sits on top for OECD-to-OECD recovery, creating the lighter \\\"Green\\\" control procedure that lets recyclables move on information-only terms. The EU WSR (2024/1157) implements both for the EU bloc and signals the direction of travel: tighter exports to non-OECD destinations and mandatory digitalisation. The UK TFS Regulations are the domestic hook that gives all of this legal force in the UK.\",\n    \"points\": [\n      { \"title\": \"Legitimate recovery flows freely\", \"body\": \"Genuine green-list recyclables to OECD markets stay on light-touch information requirements (Annex VII), keeping the circular economy moving without disproportionate friction.\" },\n      { \"title\": \"Illegitimate or high-risk flows are caught\", \"body\": \"The notify-consent-track architecture from Basel/OECD, hardened by the EU's 2027 export rules, exists to stop waste being dumped on countries that cannot manage it soundly: the problem all four instruments were written to solve.\" },\n      { \"title\": \"Data makes the controls real\", \"body\": \"Digital Waste Tracking (mandatory from 2026) turns the paper Annex VII data set into a digital record captured when green-list waste reaches the first UK receiving site, with extra fields such as receptacle type and UK point of entry/exit. That gives regulators the traceability the older paper regime could not, and aligns the UK with the EU's digital direction.\" }\n    ],\n    \"closing\": \"In short: the international instruments define what is controlled and how consent works; the UK TFS Regulations make it domestic law; and Digital Waste Tracking is the delivery mechanism that operationalises green-list controls as verifiable, real-time data.\"\n  },\n  \"sources\": \"EUR-Lex (Reg (EU) 2024/1157); legislation.gov.uk (TFS Regs 2007); basel.int; OECD C(2001)107/FINAL; GOV.UK Digital Waste Tracking service.\"\n}\n","policy-intent.json":"{\n  \"kicker\": \"Understanding policy\",\n  \"standfirst\": \"Policy intent: enable legitimate Green List Waste movements while ensuring accountability, traceability and environmental protection. The outcomes below are the guiding principles the service is held against.\",\n  \"rows\": [\n    { \"key\": \"Legitimate recovery is enabled\", \"value\": \"Good-quality Green List Waste moves efficiently to legitimate recovery markets.\" },\n    { \"key\": \"Environmental harm is prevented\", \"value\": \"Waste is managed and recovered to appropriate environmental standards.\" },\n    { \"key\": \"Waste movements are traceable\", \"value\": \"Parties can understand where waste came from, where it went and what happened to it.\" },\n    { \"key\": \"Responsibility is clear\", \"value\": \"Obligations and accountable parties can be identified when needed.\" },\n    { \"key\": \"Compliance can be demonstrated\", \"value\": \"Sufficient information exists to provide assurance and investigate concerns.\" },\n    { \"key\": \"CE outcomes are supported\", \"value\": \"Government can better understand how valuable materials are recovered and reused.\" },\n    { \"key\": \"Waste is correctly classified\", \"value\": \"Only genuine Green List waste moves under Article 18, supported by consistent Annex VII data.\" }\n  ],\n  \"link\": { \"href\": \"policy-metrics.html\", \"label\": \"Open policy metrics →\" },\n  \"note\": \"Shared understanding from policy-owner discussions. Article 18 of the Waste Shipment Regulations establishes the requirement for information to accompany a shipment; the Annex VII is the document used to comply with it, travelling with the load as evidence. The four environmental regulators (EA, NRW, SEPA, NIEA) enforce within their own jurisdictions. The detailed outcome-to-assurance mapping is a working draft. Sources: policy-owner discussions; retained EU WSR (EC) 1013/2006; EU Reg 2024/1157 (Northern Ireland).\"\n}\n","discovery-goal.json":"{\n  \"kicker\": \"Discovery goal\",\n  \"standfirst\": \"By the end of discovery, we will have sufficient evidence to recommend whether a digital waste tracking service for Green List Waste should progress to alpha. The vision: convert GLW from a self-declared, retrospective paper trail into a structured, validated, near-real-time data flow the regulator can act on.\",\n  \"columns\": 5,\n  \"cards\": [\n    { \"index\": \"01\", \"title\": \"User needs\", \"body\": \"What users are trying to achieve.\" },\n    { \"index\": \"02\", \"title\": \"Service challenges\", \"body\": \"Where the service breaks today.\" },\n    { \"index\": \"03\", \"title\": \"Opportunities\", \"body\": \"Where we could improve.\" },\n    { \"index\": \"04\", \"title\": \"Key constraints\", \"body\": \"Legal, technical and data limits.\" },\n    { \"index\": \"05\", \"title\": \"Assumptions to test\", \"body\": \"What still needs validating.\" }\n  ],\n  \"note\": \"Source: GLW discovery plan, Defra DWT (May 2026).\"\n}\n","guiding-principles.json":"{\n  \"kicker\": \"How we decide\",\n  \"standfirst\": \"This discovery is guided by the following principles, as stated in the Statement of Work.\",\n  \"groups\": [\n    {\n      \"audience\": \"For users\",\n      \"principles\": [\n        { \"title\": \"Minimise cost to comply\", \"body\": \"Data should be captured with minimal friction and operational overhead on businesses.\" },\n        { \"title\": \"Minimise cost to regulate\", \"body\": \"Monitoring and fraud spotting should make efficient use of limited Regulator resources. Operational overhead to regulate the system should reduce over time.\" }\n      ]\n    },\n    {\n      \"audience\": \"For DDTS\",\n      \"principles\": [\n        { \"title\": \"Minimise cost and speed to build\", \"body\": \"Components (front end, back end, data models and so on) should be standardised across Circular services.\" }\n      ]\n    },\n    {\n      \"audience\": \"For Government\",\n      \"principles\": [\n        { \"title\": \"Maximise impact\", \"body\": \"Maximise impact on the goals of the Circular Economy and Waste Outcome Delivery Group.\" }\n      ]\n    }\n  ],\n  \"note\": \"Source: GLW Statement of Work (Defra DWT).\"\n}\n","research-overview.json":"{\n  \"kicker\": \"User research\",\n  \"standfirst\": \"Why this research was run and what it set out to answer.\",\n  \"columns\": 2,\n  \"panels\": [\n    {\n      \"label\": \"Regulator Users\",\n      \"items\": [\n        \"Hear directly from [[regulators]] and understand their experiences in their own words\",\n        \"Validate and build a shared understanding of the Green List Waste chain, current regulatory processes, activities and challenges\",\n        \"Identify key pain points, frustrations and unmet needs across regulatory organisations\",\n        \"Prioritise the most pressing challenges through collaborative discussion and voting exercises\",\n        \"Explore opportunities for improvement and innovation within the current operating environment\"\n      ]\n    },\n    {\n      \"label\": \"Industry Users\",\n      \"items\": [\n        \"Understand existing workflows, activities and how GLW movements are tracked and managed\",\n        \"Identify pain points, risks and opportunities for improvement\",\n        \"Assess digital capabilities, tools and technical confidence\",\n        \"Explore behaviours, motivations and compliance need\",\n        \"Inform the design of future DWT services and journeys\"\n      ]\n    }\n  ]\n}\n","regulator-sample.json":"{\n  \"kicker\": \"User research\",\n  \"standfirst\": \"Who we spoke to: [[8 participants]] across all four UK environmental regulators, spanning the functions involved in Green List Waste oversight, compliance and enforcement.\",\n  \"columns\": 2,\n  \"panels\": [\n    {\n      \"label\": \"Participant Sample (n=8)\",\n      \"items\": [\n        \"Representation from [[all four UK environmental regulators]]: Environment Agency (EA), Natural Resources Wales (NRW), Scottish Environment Protection Agency (SEPA) and Northern Ireland Environment Agency (NIEA)\",\n        \"Representation of [[key regulatory functions]] involved in Green List Waste oversight, compliance and enforcement\",\n        \"Mix of roles and responsibilities, providing insight into both operational activities and wider organisational considerations\",\n        \"All participants involved in, or responsible for, the [[regulation of Green List Waste movements]]\"\n      ]\n    },\n    {\n      \"label\": \"Participant Spread\",\n      \"tables\": [\n        {\n          \"caption\": \"Participants represented all four UK regulatory jurisdictions, including Scotland, Northern Ireland, England and Wales.\",\n          \"columns\": [\"Jurisdiction\", \"Count\"],\n          \"rows\": [\n            [\"Scotland (SEPA)\", 2],\n            [\"Northern Ireland (NIEA)\", 3],\n            [\"England (EA)\", 2],\n            [\"Wales (NRW)\", 1]\n          ],\n          \"total\": [\"Total\", 8]\n        }\n      ]\n    }\n  ]\n}\n","user-sample.json":"{\n  \"kicker\": \"User research\",\n  \"standfirst\": \"Who we spoke to: [[14 participants]] across all four UK nations, spanning operator size, type and regulatory jurisdiction.\",\n  \"columns\": 2,\n  \"panels\": [\n    {\n      \"label\": \"Participant Sample (n=14)\",\n      \"items\": [\n        \"[[Geographic spread across all four UK nations]], range of waste chain activities (including imports and exports), waste types and volumes\",\n        \"[[Spread of operator size, type]] (pure-play actors, hybrid actors and orchestrators) and [[geographic boundary]]\",\n        \"All involved in [[Article 18 / Annex VII reporting]]\",\n        \"Varying levels of [[regulatory engagement]], digital capability, digital inclusion, and access needs\",\n        \"[[Fluent English speakers]] able to articulate their processes, challenges and experiences\"\n      ]\n    },\n    {\n      \"label\": \"Participant Spread\",\n      \"tables\": [\n        {\n          \"caption\": \"The sample was predominantly hybrid operators, with a smaller number of orchestrators and one pure-play operator.\",\n          \"columns\": [\"Actor\", \"Count\"],\n          \"rows\": [\n            [\"Pure-play actor\", 1],\n            [\"Hybrid actor\", 10],\n            [\"Orchestrator\", 3]\n          ],\n          \"total\": [\"Total\", 14]\n        },\n        {\n          \"caption\": \"Participants represented all UK regulatory jurisdictions, including Scotland, Northern Ireland, England, Wales and inter-domestic operators.\",\n          \"columns\": [\"Primary jurisdiction\", \"Count\"],\n          \"rows\": [\n            [\"Scotland (SEPA)\", 2],\n            [\"Northern Ireland (NIEA)\", 2],\n            [\"England (EA)\", 6],\n            [\"Wales (NRW)\", 1],\n            [\"Multiple\", 3]\n          ],\n          \"total\": [\"Total\", 14]\n        }\n      ]\n    }\n  ]\n}\n","regulator-observations.json":"{\n  \"kicker\": \"User research\",\n  \"standfirst\": \"What regulators told us across the workshops, grouped into themes. Each theme collapses to its headline; open it for the evidence behind it.\",\n  \"themes\": [\n    {\n      \"id\": \"post-departure-visibility\",\n      \"title\": \"Post-departure visibility is the dominant challenge across all regulators\",\n      \"insight\": \"Visibility is limited before export and [[reduces further]] once shipments leave UK jurisdiction.\",\n      \"observations\": [\n        {\n          \"points\": [\n            \"Regulators consistently reported [[losing visibility of waste movements once shipments leave UK jurisdiction]], despite retaining responsibility for addressing issues that subsequently arise\",\n            \"Participants described limited access to reliable information on shipment status, destination receipt and downstream treatment outcomes\",\n            \"Monitoring activity often depends on reactive information sharing, reports from overseas authorities or intelligence received after an issue has emerged\",\n            \"The lack of end-to-end visibility reduces confidence that Green List Waste reaches the intended destination and is managed as expected\",\n            \"This challenge was raised independently by all regulators and emerged as the [[most consistent theme across the workshops]]\"\n          ]\n        }\n      ],\n      \"contexts\": [\n        {\n          \"title\": \"Current state\",\n          \"standfirst\": \"Regulatory responsibility continues beyond export, but visibility and influence diminish significantly.\",\n          \"columns\": [\n            {\n              \"label\": \"Before export\",\n              \"meta\": \"Within UK jurisdiction, partial visibility\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Partial visibility\",\n                \"Varies by regulator\",\n                \"Reliance on retrospective reporting\"\n              ],\n              \"verdict\": {\n                \"label\": \"Limited pre-export risk assessment\",\n                \"body\": \"Exporter, carrier, route and compliance checks are visible only in part, and the Annex VII is often received retrospectively.\"\n              }\n            },\n            {\n              \"label\": \"At export\",\n              \"meta\": \"Point of export\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Limited intervention opportunities\",\n                \"Little advance shipment intelligence\"\n              ],\n              \"verdict\": {\n                \"label\": \"Visibility drops further at export\",\n                \"body\": \"The last point at which regulators physically control the waste.\"\n              }\n            },\n            {\n              \"label\": \"After export\",\n              \"meta\": \"Beyond UK jurisdiction, minimal visibility\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Reduced visibility\",\n                \"Delayed intelligence\",\n                \"Reduced influence\"\n              ],\n              \"verdict\": {\n                \"label\": \"Minimal visibility after export\",\n                \"body\": \"Destination receipt and downstream treatment outcomes are largely unseen.\"\n              }\n            }\n          ]\n        },\n        {\n          \"title\": \"Desired state\",\n          \"standfirst\": \"Better data. Earlier insight. Stronger regulation.\",\n          \"columns\": [\n            {\n              \"label\": \"Advance shipment information\",\n              \"meta\": \"Before export\",\n              \"tone\": \"positive\",\n              \"items\": [\n                \"Timely and complete data\",\n                \"Shared consistently across regulators\"\n              ],\n              \"verdict\": {\n                \"label\": \"Early visibility enables risk assessment and targeting\"\n              }\n            },\n            {\n              \"label\": \"Risk assessment before movement\",\n              \"meta\": \"At export\",\n              \"tone\": \"positive\",\n              \"items\": [\n                \"Risk-based targeting\",\n                \"Intelligence-led prioritisation\"\n              ],\n              \"verdict\": {\n                \"label\": \"Targeted inspection opportunities at the point of generation\"\n              }\n            },\n            {\n              \"label\": \"Targeted inspection at source\",\n              \"meta\": \"After export\",\n              \"tone\": \"positive\",\n              \"items\": [\n                \"Inspect where waste is generated\",\n                \"Prevent issues before export\"\n              ],\n              \"verdict\": {\n                \"label\": \"Improved end-to-end visibility and stronger intelligence sharing\"\n              }\n            }\n          ]\n        }\n      ],\n      \"implication\": \"Regulatory responsibility continues beyond export while visibility and influence diminish, so [[advance shipment information and risk-based targeting before movement]] are worth more than reporting collected after the fact.\"\n    },\n    {\n      \"id\": \"inconsistent-regime\",\n      \"title\": \"The UK does not operate a consistent Green List Waste regulatory regime\",\n      \"insight\": \"One legislative framework. [[Four regulatory approaches.]]\",\n      \"observations\": [\n        {\n          \"points\": [\n            \"Regulatory approaches differ significantly across the four UK regulators, particularly in relation to [[pre-export oversight and information requirements]]\",\n            \"SEPA and NIEA currently receive greater visibility of planned exports through advance reporting and destination facility approval processes\",\n            \"EA and NRW participants described having more limited access to pre-export information, reducing opportunities for proactive risk assessment\",\n            \"Participants did not view these differences as the result of deliberate policy choices, but rather as a consequence of [[historical process development]]\",\n            \"The result is an [[uneven regulatory and enforcement picture]] across the UK\"\n          ]\n        }\n      ],\n      \"contexts\": [\n        {\n          \"title\": \"One legislative framework, four regulatory approaches\",\n          \"standfirst\": \"The same green list rules apply UK-wide, but what each regulator sees before a shipment moves differs.\",\n          \"columns\": [\n            {\n              \"label\": \"SEPA\",\n              \"meta\": \"Scottish Environment Protection Agency\",\n              \"tone\": \"positive\",\n              \"items\": [\n                \"Advance reporting of planned exports\",\n                \"Destination facility approval process\"\n              ],\n              \"verdict\": {\n                \"label\": \"Greater pre-export visibility\"\n              }\n            },\n            {\n              \"label\": \"NIEA\",\n              \"meta\": \"Northern Ireland Environment Agency\",\n              \"tone\": \"positive\",\n              \"items\": [\n                \"Advance reporting of planned exports\",\n                \"Destination facility approval process\"\n              ],\n              \"verdict\": {\n                \"label\": \"Greater pre-export visibility\"\n              }\n            },\n            {\n              \"label\": \"EA\",\n              \"meta\": \"Environment Agency, England\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"More limited access to pre-export information\"\n              ],\n              \"verdict\": {\n                \"label\": \"Fewer opportunities for proactive risk assessment\"\n              }\n            },\n            {\n              \"label\": \"NRW\",\n              \"meta\": \"Natural Resources Wales\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"More limited access to pre-export information\"\n              ],\n              \"verdict\": {\n                \"label\": \"Fewer opportunities for proactive risk assessment\"\n              }\n            }\n          ],\n          \"shapers\": {\n            \"label\": \"Why the variation exists\",\n            \"items\": [\n              \"Historical process development rather than deliberate policy choice\"\n            ],\n            \"note\": \"[[One legislative framework. Four regulatory approaches.]]\"\n          }\n        }\n      ],\n      \"implication\": \"The divergence is inherited rather than intended, so convergence on a common pre-export information standard is a design choice available now, not a policy negotiation.\"\n    },\n    {\n      \"id\": \"imports-blind-spot\",\n      \"title\": \"Imports represent a significant regulatory blind spot\",\n      \"insight\": \"All regulators reported [[limited visibility of incoming]] Green List Waste movements, and the compliance risks this creates.\",\n      \"observations\": [\n        {\n          \"points\": [\n            \"All regulator groups identified [[limited oversight of imported Green List Waste movements]] as a significant concern\",\n            \"Participants reported having little visibility of waste entering the UK unless issues are identified through intelligence, inspections or third-party reporting\",\n            \"Regulators highlighted the difficulty of understanding the scale, nature and destination of imported material\",\n            \"Concerns were raised that limited import visibility could create [[opportunities for non-compliance to go undetected]]\",\n            \"Improved import data and greater transparency were seen as important enablers of more effective oversight\"\n          ]\n        }\n      ],\n      \"contexts\": [\n        {\n          \"title\": \"The import blind spot\",\n          \"standfirst\": \"Regulators reported limited import visibility as both a challenge and an opportunity for improvement.\",\n          \"columns\": [\n            {\n              \"label\": \"What regulators have limited visibility of\",\n              \"meta\": \"Incoming movements\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Scale and volume of imported GLW\",\n                \"Types and nature of materials\",\n                \"Routes and points of entry\",\n                \"Destinations and end management\",\n                \"Compliance and treatment standards\"\n              ]\n            },\n            {\n              \"label\": \"The risks this creates\",\n              \"meta\": \"Consequences\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Potential for non-compliance to go undetected\",\n                \"Limited ability to target high-risk activity\",\n                \"Reduced assurance that waste is managed as intended\",\n                \"Uneven enforcement and regulatory effectiveness\",\n                \"Increased reliance on intelligence and third-party reporting\"\n              ]\n            }\n          ]\n        }\n      ],\n      \"implication\": \"Imports are the mirror of the post-departure problem: the GB facility carries the receiving-side duties, so import data and transparency are the lever regulators asked for.\"\n    },\n    {\n      \"id\": \"resource-capability-constraints\",\n      \"title\": \"Resource and capability constraints are impacting regulatory effectiveness\",\n      \"insight\": \"All regulators described resource pressures, though the [[specific challenges varied]] between organisations.\",\n      \"observations\": [\n        {\n          \"points\": [\n            \"All regulators described resource pressures, although the specific challenges varied between organisations\",\n            \"Participants reported that limited capacity affects the ability to undertake [[proactive compliance activity, inspections and intelligence-led interventions]]\",\n            \"Organisational structures, governance arrangements and competing priorities were also cited as influencing operational effectiveness\",\n            \"Several participants described reliance on specialist knowledge held by a small number of individuals, creating [[resilience and continuity risks]]\",\n            \"Resource constraints were frequently linked to the need for better tools, data and information to support prioritisation and decision-making\"\n          ]\n        }\n      ],\n      \"implication\": \"Capacity is fixed in the short term, so the practical lever is better targeting: tools and data that make limited inspection effort land where the risk is.\"\n    },\n    {\n      \"id\": \"earlier-shipment-information\",\n      \"title\": \"Earlier access to shipment information is the highest-value improvement opportunity\",\n      \"insight\": \"The [[highest-prioritised improvement opportunity]] across the workshops.\",\n      \"observations\": [\n        {\n          \"points\": [\n            \"Regulators consistently identified advance shipment information as the [[single most valuable improvement]] for strengthening oversight and compliance activity\",\n            \"Earlier visibility would support risk-based assessment before shipments leave their point of origin rather than relying on intervention at ports\",\n            \"Participants believed earlier intelligence would enable more targeted inspections and more efficient use of limited resources\",\n            \"Greater access to timely shipment data was viewed as a practical way to improve regulatory effectiveness [[without fundamentally changing existing responsibilities]]\",\n            \"This theme emerged as both a recurring discussion point and the highest-prioritised improvement opportunity across workshops\"\n          ]\n        }\n      ],\n      \"implication\": \"This is the convergence point of the other four themes, and it asks for data timing rather than new powers, which makes it the cheapest high-value change available.\"\n    }\n  ],\n  \"note\": \"Source: GLW regulator workshops, July 2026. Five themes raised across all four UK regulators.\"\n}\n","key-observations.json":"{\n  \"kicker\": \"User research\",\n  \"standfirst\": \"What the research found, grouped into themes. Each theme collapses to its headline insight, so the whole picture is scannable before any of it is read. Open one to see the evidence behind it.\",\n  \"themes\": [\n    {\n      \"id\": \"user-groups-archetypes\",\n      \"title\": \"User groups and archetypes\",\n      \"insight\": \"Many actors perform multiple roles across the waste chain\",\n      \"observations\": [\n        {\n          \"points\": [\n            \"[[Role-based user groups]], such as producer, broker, dealer, carrier, receiver, exporter and importer, provide a useful industry classification, but [[do not accurately represent real-world operations]]\",\n            \"Actors rarely operated within a single role. Instead, they [[wore many hats and undertook multiple activities]] across the waste chain, often combining responsibilities that span several traditional user groups\",\n            \"Personas based solely on role-based user groups risk [[oversimplifying operational reality]] and obscuring important behavioural differences and overlaps\",\n            \"The research suggests that [[understanding what actors do]] is more valuable than categorising them into prescriptive role-based user groups. Activity-based archetypes are therefore a more [[representative way of understanding users and their needs]] and provide a more accurate picture of how the waste chain operates in practice\"\n          ]\n        }\n      ],\n      \"tiers\": [\n        {\n          \"label\": \"Archetypes\",\n          \"lead\": true,\n          \"items\": [\n            {\n              \"name\": \"Pure-play\",\n              \"body\": \"Focused on one activity in the waste chain.\"\n            },\n            {\n              \"name\": \"Hybrid\",\n              \"body\": \"Involved in multiple activities across the waste chain.\"\n            },\n            {\n              \"name\": \"Orchestrator\",\n              \"body\": \"Facilitates and coordinates the waste chain without touching the waste.\"\n            }\n          ]\n        },\n        {\n          \"label\": \"User groups\",\n          \"items\": [\n            {\n              \"name\": \"Producer\",\n              \"body\": \"Creates or generates waste.\"\n            },\n            {\n              \"name\": \"Broker\",\n              \"body\": \"Arranges and facilitates trades.\"\n            },\n            {\n              \"name\": \"Dealer\",\n              \"body\": \"Buys and sells waste materials.\"\n            },\n            {\n              \"name\": \"Carrier\",\n              \"body\": \"Transports waste from place to place.\"\n            },\n            {\n              \"name\": \"Receiver\",\n              \"body\": \"Receives waste at a facility.\"\n            },\n            {\n              \"name\": \"Exporter\",\n              \"body\": \"Sends waste to another country.\"\n            },\n            {\n              \"name\": \"Importer\",\n              \"body\": \"Brings waste into the country.\"\n            }\n          ]\n        },\n        {\n          \"label\": \"Personas\",\n          \"items\": [\n            {\n              \"name\": \"Booking the Job Betty\",\n              \"body\": \"Schedules jobs and confirms details.\"\n            },\n            {\n              \"name\": \"Running the Route Ron\",\n              \"body\": \"Plans routes and manages collections.\"\n            },\n            {\n              \"name\": \"Keeping It Moving Kevin\",\n              \"body\": \"Ensures loads are moved safely and on time.\"\n            },\n            {\n              \"name\": \"Checking the Evidence Claire\",\n              \"body\": \"Verifies documents and ensures compliance.\"\n            },\n            {\n              \"name\": \"Receiving the Waste Sharon\",\n              \"body\": \"Receives waste and confirms acceptance.\"\n            }\n          ]\n        }\n      ],\n      \"implication\": \"Activity-based archetypes are a more representative lens on users and their needs than prescriptive role-based user groups.\"\n    },\n    {\n      \"id\": \"compliance-understanding\",\n      \"title\": \"1D vs 2D vs 3D compliance understanding\",\n      \"insight\": \"Who an actor is explains little on its own. [[What they do, and how they do it]], explains far more: same workflow, different context, different risk.\",\n      \"observations\": [\n        {\n          \"title\": \"1D, the actor lens: who they are\",\n          \"points\": [\n            \"Understanding compliance through the lens of user groups alone, such as producers, brokers, dealers, carriers, receivers, exporters and importers, provides some context into compliance behaviour and risk\",\n            \"User groups help classify actors according to their role within the waste chain, with different regulatory responsibilities and obligations. This can help identify where compliance requirements sit and who is accountable for particular activities\",\n            \"However, user groups alone provide a [[limited understanding of compliance outcomes]]. Organisations performing the same role may have different compliance behaviours depending on their operational context, resources and processes. Likewise, many organisations operate across multiple user groups, making role-based classifications an inaccurate representation of reality\"\n          ]\n        },\n        {\n          \"title\": \"2D, the workflow lens: what they do\",\n          \"points\": [\n            \"Participants described their businesses as [[seeking to operate efficiently, profitably and compliantly]]. Their workflow is a series of commercial and regulatory handshakes that cycle through Procure, Handle and Fulfil stages\",\n            \"These stages align closely with the principles of the circular economy, where materials and responsibility pass between multiple actors across the value chain. Each hand-off represents both a [[transfer of material and a transfer of information, creating interdependencies between]] actors. Successful operations depend not only on actions of individual actors but also on the quality, completeness and timeliness of the information exchanged between them\",\n            \"Understanding the workflow provides a [[richer picture of how compliance obligations are created, fulfilled and transferred]] between participants\"\n          ]\n        },\n        {\n          \"title\": \"3D, the organisational context: how they do it\",\n          \"points\": [\n            \"The research suggests that understanding compliance requires [[looking beyond the workflow]] and considering the organisational context. Participants described different capabilities, resources, governance and operational maturity between operators. These factors appear to influence how compliance activities are managed\",\n            \"Participants from larger organisations described [[established controls, governance arrangements and strong incentives to remain compliant]] due to commercial and reputational risk. No evidence of deliberate non-compliance was identified within this segment of the sample\",\n            \"Smaller and medium-sized operators were more likely to describe [[operational constraints, including limited resources, smaller teams and greater reliance on manual processes]] such as Excel and the wider Microsoft ecosystem\",\n            \"Within the research sample, [[compliance challenges were more frequently associated with resource limitations, knowledge gaps and operational process]] than with deliberate attempts to avoid regulatory requirements\"\n          ]\n        },\n        {\n          \"title\": \"Two broad forms of non-compliance\",\n          \"points\": [\n            {\n              \"text\": \"The findings suggest that organisations may follow the same workflow but experience different compliance risks and challenges, with two broad forms of non-compliance emerging:\",\n              \"sub\": [\n                \"Unintentional non-compliance, arising from knowledge gaps, resource limitations, manual processes or operational complexity\",\n                \"Deliberate non-compliance, associated with rogue operators intentionally circumventing regulatory requirements. This group was not represented within the research sample due to recruitment constraints and therefore falls outside the evidence gathered through this research\"\n              ]\n            },\n            \"Participants acknowledged that waste crime exists and recognised the negative impact on the industry's reputation, with broad support for efforts to improve compliance and reduce poor practice\",\n            \"The findings indicate a potential opportunity for [[proportionate, risk-based support]] aimed at helping organisations build compliance capability, particularly new operators and those with less mature processes. Such an approach may be more effective than treating all operators as presenting the same level or type of risk\"\n          ]\n        }\n      ],\n      \"flow\": {\n        \"title\": \"The workflow: from sourcing materials to fulfilment\",\n        \"standfirst\": \"Each inbound and outbound handshake connects actors in the circular economy from their perspective. Multiple actors are involved in each stage.\",\n        \"steps\": [\n          {\n            \"n\": \"Prerequisite\",\n            \"name\": \"Register\",\n            \"items\": [\n              \"Licensing, registration and accreditation with authorities\"\n            ]\n          },\n          {\n            \"n\": \"Inbound handshake\",\n            \"name\": \"Procure\",\n            \"items\": [\n              \"Vetting and onboarding suppliers or partners\",\n              \"Sourcing appropriate materials\",\n              \"Contracts, invoices and initial paperwork\"\n            ]\n          },\n          {\n            \"n\": \"Core activities\",\n            \"name\": \"Handle\",\n            \"items\": [\n              \"Transport and logistics\",\n              \"Coordination between parties (brokering, dealing)\",\n              \"Sorting and processing\"\n            ]\n          },\n          {\n            \"n\": \"Outbound handshake\",\n            \"name\": \"Fulfil\",\n            \"items\": [\n              \"Hand-off to next actor in waste chain, or end of waste onward journey\",\n              \"Confirmation and final paperwork\"\n            ]\n          }\n        ],\n        \"note\": \"Focus of the research: [[Procure, Handle and Fulfil]]. Registration is the prerequisite that precedes them.\"\n      },\n      \"contexts\": {\n        \"title\": \"Compliance behaviours are influenced by organisational context\",\n        \"standfirst\": \"Same rules. Different contexts. Different behaviours and risks.\",\n        \"columns\": [\n          {\n            \"label\": \"Large established operator\",\n            \"meta\": \"High capability, strong resources, mature processes\",\n            \"tone\": \"positive\",\n            \"items\": [\n              \"Dedicated compliance resources and expertise\",\n              \"Documented policies, standard operating procedures and governance\",\n              \"Technology and systems support accurate data and auditability\",\n              \"Strong due diligence and third-party checks\",\n              \"Reputation and business risk are key motivators\"\n            ],\n            \"verdict\": {\n              \"label\": \"High compliance likelihood\",\n              \"body\": \"Non-compliance is unlikely and not in their interest.\"\n            }\n          },\n          {\n            \"label\": \"Smaller or medium operator\",\n            \"meta\": \"Limited resources, developing processes, higher variability\",\n            \"tone\": \"caution\",\n            \"groups\": [\n              {\n                \"label\": \"Unintentional non-compliance (accidental)\",\n                \"items\": [\n                  \"Limited knowledge or experience\",\n                  \"Small teams and competing priorities\",\n                  \"Reliance on manual processes, for example Excel, email, paper\",\n                  \"Gaps in data quality and record keeping\"\n                ]\n              },\n              {\n                \"label\": \"Deliberate non-compliance (rogue)\",\n                \"items\": [\n                  \"Intentional disregard for rules\",\n                  \"Seeks to avoid detection\",\n                  \"Undercuts fair competition\",\n                  \"Not captured in research sample\"\n                ]\n              }\n            ],\n            \"verdict\": {\n              \"label\": \"Variable compliance likelihood\",\n              \"body\": \"Higher risk of accidental non-compliance. Targeted support can improve outcomes.\"\n            }\n          },\n          {\n            \"label\": \"Orchestrator\",\n            \"meta\": \"Facilitates and coordinates, does not handle waste\",\n            \"tone\": \"neutral\",\n            \"items\": [\n              \"Focus on data exchange, visibility and coordination\",\n              \"Depends on data quality and actions of other actors\",\n              \"Influences compliance through contracts, terms and guidance\",\n              \"Limited direct control over physical handling and record accuracy\"\n            ],\n            \"verdict\": {\n              \"label\": \"Oversight and enablement role\",\n              \"body\": \"Compliance outcomes depend on the behaviours of the network.\"\n            }\n          }\n        ],\n        \"shapers\": {\n          \"label\": \"Context shapers (affect all actors)\",\n          \"items\": [\n            \"Regulatory complexity and change\",\n            \"Different jurisdictions and thresholds\",\n            \"Correct classification and coding\",\n            \"Cost of compliance (software, training, admin)\",\n            \"Awareness and access to information\"\n          ],\n          \"note\": \"The same regulatory requirements can lead to different compliance behaviours and outcomes depending on organisational context.\"\n        }\n      },\n      \"implication\": \"The same regulatory requirements land differently depending on capability, resources and process. Support targeted at capability, rather than treating every operator as the same risk, is likely to be more effective.\"\n    },\n    {\n      \"id\": \"controls-due-diligence\",\n      \"title\": \"Controls and due diligence\",\n      \"insight\": \"Most operators are [[not lacking controls]]. The weak point is data quality at the moment of capture, and at every hand-off after it.\",\n      \"observations\": [\n        {\n          \"title\": \"Most operators already have established controls and due diligence processes\",\n          \"points\": [\n            \"Participants described [[mature operational processes]] supported by a combination of Microsoft 365 and Excel-based workflows, off-the-shelf waste management software, and bespoke software platforms, particularly among larger organisations\",\n            \"Across the sample, operators reported established [[due diligence processes when onboarding suppliers, customers and other partners]]. These commonly included licence verification, accreditation checks, site visits, photographic evidence and ongoing monitoring activities. Participants considered these activities [[essential safeguards]] against commercial, regulatory and reputational risk\",\n            \"The research suggests that most [[operators are not lacking controls]]. Instead, many have already developed processes and checks designed to manage compliance obligations and protect their businesses\"\n          ]\n        },\n        {\n          \"title\": \"Biggest challenge is maintaining data quality across multiple systems and hand-offs\",\n          \"points\": [\n            \"While due diligence processes were generally mature, participants consistently identified the [[initial capture and manual entry of data]] as the point at which errors are most likely to occur\",\n            \"Manual data entry was viewed as a risk to both [[data quality and operational efficiency]], particularly where information needs to be transferred between systems or re-entered multiple times\",\n            {\n              \"text\": \"To mitigate this risk, participants expressed a preference for workflows that [[minimise repeated data entry]] through:\",\n              \"sub\": [\n                \"Data reuse\",\n                \"Copy-and-paste functionality\",\n                \"Auto-population\",\n                \"System-to-system integration\"\n              ]\n            },\n            \"The challenge is not the absence of controls, but [[ensuring accurate data enters the process]] and can move through it without unnecessary re-entry\"\n          ]\n        }\n      ],\n      \"flow\": {\n        \"title\": \"Established workflows across the waste chain\",\n        \"standfirst\": \"They have robust ways of working across the waste chain to manage risk and protect their business. These are the same four stages as the workflow lens above, seen through what is checked at each one.\",\n        \"steps\": [\n          {\n            \"n\": \"1\",\n            \"name\": \"Register\",\n            \"body\": \"Set up organisation, obtain licences and accreditations.\"\n          },\n          {\n            \"n\": \"2\",\n            \"name\": \"Procure\",\n            \"body\": \"Source suppliers and agree terms. Complete due diligence.\"\n          },\n          {\n            \"n\": \"3\",\n            \"name\": \"Handle\",\n            \"body\": \"Collect, transport, treat or process waste safely and compliantly.\"\n          },\n          {\n            \"n\": \"4\",\n            \"name\": \"Fulfil\",\n            \"body\": \"Provide documentation, confirm delivery and close the loop.\"\n          }\n        ],\n        \"note\": \"Each stage includes [[checks and hand-offs]] that help ensure compliance and reduce risk.\"\n      },\n      \"contexts\": {\n        \"title\": \"Strong due diligence and checks are typically in place\",\n        \"standfirst\": \"These controls are in place to protect their business, manage risk and demonstrate compliance.\",\n        \"columns\": [\n          {\n            \"label\": \"Verify\",\n            \"tone\": \"positive\",\n            \"meta\": \"Check licences, permits and accreditations.\"\n          },\n          {\n            \"label\": \"Assess\",\n            \"tone\": \"positive\",\n            \"meta\": \"Review supplier capability and capacity.\"\n          },\n          {\n            \"label\": \"Inspect\",\n            \"tone\": \"positive\",\n            \"meta\": \"Site visits, inspections and photo evidence.\"\n          },\n          {\n            \"label\": \"Contract\",\n            \"tone\": \"positive\",\n            \"meta\": \"Clear terms, responsibilities and SLAs.\"\n          },\n          {\n            \"label\": \"Monitor\",\n            \"tone\": \"positive\",\n            \"meta\": \"Ongoing performance and compliance monitoring.\"\n          },\n          {\n            \"label\": \"Review\",\n            \"tone\": \"positive\",\n            \"meta\": \"Regular reviews and re-validation of partners.\"\n          }\n        ],\n        \"shapers\": {\n          \"label\": \"Systems and tools in use\",\n          \"items\": [\n            \"Microsoft ecosystem (Excel, Word, Outlook, SharePoint)\",\n            \"Off-the-shelf waste management software\",\n            \"Bespoke or specialist systems (larger operators)\"\n          ],\n          \"note\": \"A mix of tools is used, depending on size, complexity and resources.\"\n        }\n      },\n      \"implication\": \"The controls exist and are broadly mature. The exposure is not a missing check, but the accuracy of the data those checks are run on, and whether it survives each hand-off.\"\n    },\n    {\n      \"id\": \"information-flow\",\n      \"title\": \"Information flow and collaboration\",\n      \"insight\": \"Documents are already digital. Friction arises where information is [[incomplete, incorrect or requires physical validation]], above all at the transport stage.\",\n      \"observations\": [\n        {\n          \"title\": \"Movement of documents is largely digital, with digital to physical hand-off friction\",\n          \"points\": [\n            \"Most document exchanges are already digital, but key points of friction remain where information must be validated, corrected or transferred into physical processes\",\n            \"Participants reported that [[communication and document exchange]] already takes place predominantly through [[digital channels]]. This includes contracts, invoices and Annex VII documentation, which are commonly shared electronically between actors across the waste chain\",\n            \"Annex VII completion was typically described as a collaborative and sequential process, where [[each actor completes the relevant section before forwarding to the next participant in the chain]]. The Annex VII evolves organically as responsibility and information pass between parties\"\n          ]\n        },\n        {\n          \"title\": \"Information flow depends on data quality\",\n          \"points\": [\n            {\n              \"text\": \"Participants described problems arising when:\",\n              \"sub\": [\n                \"Required information is unavailable\",\n                \"Information is incomplete\",\n                \"Information contains errors\"\n              ]\n            },\n            \"When these issues occur, resolution typically relies on direct communication and manual follow-up with the organisation responsible for providing the information. As a result, delays are often caused not by the movement of documents themselves, but by the effort required to [[validate, correct and reconcile data between parties]]\"\n          ]\n        },\n        {\n          \"title\": \"Physical processes remain a source of friction\",\n          \"points\": [\n            \"Despite the widespread use of digital communication, participants consistently identified the [[continued requirement for paper documents and wet signatures]] during transportation as a source of friction\",\n            \"Participants also described varying approaches to evidencing successful completion of a shipment. Final confirmation ranged from formal scanned documentation to simple email confirmation, with photographs occasionally used to evidence problems, discrepancies or rejected loads\",\n            \"Documents are already digital. Friction arises when information is incomplete, incorrect or requires physical validation\"\n          ]\n        },\n        {\n          \"title\": \"Considerations for Digital Waste Tracking\",\n          \"points\": [\n            {\n              \"text\": \"The findings raise several [[important considerations for Digital Waste Tracking]]:\",\n              \"sub\": [\n                \"How collaborative document completion should be supported\",\n                \"How corrections and amendments should be managed\",\n                \"How actors should be notified when information changes\",\n                \"Whether the receiving party should be able to correct errors directly\",\n                \"Whether corrections should be referred back to the original author\",\n                \"How the provenance and audit trail of changes should be maintained\"\n              ]\n            }\n          ]\n        }\n      ],\n      \"flow\": {\n        \"title\": \"How the Annex VII moves along the chain\",\n        \"standfirst\": \"Documents and information flow electronically across the chain, but the transport stage often requires paper and wet signatures.\",\n        \"start\": {\n          \"label\": \"Largely digital flow\"\n        },\n        \"steps\": [\n          {\n            \"n\": \"1\",\n            \"name\": \"Originator\",\n            \"body\": \"Creates and completes its section of the Annex VII form.\"\n          },\n          {\n            \"n\": \"2\",\n            \"name\": \"Next actor\",\n            \"body\": \"Receives, completes their section and forwards on.\"\n          },\n          {\n            \"n\": \"3\",\n            \"name\": \"Next actor\",\n            \"body\": \"Receives, completes their section and forwards on.\"\n          },\n          {\n            \"n\": \"4\",\n            \"name\": \"Next actor\",\n            \"body\": \"Receives, completes their section and forwards on.\"\n          },\n          {\n            \"n\": \"5\",\n            \"name\": \"Destination\",\n            \"body\": \"Confirms receipt and completes final section of the form.\"\n          }\n        ],\n        \"end\": {\n          \"label\": \"Digital confirmation\"\n        },\n        \"note\": \"The Annex VII is organically completed: each actor completes their section and forwards to the next actor in the chain.\",\n        \"panels\": [\n          {\n            \"label\": \"Largely digital document exchange\",\n            \"tone\": \"neutral\",\n            \"items\": [\n              \"Contracts, invoices and Annex VII forms are exchanged electronically.\",\n              \"Problems occur when data is missing or incorrect and needs to be chased.\",\n              \"Questions remain about how to track organic completion and corrections, for example who amends and how to notify.\",\n              \"Originators may not always receive scans back, practices vary.\"\n            ]\n          },\n          {\n            \"label\": \"The friction point: transport stage\",\n            \"tone\": \"caution\",\n            \"items\": [\n              \"Digitally created and shared up to transport.\",\n              \"Paper document and wet signature required.\",\n              \"The requirement for paper and wet signatures during transport is the [[most common source of friction]] in the process.\"\n            ]\n          },\n          {\n            \"label\": \"Final confirmation at destination\",\n            \"tone\": \"neutral\",\n            \"items\": [\n              \"Final confirmation of receipt is often via email.\",\n              \"Photos may be sent if there are issues with the shipment.\",\n              \"Scanned or signed documents may be returned, but this is not always consistent.\"\n            ]\n          }\n        ]\n      },\n      \"implication\": \"The chain is already digital either side of transport. The gap is the paper and wet-signature step in the middle, and the absence of an agreed way to correct, amend and notify as the Annex VII passes along the chain.\"\n    },\n    {\n      \"id\": \"regulatory-change\",\n      \"title\": \"Regulatory change\",\n      \"insight\": \"The concern is not regulation itself, but the [[cost, complexity and uncertainty]] of implementing it. Clear, consistent, well-signalled change is what unlocks investment.\",\n      \"observations\": [\n        {\n          \"title\": \"Participants expressed concerns about the cost and complexity of regulatory change\",\n          \"points\": [\n            \"Participants generally supported the objectives of regulation in maintaining standards, supporting legitimate operators and helping prevent waste crime, but [[expressed concerns about the cost, complexity and uncertainty]] associated with implementing regulatory change. They consistently highlighted the operational burden associated with adapting to new or changing regulatory requirements\",\n            {\n              \"text\": \"[[Common concerns]] included:\",\n              \"sub\": [\n                \"Software procurement, implementation and maintenance costs\",\n                \"Staff training and capability building\",\n                \"Additional administrative overhead\",\n                \"Variations in requirements across jurisdictions\",\n                \"Different thresholds and obligations for different waste streams\",\n                \"Correct interpretation and application of classification codes\"\n              ]\n            },\n            \"For many participants, compliance was viewed not as a one-off activity but as an ongoing investment that requires time, resource and organisational commitment\"\n          ]\n        },\n        {\n          \"title\": \"Uncertainty creates hesitation\",\n          \"points\": [\n            \"Participants also highlighted challenges associated with understanding and responding to regulatory change, with several describing [[inconsistency in how changes are communicated]], interpreted and applied across the industry\",\n            \"This created uncertainty around future requirements and reduced confidence when making decisions about process improvements, software investments and operational change\",\n            \"Participants questioned the [[viability of investing in new systems and ways of working]] if future regulatory changes could alter requirements again in the near term\"\n          ]\n        },\n        {\n          \"title\": \"What participants want\",\n          \"points\": [\n            {\n              \"text\": \"Participants consistently expressed a desire for:\",\n              \"sub\": [\n                \"Greater clarity around requirements\",\n                \"Consistent interpretation of regulations\",\n                \"Earlier visibility of upcoming changes\",\n                \"Confidence that investments will remain relevant over time\",\n                \"Proportionate implementation approaches that recognise differing levels of organisational capability\"\n              ]\n            },\n            \"Their concern was not regulation itself, but cost, complexity and uncertainty associated with implementing and maintaining compliance. They are more willing to invest when requirements are clear, consistent and stable enough to justify long-term commitment\"\n          ]\n        }\n      ],\n      \"contexts\": [\n        {\n          \"title\": \"Key areas of concern\",\n          \"standfirst\": \"Regulatory objectives were generally supported, but participants highlighted challenges associated with implementation, cost and uncertainty.\",\n          \"columns\": [\n            {\n              \"label\": \"Software costs\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Purchasing new systems\",\n                \"Licensing and upgrades\",\n                \"Integration with existing systems\"\n              ],\n              \"quote\": \"New systems and integrations are expensive, especially for smaller businesses.\"\n            },\n            {\n              \"label\": \"Training requirements\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Staff training and upskilling\",\n                \"Time away from day to day operations\",\n                \"Change management\"\n              ],\n              \"quote\": \"Training takes time and resources we don't always have.\"\n            },\n            {\n              \"label\": \"Jurisdictional complexity\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Different rules in different jurisdictions\",\n                \"Different thresholds based on material\",\n                \"Cross-border complexity\"\n              ],\n              \"quote\": \"It's hard enough keeping up with one set of rules, never mind many.\"\n            },\n            {\n              \"label\": \"Classification challenges\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Applying the correct classification codes\",\n                \"Interpreting guidance\",\n                \"Risk of getting it wrong\"\n              ],\n              \"quote\": \"Classification is complex and mistakes can have serious consequences.\"\n            },\n            {\n              \"label\": \"Regulatory uncertainty\",\n              \"tone\": \"caution\",\n              \"items\": [\n                \"Frequent or unexpected regulatory changes\",\n                \"Lack of early visibility\",\n                \"Hard to plan and invest\"\n              ],\n              \"quote\": \"We can't invest with confidence if the rules might change again.\"\n            }\n          ]\n        },\n        {\n          \"title\": \"What participants want\",\n          \"columns\": [\n            {\n              \"label\": \"Consistency\",\n              \"tone\": \"positive\",\n              \"meta\": \"Aligned rules across jurisdictions and clear thresholds\"\n            },\n            {\n              \"label\": \"Clear guidance\",\n              \"tone\": \"positive\",\n              \"meta\": \"Practical, easy to understand guidance and examples\"\n            },\n            {\n              \"label\": \"Early visibility\",\n              \"tone\": \"positive\",\n              \"meta\": \"Advance notice of changes and time to prepare\"\n            },\n            {\n              \"label\": \"Confidence to invest\",\n              \"tone\": \"positive\",\n              \"meta\": \"Stability and certainty to support decisions and investment\"\n            },\n            {\n              \"label\": \"Reduced burden\",\n              \"tone\": \"positive\",\n              \"meta\": \"Less admin and simpler processes where possible\"\n            }\n          ]\n        }\n      ],\n      \"implication\": \"Participants support the intent of regulation, but need proportionate, consistent and well-communicated changes that reduce complexity, control costs and allow them to plan with confidence.\"\n    }\n  ],\n  \"note\": \"Source: GLW user research playback. Themes carry the deck's own headline findings; tone colour follows this site's palette, pine for what works and terracotta for friction. Archetypes source: GLW user research playback, Personas vs. User Groups vs. Archetypes. The three tiers are shown in the brand accent rather than the deck colour coding, so colour keeps its meaning across the readout.\"\n}\n","where-needs-align.json":"{\n  \"kicker\": \"User research\",\n  \"standfirst\": \"Seven themes where regulator and industry needs converge: the evidence from both sides, and what each implies for a future service.\",\n  \"columns\": [\"Ref\", \"Common theme\", \"Evidence\", \"Implication\"],\n  \"rows\": [\n    [\n      \"1\",\n      \"Less reliance on paper-based processes\",\n      \"Industry experiences paper Annex VII as inefficient, fragile and administratively burdensome, while regulators view it as incomplete, difficult to verify and unreliable as an audit trail\",\n      \"Digital records appear to offer benefits for [[both regulatory oversight and operational efficiency]]\"\n    ],\n    [\n      \"2\",\n      \"Better information quality and visibility\",\n      \"Operators want to avoid duplicate entry, corrections and data errors. Regulators want more complete, timely and trustworthy information about waste movements\",\n      \"Greater emphasis should be placed on [[capturing information once]] and enabling it to flow across the waste chain\"\n    ],\n    [\n      \"3\",\n      \"Frustration with fragmented systems\",\n      \"Operators experience repeated reporting across multiple regimes, while regulators struggle to access data held elsewhere\",\n      \"Interoperability and data-sharing are likely to deliver benefits [[across the ecosystem]], rather than for a single user group\"\n    ],\n    [\n      \"4\",\n      \"Greater consistency\",\n      \"Operators report inconsistent guidance and interpretation, while regulators acknowledge differing approaches across UK nations\",\n      \"Future services may benefit from greater alignment of processes, guidance and reporting requirements\"\n    ],\n    [\n      \"5\",\n      \"Support for stronger action against non-compliance\",\n      \"Compliant operators want a level playing field, while regulators acknowledge current enforcement limitations and visibility gaps\",\n      \"Improved transparency, traceability and intelligence could support [[more targeted compliance and enforcement]] activity\"\n    ],\n    [\n      \"6\",\n      \"Recognition that current processes do not always reflect operational reality\",\n      \"Operators described collaborative, evolving workflows involving multiple parties, while regulators highlighted difficulties tracking changes after shipment departure\",\n      \"Future services should accommodate legitimate amendments, corrections and changes throughout a movement's lifecycle\"\n    ],\n    [\n      \"7\",\n      \"Navigating uncertainty around digital transformation\",\n      \"Operators are uncertain about future requirements and investment decisions. Regulators are uncertain about DIWASS interoperability and future reporting arrangements\",\n      \"[[Clear roadmaps, communication and implementation planning]] will be critical for adoption\"\n    ]\n  ],\n  \"note\": \"Source: GLW discovery research synthesis, common themes across regulator and industry participants.\"\n}\n","08-opportunities.json":"{\n  \"kicker\": \"Opportunities\",\n  \"standfirst\": \"Every opportunity surfaced in the opportunity-solution tree, plotted by impact against effort. The top-left quadrant is where we would start. Tap a point for the detail and a one-line recommendation.\",\n  \"priorityNote\": \"Start in the top-left quadrant: high impact, low effort. The cheapest place to catch a misclassification is the moment the exporter fills in the form.\",\n  \"items\": [\n    { \"code\": \"O3 · S3.1\", \"title\": \"Validation at submission\", \"impact\": 9.2, \"effort\": 3.4, \"desc\": \"Mixture, destination and hazardous-fraction errors are caught late today. Build the country tables and rules into the form itself.\", \"rec\": \"Start here. The cheapest place to stop a misclassification is the moment the exporter is typing.\" },\n    { \"code\": \"O1 · S1.1\", \"title\": \"Guided submission for the long tail\", \"impact\": 8.4, \"effort\": 3.8, \"desc\": \"Small exporters do not always know an Annex VII applies. A guided, assisted-digital flow makes digital faster than paper.\", \"rec\": \"Pair with validation in phase 1 so the long tail is not driven back to paper.\" },\n    { \"code\": \"O2 · S2.1\", \"title\": \"Caseworker risk triage\", \"impact\": 8.8, \"effort\": 5.6, \"desc\": \"No pre-submission, no risk score, no four-nation handover. Give caseworkers a rules-based score and an evidence pack.\", \"rec\": \"Design the regulator workflow as a first-class feature in alpha, not an afterthought.\" },\n    { \"code\": \"O2 · S2.2\", \"title\": \"Proactive alerting on known risk patterns\", \"impact\": 8.8, \"effort\": 5.8, \"desc\": \"The EA today has to mine the data to find things that need action, often too late to intervene. Trigger alerts to the EA when known data patterns are seen, instead of waiting to be found. Impact and effort are provisional until the EA sends the specific patterns they want flagged.\", \"rec\": \"Pair with caseworker risk triage; the score surfaces risk on demand, alerting pushes it proactively.\" },\n    { \"code\": \"O6 · S6.1\", \"title\": \"Canonical code mapping\", \"impact\": 7.6, \"effort\": 5.2, \"desc\": \"EWC, Basel, OECD and HMRC codes do not reconcile. A canonical mapping plus a CDS API unlocks joined-up risk signals.\", \"rec\": \"Sequence after validation; it is the backbone for HMRC reconciliation.\" },\n    { \"code\": \"O4 · S4.1\", \"title\": \"Trusted facility register\", \"impact\": 8.0, \"effort\": 7.2, \"desc\": \"Exporters take overseas licences on trust. A register the regulator vouches for removes a leap of faith.\", \"rec\": \"High value, heavier lift. Scope the source data and dispute process early.\" },\n    { \"code\": \"O7 · S7.1\", \"title\": \"Four-nation case workflow\", \"impact\": 7.8, \"effort\": 7.6, \"desc\": \"Each regulator runs its own systems. A shared workflow lets EA, SEPA, NRW and NIEA co-own enforcement.\", \"rec\": \"Converge where workflows must, allow diverge
