elogin\", \"label\": \"GOV.UK One Login\", \"kind\": \"platform\", \"reuse\": true, \"short\": \"Reuse candidate, inherited automatically. One of the two credential routes Defra ID signs users in with. GLW does not integrate with it directly - reusing Defra ID reuses this for free.\" },\n          { \"id\": \"govgateway\", \"label\": \"Government Gateway\", \"kind\": \"platform\", \"reuse\": true, \"short\": \"Reuse candidate, inherited automatically. The other credential route Defra ID signs users in with, mainly for organisations with an existing Government Gateway ID. Like GOV.UK One Login, GLW gets this simply by reusing Defra ID.\" },\n          { \"id\": \"cdp\", \"label\": \"CDP Uploader\", \"kind\": \"platform\", \"short\": \"Shared platform service providing virus-scanning and S3 storage for file uploads. Any GLW service needing safe upload would use this, not rebuild it.\" },\n          { \"id\": \"govpay\", \"label\": \"GOV.UK Pay\", \"kind\": \"platform\", \"short\": \"Government payment platform, integrated by the Waste Organisation Backend to take the regulatory service charge.\" },\n          { \"id\": \"govnotify\", \"label\": \"GOV.UK Notify\", \"kind\": \"platform\", \"short\": \"Government notification platform used for transactional email and messaging across the organisation journeys.\" }\n        ]\n      }\n    ]\n  },\n  \"systemsLead\": \"Each system in turn - what it does, where it sits in the flow, and what it means for reuse.\",\n  \"systems\": [\n    {\n      \"id\": \"wm-api\",\n      \"name\": \"Waste Movement External API\",\n      \"tag\": \"External interface\",\n      \"role\": \"The external-facing entry point through which industry records waste receipts, used at the point waste arrives at a facility.\",\n      \"detail\": [\n        \"The API does not store data itself - it acts as an orchestration layer, coordinating three downstream services to reserve a tracking identifier, resolve the submitting organisation, and persist the movement record over authenticated calls.\",\n        \"Movements arrive one of two ways: a POST when the receiver logs an unregistered delivery (which mints a new waste tracking ID), or a PUT when the movement was pre-registered and the carrier already holds an ID. Hard validation rejects malformed requests, but soft warnings flag non-critical gaps (missing weights, hazardous detail) without blocking the movement.\",\n        \"Hazardous waste and Persistent Organic Pollutants (POPs) carry extra, layered requirements, and hazardous consignment code formats vary by regulator (EA, NRW, SEPA, NIEA) - an early signal that any future service in this space must accommodate all four UK waste regulators.\"\n      ],\n      \"endpoints\": [\n        { \"m\": \"POST\", \"p\": \"/movements/receive\", \"d\": \"Create a waste receipt. Reserves a new waste tracking ID and returns it.\" },\n        { \"m\": \"PUT\", \"p\": \"/movements/{wasteTrackingId}/receive\", \"d\": \"Update an existing waste receipt.\" },\n        { \"m\": \"GET\", \"p\": \"/reference-data/ewc-codes\", \"d\": \"European Waste Catalogue (EWC) codes.\" },\n        { \"m\": \"GET\", \"p\": \"/reference-data/disposal-or-recovery-codes\", \"d\": \"What will happen to the waste.\" },\n        { \"m\": \"GET\", \"p\": \"/reference-data/hazardous-property-codes\", \"d\": \"HP codes, required when waste is hazardous.\" },\n        { \"m\": \"GET\", \"p\": \"/reference-data/container-types\", \"d\": \"How the waste arrived.\" },\n        { \"m\": \"GET\", \"p\": \"/reference-data/pop-names\", \"d\": \"POP codes, required when POPs are present.\" },\n        { \"m\": \"GET\", \"p\": \"/health\", \"d\": \"Service health.\" }\n      ],\n      \"reuseNote\": \"Establishes the multi-regulator, hazardous/POP and soft-warning rules a GLW export service will need to mirror.\"\n    },\n    {\n      \"id\": \"wm-be\",\n      \"name\": \"Waste Movement Backend\",\n      \"tag\": \"Backend service\",\n      \"role\": \"The system of record behind the External API. Where the API orchestrates and validates, this service does the actual persistence.\",\n      \"detail\": [\n        \"It stores waste movements (\\\"inputs\\\") in MongoDB, versioning them, archiving their history, and emitting audit logs and metrics. Two collections are kept: waste-inputs (the active record, _id set to the waste tracking ID, revision starting at 1) and waste-inputs-history (an immutable archive). Every update copies the current record into history, then updates the active record and increments the revision.\",\n        \"Concurrency is handled by revision-based optimistic locking inside MongoDB transactions: updates only apply if the revision and owning organisation still match. Organisation ownership is enforced - an update must come from the same org that created the record, or it is rejected.\",\n        \"Create and update come in single and bulk variants; bulk operations add batched ID fetches, dual idempotency checks and atomic writes so a batch either fully succeeds or fully rolls back. Note: audit logging can be silently skipped for organisations on an exclusion list - a behaviour any future service would need to understand.\"\n      ],\n      \"endpoints\": [\n        { \"m\": \"POST\", \"p\": \"/movements/{wasteTrackingId}/receive\", \"d\": \"Insert a new waste input at revision 1.\" },\n        { \"m\": \"POST\", \"p\": \"/bulk/{bulkId}/movements/receive\", \"d\": \"Create multiple receipts for a bulk job.\" },\n        { \"m\": \"PUT\", \"p\": \"/movements/{wasteTrackingId}/receive\", \"d\": \"Archive current record to history, increment revision.\" },\n        { \"m\": \"PUT\", \"p\": \"/bulk/{bulkId}/movements/receive\", \"d\": \"Update multiple receipts atomically.\" },\n        { \"m\": \"POST\", \"p\": \"/movements/retry-audit-log\", \"d\": \"Replay an audit log that silently failed during a create/update.\" },\n        { \"m\": \"POST\", \"p\": \"/production-approval-tests\", \"d\": \"Data-shape assertions against real production records post-deploy.\" },\n        { \"m\": \"GET\", \"p\": \"/health\", \"d\": \"Service health.\" }\n      ],\n      \"reuseNote\": \"A proven pattern for versioned, auditable, ownership-enforced persistence that GLW records could follow or extend.\"\n    },\n    {\n      \"id\": \"wtid-be\",\n      \"name\": \"Waste Tracking ID Backend\",\n      \"tag\": \"Backend service · reuse candidate\",\n      \"reuse\": true,\n      \"role\": \"A small, single-purpose microservice whose only job is to mint unique waste tracking identifiers. A direct dependency of the External API.\",\n      \"detail\": [\n        \"Every time a new (unregistered) movement is logged, the External API calls this service's /next endpoint to reserve a fresh ID before persisting the record. It holds no movement data itself; it just hands out the next identifier in sequence.\",\n        \"IDs follow the format YYXXXXXX - a two-digit year prefix followed by a six-character alphanumeric code (e.g. 25ABC123). The code is a Sqids-encoded sequential counter, giving short, collision-free identifiers without exposing the raw running total. The counter lives in a MongoDB counters collection and resets to 1 each calendar year, so the year prefix keeps IDs unique across resets.\"\n      ],\n      \"endpoints\": [\n        { \"m\": \"GET\", \"p\": \"/next\", \"d\": \"Returns the next unique waste tracking ID.\" },\n        { \"m\": \"GET\", \"p\": \"/health\", \"d\": \"Service health.\" }\n      ],\n      \"reuseNote\": \"Directly reusable. GLW movements need identifiers; this already provides them, cleanly and safely. No reason to build a second ID service.\"\n    },\n    {\n      \"id\": \"worg-be\",\n      \"name\": \"Waste Organisation Backend\",\n      \"tag\": \"Backend service · reuse candidate\",\n      \"reuse\": true,\n      \"role\": \"The system of record for the Waste Organisation workstream - the organisations themselves, their registration details, API codes, service-charge payments and spreadsheet uploads.\",\n      \"detail\": [\n        \"It is a Hapi.js JSON API backed by MongoDB, sitting beneath both the Waste Organisation Frontend and the Spreadsheet Upload path, and is also called by the Waste Movement External API to resolve which organisation a movement belongs to. Every endpoint except health is protected by a shared API-key allow-list; most records use a version field for optimistic-locking updates.\",\n        \"It covers four distinct concerns: organisation records (registration and ownership, keyed by organisationId, auto-issuing a first API code); API codes (the credentials external parties integrate with, listable, creatable, renamable and disablable, with a reverse-lookup that turns a submitted apiCode back into a known organisation); payments (the regulatory service charge via GOV.UK Pay, cascading status back onto the organisation); and spreadsheet uploads (tracked and processed asynchronously via SQS).\",\n        \"The auth model is a simple shared API-key allow-list rather than per-user identity - the userId and organisationId come from the URL, not the token. External integrations are GOV.UK Pay, GOV.UK Notify and AWS S3/SQS.\"\n      ],\n      \"endpoints\": [\n        { \"m\": \"GET\", \"p\": \"/organisation/{apiCode}\", \"d\": \"Reverse lookup - resolve the owning organisation from an API code.\" },\n        { \"m\": \"PUT\", \"p\": \"/user/{userId}/organisation/{organisationId}\", \"d\": \"Create or update an organisation; auto-generates its first API code.\" },\n        { \"m\": \"POST\", \"p\": \"/organisation/{organisationId}/apiCodes\", \"d\": \"Generate a new API code.\" },\n        { \"m\": \"POST\", \"p\": \"/organisation/{organisationId}/initiatePayment\", \"d\": \"Start a service-charge payment via GOV.UK Pay.\" },\n        { \"m\": \"PUT\", \"p\": \"/organisation/{organisationId}/payment/{paymentId}\", \"d\": \"Update payment from a GOV.UK Pay status event; cascades onto the org.\" },\n        { \"m\": \"PUT\", \"p\": \"/spreadsheet/{organisationId}/{uploadId}\", \"d\": \"Save an upload record and enqueue an SQS processing job.\" },\n        { \"m\": \"GET\", \"p\": \"/health\", \"d\": \"Service health.\" }\n      ],\n      \"reuseNote\": \"The strongest reuse candidate. It already solves organisation onboarding, API-credential management and service-charge payment - all things a GLW service would need. Reuse rather than rebuild.\"\n    },\n    {\n      \"id\": \"defraid\",\n      \"name\": \"Defra ID\",\n      \"tag\": \"Shared platform · reuse candidate\",\n      \"reuse\": true,\n      \"role\": \"The OIDC identity provider organisations already sign in through - identified during this discovery as a further reuse opportunity for GLW authentication.\",\n      \"detail\": [\n        \"This is how it works today on the Waste Organisation Frontend, the workstream this discovery is drawing the pattern from: a user hits an authenticated route, is redirected to Defra ID to sign in (or create an account if they are new), and is bounced back to the frontend's /signin-oidc callback with an OIDC token. The frontend never sees a password - it only ever handles the token and the session it establishes from it.\",\n        \"Defra ID itself sits in front of two credential routes: GOV.UK One Login, and Government Gateway for organisations that already hold a Government Gateway ID. Neither is something the frontend - or GLW - integrates with directly; Defra ID abstracts both behind the one OIDC interface, so both are reuse candidates that come along automatically the moment Defra ID is reused, with no separate integration work.\",\n        \"In production this is the real Defra ID service; locally and in test environments the frontend runs against a stub so development is not blocked by a live dependency. Sessions are then cached server-side (Redis when deployed) rather than re-checked against Defra ID on every request.\",\n        \"For GLW, the same pattern applies twice over: an exporter creates their Defra ID account once, through the Waste Organisation Frontend, when they register and generate their API code - GLW itself never handles that sign-in step. Other callers who do need a live session against GLW, such as regulators, would authenticate the same way, directly against Defra ID via OIDC.\"\n      ],\n      \"reuseNote\": \"A further reuse opportunity identified alongside the Waste Organisation Frontend and Backend. GLW inherits Defra ID as its identity dependency rather than standing up a second sign-in integration - and inherits GOV.UK One Login and Government Gateway with it, automatically, since Defra ID is the only thing GLW would ever talk to.\"\n    },\n    {\n      \"id\": \"worg-fe\",\n      \"name\": \"Waste Organisation Frontend\",\n      \"tag\": \"External interface · reuse candidate\",\n      \"reuse\": true,\n      \"role\": \"The public-facing, GOV.UK-styled web application organisations log into to register themselves and manage their API codes - and, on current thinking, the same screens a Green List Waste exporter would use.\",\n      \"detail\": [\n        \"A server-rendered Hapi.js application (Nunjucks templates on the GOV.UK Design System) holding no data of its own - every action is backed by calls to the Waste Organisation Backend. Authentication is via Defra ID (the real provider in production, a stub locally), with sessions cached server-side (Redis when deployed).\",\n        \"Routes fall into open routes (eligibility, sign-in, onboarding, compliance pages, the payment webhook, health) and authenticated routes that require a valid session and pass an \\\"organisation check\\\" before the page loads. It carries the dashboard, account management, spreadsheet upload journeys, the service-charge/payment journey and API-code management.\",\n        \"Three behaviours matter for the landscape: authentication is Defra ID (OIDC) - the same identity dependency a future service would inherit; several journeys are feature-flagged (the whole service-charge journey is gated behind a flag), so what is live can vary by environment; and the upload journeys are callback-driven - the frontend never handles the file bytes itself.\",\n        \"Reuse for GLW is under active consideration here specifically: rather than exporters registering separately, they would register and generate their API code through this same frontend, with the code potentially scoped so it authenticates both a green-list export and a domestic movement (receipt of waste) - one registration and one credential covering both.\"\n      ],\n      \"endpoints\": [\n        { \"m\": \"GET\", \"p\": \"/dashboard\", \"d\": \"The organisation's home page / status overview.\" },\n        { \"m\": \"GET|POST\", \"p\": \"/signin-oidc\", \"d\": \"Defra ID OIDC callback.\" },\n        { \"m\": \"GET\", \"p\": \"/api\", \"d\": \"List, create, disable and rename API codes.\" },\n        { \"m\": \"GET\", \"p\": \"/service-charge\", \"d\": \"Service-charge journey (feature-flagged).\" },\n        { \"m\": \"GET\", \"p\": \"/organisation/{organisationId}/spreadsheet/begin-upload\", \"d\": \"Start a bulk spreadsheet upload.\" },\n        { \"m\": \"POST\", \"p\": \"/service-charge-callback\", \"d\": \"Open webhook receiving payment status from GOV.UK Pay.\" }\n      ],\n      \"reuseNote\": \"A strong reuse candidate. Organisation self-registration and API-code issuance already exist here; GLW's plan is to scope the same API code for both green-list exports and domestic movements rather than issue exporters a second credential.\"\n    },\n    {\n      \"id\": \"ss-upload\",\n      \"name\": \"Spreadsheet Upload\",\n      \"tag\": \"Cross-cutting pipeline\",\n      \"role\": \"The bulk-data on-ramp - not a standalone system but a callback-driven pipeline letting organisations submit waste data in bulk.\",\n      \"detail\": [\n        \"It spans three systems: the Waste Organisation Frontend's upload journeys, the shared CDP Uploader platform service (virus scanning and S3 storage), and the Waste Organisation Backend (persist and asynchronous SQS processing). The frontend never handles the file bytes itself.\",\n        \"The flow: begin upload (the frontend calls the CDP Uploader's /initiate, gets a one-time upload URL) → the browser uploads directly to the CDP Uploader (.xlsx only, 2MB max) → the uploader virus-scans and stores in S3 → on completion it redirects the user and makes a server-to-server callback → the callback handler saves the record via the backend, which enqueues an SQS job.\",\n        \"Points for the landscape: the CDP Uploader is a shared platform dependency, not team-owned; the callback is secured by a pre-shared key (403 on mismatch); user PII (email, name) is encrypted in transit through the pipeline; and a reference number generated up front threads through the session, uploader metadata and saved record as the user-facing submission identifier.\"\n      ],\n      \"endpoints\": [\n        { \"m\": \"GET\", \"p\": \"…/spreadsheet/begin-upload\", \"d\": \"Initiate an upload and obtain the one-time URL.\" },\n        { \"m\": \"POST\", \"p\": \"…/spreadsheet/upload-callback\", \"d\": \"Server-to-server callback from the CDP Uploader (pre-shared-key protected).\" },\n        { \"m\": \"PUT\", \"p\": \"/spreadsheet/{organisationId}/{uploadId}\", \"d\": \"Backend persists the record and enqueues SQS processing.\" }\n      ],\n      \"reuseNote\": \"A ready-made safe-upload pattern. Any GLW bulk submission would reuse the CDP Uploader rather than rebuild virus scanning and storage.\"\n    }\n  ],\n  \"assessment\": {\n    \"heading\": \"What this means for Green List Waste\",\n    \"lead\": \"The as-is map turns the design question from \\\"what do we build?\\\" into \\\"what do we reuse, and what genuinely has to be new?\\\". The starting position is strong.\",\n    \"points\": [\n      { \"title\": \"Reuse: identifiers\", \"body\": \"The Waste Tracking ID service already mints unique, year-scoped movement IDs. GLW movements should draw from it.\" },\n      { \"title\": \"Reuse: organisations & charging\", \"body\": \"The Waste Organisation service already handles registration, API credentials and GOV.UK Pay charging - the core of onboarding.\" },\n      { \"title\": \"Reuse: identity\", \"body\": \"Defra ID already provides the sign-in organisations use today, via the Waste Organisation Frontend. GLW inherits it rather than integrating a second identity provider - and inherits GOV.UK One Login and Government Gateway with it, automatically, since GLW would only ever talk to Defra ID.\" },\n      { \"title\": \"Reuse: registration & API codes\", \"body\": \"The Waste Organisation Frontend already gives organisations a self-service screen to register and generate an API code. The plan is to scope that same code for both green-list exports and domestic movements (receipt of waste), so exporters get one registration and one credential.\" },\n      { \"title\": \"Reuse: shared platform\", \"body\": \"The CDP Uploader for safe file upload and GOV.UK Pay/Notify for payment and messaging are shared platform services, inherited rather than rebuilt.\" },\n      { \"title\": \"New: green-list specifics\", \"body\": \"Export controls, the four-regulator consignment rules and green-list movement records are where genuinely new design effort belongs.\" }\n    ],\n    \"closing\": \"In short: build the green-list-specific parts, and inherit everything else DWT already runs.\"\n  },\n  \"cta\": \"Open the full systems map\",\n  \"sources\": \"GLW-DLGW-21 Map existing systems and integrations (Defra DWT, July 2026) · Waste Movement, Waste Tracking ID and Waste Organisation service documentation · CDP Uploader platform service. Provisional and to be validated with the DWT delivery teams.\"\n}\n","api-flow.json":"{\n  \"kicker\": \"Technical Overview\",\n  \"title\": \"API and Data Flow Approach\",\n  \"standfirst\": \"Build the data flow on DWT's own systems - sovereign and global-capable - and integrate with the EU's DIWASS only when a movement legally requires it.\",\n  \"intro\": [\n    \"Green List Waste needs a data-flow approach that works for every export, not just exports to Europe. That is the case for building this on DWT's own systems rather than simply plugging operators into the EU's Digital Waste Shipment System (DIWASS).\",\n    \"DWT is the [[UK's own system of record]]. It keeps sovereignty of the data - the movement, the organisation and the audit trail live in a service the UK owns and controls - and it can serve destinations DIWASS has no reach over. A shipment from England to the United States or Mexico is a legitimate green-list export that never needs to touch an EU system; if DIWASS were the front door, those journeys would have nowhere to go.\",\n    \"DIWASS still matters, but as an [[integration, not a foundation]]. When an EU country is the destination or a transit route - and, under the Windsor Framework, for Northern Ireland - DWT must exchange data with DIWASS on the EU's strict terms. The approach is therefore a sovereign UK service that routes to DIWASS only when a movement legally requires it.\"\n  ],\n  \"router\": {\n    \"label\": \"Does this movement touch DIWASS?\",\n    \"hint\": \"Pick a destination to see how the data flows - and when the EU system is, and isn't, in the loop.\",\n    \"hub\": {\n      \"label\": \"DWT\",\n      \"kicker\": \"UK system of record\",\n      \"detail\": \"The UK's own system of record. Every green-list movement, organisation and audit record lives here, in a service the UK owns and controls - the basis of data sovereignty and of exporting beyond the EU.\"\n    },\n    \"eu\": {\n      \"label\": \"DIWASS\",\n      \"kicker\": \"EU central hub\",\n      \"detail\": \"The EU's central Digital Waste Shipment System. Mandatory when an EU Member State is the country of dispatch, destination or transit - and, via the Windsor Framework, for Northern Ireland. DWT integrates with it on strict terms.\"\n    },\n    \"routes\": [\n      {\n        \"id\": \"row\",\n        \"label\": \"Rest of world\",\n        \"example\": \"UK → USA · UK → Mexico\",\n        \"diwass\": false,\n        \"verdict\": \"DWT only - data stays sovereign\",\n        \"detail\": \"Any destination outside the EU. The movement is recorded and tracked entirely within DWT. No EU system is involved, so there is nothing to synchronise and no external approval to wait on.\"\n      },\n      {\n        \"id\": \"eu-dest\",\n        \"label\": \"EU destination\",\n        \"example\": \"GB → France\",\n        \"diwass\": true,\n        \"verdict\": \"DWT ↔ DIWASS sync required\",\n        \"detail\": \"An EU Member State is the country of destination, so the movement must be processed through DIWASS. DWT stays the UK system of record but exchanges the required documents with the EU hub.\"\n      },\n      {\n        \"id\": \"eu-transit\",\n        \"label\": \"EU transit\",\n        \"example\": \"GB → non-EU, via the EU\",\n        \"diwass\": true,\n        \"verdict\": \"DWT ↔ DIWASS sync required\",\n        \"detail\": \"The final destination may be non-EU, but routing through EU territory makes a Member State a country of transit - which alone triggers DIWASS processing.\"\n      },\n      {\n        \"id\": \"ni\",\n        \"label\": \"Northern Ireland\",\n        \"example\": \"Windsor Framework\",\n        \"diwass\": true,\n        \"verdict\": \"DIWASS - NI treated as an EU actor\",\n        \"detail\": \"Under the Windsor Framework the EU Waste Shipment Regulation applies in respect of Northern Ireland, so NI operators and authorities are treated as EU actors and must use DIWASS from 1 January 2027. This is not a marginal case: ~90% of notified amber-list exports went to the EU last year (253 of 283), and the same trend is expected for green-list waste - so most GLW traffic is likely to touch DIWASS one way or another. A dual-regulatory case DWT must accommodate.\"\n      }\n    ]\n  },\n  \"constraintsLead\": \"When DIWASS is in the loop, it sets the terms. Four operational constraints shape the integration:\",\n  \"constraints\": [\n    {\n      \"id\": \"sync\",\n      \"tag\": \"Traffic rules\",\n      \"title\": \"Controlled, sequential synchronisation\",\n      \"short\": \"Calls must run sequentially, retries must back off, and syncs fetch only deltas - or the EU can block DWT's access.\",\n      \"detail\": [\n        \"DIWASS mandates that all API calls from a local system run strictly sequentially. Concurrent requests, or immediate retries of failed calls without a reasonable delay, risk DWT's access being temporarily or permanently blocked by the European Commission.\",\n        \"Local systems must synchronise at least every 12 hours, but DWT must fetch only delta updates - using operations like GET ALL ACTIONS to identify what has changed before retrieving individual documents, rather than bulk-dumping data.\",\n        \"This demands a controlled orchestration layer that manages request queues, limits payload sizes, and ensures every UK operator is mapped to a pre-registered DIWASS identifier before any cross-border document can be submitted.\"\n      ]\n    },\n    {\n      \"id\": \"dedupe\",\n      \"tag\": \"Registration\",\n      \"title\": \"No duplicate registration\",\n      \"short\": \"DIWASS rejects a registration if the same VAT or EORI number already exists - DWT must link the existing account, not re-create it.\",\n      \"detail\": [\n        \"DIWASS's registration validation is designed to prevent duplicate accounts. When DWT programmatically registers an economic operator, DIWASS automatically rejects the request if an operator with the same VAT or EORI number already exists.\",\n        \"A VAT (Value Added Tax) number is the unique ID governments use to track and collect consumption tax from a business; an EORI (Economic Operators Registration and Identification) number is used by customs authorities to track businesses moving goods across borders.\",\n        \"Because organisations may already have registered themselves manually through the DIWASS graphical interface, DWT must gracefully handle these rejection errors and guide the user to link their existing EU account rather than create a conflicting new one.\"\n      ]\n    },\n    {\n      \"id\": \"approval\",\n      \"tag\": \"Human approval\",\n      \"title\": \"Asynchronous EU approval delay\",\n      \"short\": \"A successful registration call isn't participation - operators sit 'New' until an EU authority approves them as 'Valid'.\",\n      \"detail\": [\n        \"Submitting a registration API call does not let an organisation instantly take part in a waste shipment. DIWASS requires every new operator to be manually approved by an \\\"assigned responsible authority\\\" before its status changes from \\\"New\\\" to \\\"Valid\\\".\",\n        \"Great Britain operators are classified as \\\"third-country\\\" actors by the EU, so this access is often contingent on the approval of an EU Competent Authority - such as the authority of dispatch or destination.\",\n        \"Instant gratification is impossible. DWT must be architected to manage these \\\"pending\\\" states and actively prevent users from submitting digital Annex VII or movement documents until the EU system officially confirms the registration is fully validated.\"\n      ]\n    }\n  ],\n  \"assessment\": {\n    \"heading\": \"What this means for the data-flow approach\",\n    \"lead\": \"The constraints do not argue against building on DWT - they argue for it. A sovereign core insulates UK operators from the EU's rules on every non-EU journey, and confines DIWASS's strict terms to the boundary where they legally apply.\",\n    \"points\": [\n      { \"title\": \"Sovereign core\", \"body\": \"DWT is the system of record for every movement, EU-bound or not. DIWASS is an integration at the edge, never the source of truth.\" },\n      { \"title\": \"Route by destination\", \"body\": \"Movement routing keys off the dispatch, destination and transit country to decide whether DIWASS is in the loop at all.\" },\n      { \"title\": \"Disciplined orchestration\", \"body\": \"Sequential queues, backoff on failure, delta-only sync and payload limits - built to DIWASS's rules so access is never blocked.\" },\n      { \"title\": \"State-aware onboarding\", \"body\": \"Handle duplicate-registration rejections by linking existing EU accounts, and gate cross-border documents behind 'New → Valid' approval.\" },\n      { \"title\": \"Participation is a choice, not an obligation\", \"body\": \"As a non-EU member, the UK is not legally required to push movements to DIWASS. But registering organisations and submitting movements is how DWT gets visibility of what happens to the waste after export - recovery certificates, downstream status - a blind spot today that participation, not obligation, closes.\" }\n    ],\n    \"closing\": \"In short: a UK-sovereign service that can reach the whole world, and speaks DIWASS fluently - but only when it has to.\"\n  },\n  \"cta\": \"Open the full data-flow deep dive\",\n  \"sources\": \"DGLW-24 Understand operational constraints (Defra DWT, July 2026) · EU Waste Shipment Regulation and the Windsor Framework · DIWASS integration guidance. Provisional and to be validated with the DWT delivery teams and EU counterparts.\"\n}\n","architecture-assumptions.json":"{\n  \"kicker\": \"Technical Overview\",\n  \"title\": \"Architecture Assumptions and Constraints\",\n  \"standfirst\": \"The proposed architecture for Green List Waste, and the assumptions and open questions it currently rests on.\",\n  \"intro\": [\n    \"Alongside mapping the existing DWT estate, discovery has sketched a proposed architecture for Green List Waste end to end: a [[Green List Waste API]] and [[Green List Waste Backend]] handling submissions day to day, and two containers dedicated to the part that's genuinely new - a [[Submission Processor]] sending updates out to DIWASS, the EU's Digital Waste System, and a [[DIWASS Update Receiver]] pulling updates back in.\",\n    \"This is discovery-stage design, not a build commitment. It exists to test a shape against known constraints from the business - and to surface, early, what still needs deciding before it can go further.\",\n    \"The ~500k green-list exports estimated annually (EA discussion, July 2026, a rough multi-source estimate) is the throughput this shape should be sized against, not a nominal load.\"\n  ],\n  \"contextLead\": \"Before the containers: the system context. Who and what Green List Waste sits next to - the [[Waste Exporter]] who calls it, the DWT services it depends on, and the [[Competent Authority]], [[Regulator]]s and [[W&CE Data Platform]] it serves or answers to.\",\n  \"contextDiagram\": {\n    \"hint\": \"Hover or tap any box to read what it is and how it connects to Green List Waste.\",\n    \"liveUrl\": \"c4/view/index/\",\n    \"legend\": [\n      { \"kind\": \"backend\", \"label\": \"Green List Waste (this system)\" },\n      { \"kind\": \"person\", \"label\": \"Person\" },\n      { \"kind\": \"iface\", \"label\": \"External system\" }\n    ],\n    \"tiers\": [\n      {\n        \"label\": \"People\",\n        \"nodes\": [\n          { \"id\": \"exporter\", \"label\": \"Waste Exporter\", \"kind\": \"person\", \"short\": \"The external person who exports the waste. Registers and generates an API code via the Waste Organisation Front End, then calls Green List Waste directly using that code.\" },\n          { \"id\": \"competent-authority\", \"label\": \"Competent Authority\", \"kind\": \"person\", \"short\": \"External person who approves organisation registration requests. The request reaches them via DIWASS, not directly from Green List Waste.\" },\n          { \"id\": \"regulator\", \"label\": \"Regulator\", \"kind\": \"person\", \"short\": \"Devolved-nations regulators (EA, NRW, SEPA, NIEA), given data access to Green List Waste submissions.\" }\n        ]\n      },\n      {\n        \"label\": \"DWT services\",\n        \"nodes\": [\n          { \"id\": \"worg-fe\", \"label\": \"Waste Organisation Front End\", \"kind\": \"iface\", \"short\": \"The existing DWT front end where exporters register their organisation and generate an API code, redirecting to Defra ID to create the account.\" },\n          { \"id\": \"worg-be\", \"label\": \"Waste Organisation Backend\", \"kind\": \"iface\", \"short\": \"The existing DWT service handling organisation registration. Green List Waste manages organisation data through it.\" },\n          { \"id\": \"wtid\", \"label\": \"Waste Tracking Identity Service\", \"kind\": \"iface\", \"short\": \"The existing DWT service that mints unique waste tracking IDs. Green List Waste generates tracking IDs from it.\" },\n          { \"id\": \"defraid\", \"label\": \"Defra ID\", \"kind\": \"iface\", \"short\": \"The OIDC identity provider Green List Waste inherits, used elsewhere across DWT. The Front End redirects here to create an exporter's account; the exporter also authenticates directly against it with a Government Gateway ID or GOV.UK One Login.\" }\n        ]\n      },\n      {\n        \"label\": \"Green List Waste\",\n        \"nodes\": [\n          { \"id\": \"glw\", \"label\": \"Green List Waste\", \"kind\": \"backend\", \"short\": \"The system in focus: the proposed Green List Waste service. Everything else on this diagram is context it depends on or serves.\" }\n        ]\n      },\n      {\n        \"label\": \"External\",\n        \"nodes\": [\n          { \"id\": \"diwass\", \"label\": \"DIWASS (EU)\", \"kind\": \"iface\", \"short\": \"The EU's Digital Waste System. Green List Waste submits updates to it and pulls updates back; it also routes organisation registration-approval requests on to the Competent Authority.\" },\n          { \"id\": \"wce-data\", \"label\": \"W&CE Data Platform\", \"kind\": \"iface\", \"short\": \"The Waste and Circular Economy Data Platform, given data access to Green List Waste submissions.\" }\n        ]\n      }\n    ]\n  },\n  \"diagram\": {\n    \"hint\": \"Hover or tap any box to read what it is and why it's shaped that way.\",\n    \"liveUrl\": \"c4/view/containers/\",\n    \"legend\": [\n      { \"kind\": \"platform\", \"label\": \"Queue / system of record\" },\n      { \"kind\": \"backend\", \"label\": \"GLW processing component\" },\n      { \"kind\": \"iface\", \"label\": \"External system (DIWASS)\" }\n    ],\n    \"tiers\": [\n      {\n        \"label\": \"Outbound\",\n        \"nodes\": [\n          { \"id\": \"queue\", \"label\": \"Submission Update Queue\", \"kind\": \"platform\", \"short\": \"Buffers outbound submission updates so the Backend and DIWASS delivery are decoupled from each other.\" },\n          { \"id\": \"processor\", \"label\": \"Submission Processor\", \"kind\": \"backend\", \"short\": \"Delivers updates to DIWASS one at a time, never batched, with retry and circuit-breaker protection so the integration doesn't get banned.\" },\n          { \"id\": \"diwassOut\", \"label\": \"DIWASS (EU)\", \"kind\": \"iface\", \"short\": \"The EU's Digital Waste System. Receives one submission update at a time, never a batch.\" }\n        ]\n      },\n      {\n        \"label\": \"Inbound\",\n        \"nodes\": [\n          { \"id\": \"diwassIn\", \"label\": \"DIWASS (EU)\", \"kind\": \"iface\", \"short\": \"Does not push updates itself - it has to be polled.\" },\n          { \"id\": \"receiver\", \"label\": \"DIWASS Update Receiver\", \"kind\": \"backend\", \"short\": \"Polls DIWASS on a fixed 12-hour schedule and writes any changes back into the GLW Backend.\" },\n          { \"id\": \"api\", \"label\": \"Green List Waste Backend\", \"kind\": \"platform\", \"short\": \"The system of record. Persists submissions and receives the updates pulled from DIWASS.\" }\n        ]\n      }\n    ]\n  },\n  \"diagramLead\": \"The DIWASS integration shape: the two containers built specifically to handle updates going out to, and coming back from, DIWASS.\",\n  \"assumptionsLead\": \"The design currently treats these as the working default, carried over from the wider DWT estate:\",\n  \"assumptions\": [\n    { \"title\": \"Existing services are reused, not rebuilt\", \"body\": \"The Waste Tracking Identity Service already mints tracking IDs, and the Waste Organisation Front End and Backend already handle org registration, Defra ID sign-in (which brings GOV.UK One Login and Government Gateway with it automatically) and API code issuance, and charging - GLW is expected to build only the green-list-specific pieces on top.\" },\n    { \"title\": \"DIWASS updates go one at a time\", \"body\": \"A hard constraint from the business: submissions are never batched to DIWASS. This is what shapes the Submission Processor into a strictly sequential pipeline rather than a parallel worker pool.\" },\n    { \"title\": \"DIWASS is polled, not pushed to\", \"body\": \"DIWASS does not notify GLW of changes - the DIWASS Update Receiver has to ask, on a fixed schedule, whether anything has changed.\" },\n    { \"title\": \"Exporters authenticate with an API code, not a live Defra ID session\", \"body\": \"A Waste Exporter registers and generates their API code via the Waste Organisation Front End, which redirects to Defra ID to create the account - GLW itself never handles that sign-in step. Every GLW API call from an exporter is then authenticated by that API code. Other callers, such as regulators, still authenticate against GLW using the same Defra ID OIDC pattern already used elsewhere in DWT.\" },\n    { \"title\": \"One API code is expected to cover both export and domestic movements\", \"body\": \"The API code an organisation generates via the Waste Organisation Front End is expected to be scoped so the same code authenticates both a green-list waste export to GLW and a domestic movement (receipt of waste) to the Waste Movement External API - one registration and one credential per organisation, not a separate code per workstream.\" },\n    { \"title\": \"Registration approval is routed through DIWASS, not requested directly\", \"body\": \"When a Green List Waste organisation registration needs Competent Authority sign-off, the request is routed via DIWASS rather than GLW contacting the Competent Authority directly - mirroring how DIWASS already sits in the loop for submission updates.\" }\n  ],\n  \"constraintsLead\": \"And these are the open questions the shape doesn't yet answer:\",\n  \"constraints\": [\n    { \"title\": \"DIWASS's rate limits aren't documented yet\", \"body\": \"The resilience design (backoff, circuit breaker) is built defensively - to avoid getting the integration banned - without confirmed thresholds from DIWASS itself. Needs validating with the architect.\" },\n    { \"title\": \"Ordering vs. throughput is undecided\", \"body\": \"If a submission fails permanently, does the Submission Processor skip it and carry on, or must updates reach DIWASS in strict order (so one stuck item blocks everything behind it)? This changes what the failure-handling component actually does.\" },\n    { \"title\": \"The tech stack's query-ability for EA BI isn't resolved\", \"body\": \"The EA run their own in-house business intelligence and need to query the data directly - a document store like Mongo, DWT's current default, is a harder fit for that than a relational store. Whether the answer is switching to RDS for GLW or building a scheduled export pipeline (the EA are comfortable with a 12 to 24-hour delta export rather than live querying) is still open.\" },\n    { \"title\": \"Regulator and W&CE Data Platform read-access scope isn't defined yet\", \"body\": \"The context diagram shows devolved-nations regulators and the W&CE Data Platform both with data access to Green List Waste - mirrored by the Data Access Controller in the API container - but what data, at what granularity, and under what authentication model is still to be confirmed.\" }\n  ],\n  \"cta\": \"Open the architecture diagrams\",\n  \"componentDiagrams\": [\n    {\n      \"id\": \"glw-api\",\n      \"title\": \"Green List Waste API\",\n      \"note\": \"The front door to the service. Validates the caller, then routes to whichever internal client the request needs.\",\n      \"diagram\": {\n        \"hint\": \"Hover or tap any box to read what it does.\",\n        \"liveUrl\": \"c4/view/api/\",\n        \"legend\": [\n          { \"kind\": \"backend\", \"label\": \"Processing component\" },\n          { \"kind\": \"platform\", \"label\": \"GLW container\" },\n          { \"kind\": \"iface\", \"label\": \"External system\" }\n        ],\n        \"tiers\": [\n          { \"label\": \"1 · Entry\", \"nodes\": [\n            { \"id\": \"api-auth\", \"label\": \"Auth Guard\", \"kind\": \"backend\", \"short\": \"Validates the caller's credentials on every request and attaches their identity: an API code for exporters, or a Defra ID OIDC token for other callers.\" }\n          ] },\n          { \"label\": \"2 · Routing\", \"nodes\": [\n            { \"id\": \"api-submission\", \"label\": \"Submission Controller\", \"kind\": \"backend\", \"short\": \"hapi routes for exporters to create and manage green-list-waste submissions.\" },\n            { \"id\": \"api-data-access\", \"label\": \"Data Access Controller\", \"kind\": \"backend\", \"short\": \"Read-only endpoints serving submission data to regulators and the W&CE Data Platform.\" }\n          ] },\n          { \"label\": \"3 · Clients\", \"nodes\": [\n            { \"id\": \"api-backend-client\", \"label\": \"Backend Client\", \"kind\": \"backend\", \"short\": \"Calls the Green List Waste Backend for all submission operations.\" },\n            { \"id\": \"api-tracking-client\", \"label\": \"Tracking ID Client\", \"kind\": \"backend\", \"short\": \"Requests unique waste tracking IDs from the Waste Tracking Identity Service.\" },\n            { \"id\": \"api-org-client\", \"label\": \"Organisation Client\", \"kind\": \"backend\", \"short\": \"Reads and updates organisation records via the Waste Organisation Backend.\" }\n          ] },\n          { \"label\": \"4 · Downstream\", \"nodes\": [\n            { \"id\": \"api-backend\", \"label\": \"Green List Waste Backend\", \"kind\": \"platform\", \"short\": \"The main GLW Backend, handling submission operations.\" },\n            { \"id\": \"api-tracking-svc\", \"label\": \"Waste Tracking Identity Service\", \"kind\": \"iface\", \"short\": \"The existing DWT service that mints unique waste tracking IDs.\" },\n            { \"id\": \"api-org-backend\", \"label\": \"Waste Organisation Backend\", \"kind\": \"iface\", \"short\": \"The existing DWT service handling organisation registration.\" }\n          ] }\n        ]\n      }\n    },\n    {\n      \"id\": \"glw-backend\",\n      \"title\": \"Green List Waste Backend\",\n      \"note\": \"Holds the business logic and the data. Two separate entry points feed it: operations from the API, and updates pulled back from DIWASS.\",\n      \"diagram\": {\n        \"hint\": \"Hover or tap any box to read what it does.\",\n        \"liveUrl\": \"c4/view/backend/\",\n        \"legend\": [\n          { \"kind\": \"backend\", \"label\": \"Processing component\" },\n          { \"kind\": \"platform\", \"label\": \"System of record / queue\" }\n        ],\n        \"tiers\": [\n          { \"label\": \"1 · Entry points\", \"nodes\": [\n            { \"id\": \"be-request-handler\", \"label\": \"Request Handler\", \"kind\": \"backend\", \"short\": \"hapi routes/controllers. Entry point for all operations from the GLW API; validates and dispatches to the domain services.\" },\n            { \"id\": \"be-ingest-handler\", \"label\": \"Update Ingest Handler\", \"kind\": \"backend\", \"short\": \"Receives updates pulled back from DIWASS and reconciles them into the stored records.\" }\n          ] },\n          { \"label\": \"2 · Domain logic\", \"nodes\": [\n            { \"id\": \"be-submission-service\", \"label\": \"Submission Service\", \"kind\": \"backend\", \"short\": \"The domain core. Applies business rules for creating and updating green-list-waste submissions.\" }\n          ] },\n          { \"label\": \"3 · Data & delivery\", \"nodes\": [\n            { \"id\": \"be-persistence-repo\", \"label\": \"Persistence Repository\", \"kind\": \"backend\", \"short\": \"Encapsulates all reads/writes to the Green List Waste Persistence store.\" },\n            { \"id\": \"be-queue-publisher\", \"label\": \"Queue Publisher\", \"kind\": \"backend\", \"short\": \"Enqueues submission updates onto the Submission Update Queue for onward delivery to DIWASS.\" }\n          ] },\n          { \"label\": \"4 · Destination\", \"nodes\": [\n            { \"id\": \"be-persistence\", \"label\": \"Green List Waste Persistence\", \"kind\": \"platform\", \"short\": \"The primary data store (MongoDB).\" },\n            { \"id\": \"be-queue\", \"label\": \"Submission Update Queue\", \"kind\": \"platform\", \"short\": \"Buffers outbound submission updates for the Submission Processor.\" }\n          ] }\n        ]\n      }\n    },\n    {\n      \"id\": \"submission-processor\",\n      \"title\": \"Submission Processor\",\n      \"note\": \"Five components, each answering to one of three constraints from the business: updates go one at a time, quickly, and DIWASS never gets hammered when something fails.\",\n      \"diagram\": {\n        \"hint\": \"Hover or tap any box to read what it does.\",\n        \"liveUrl\": \"c4/view/submissionProcessor/\",\n        \"legend\": [\n          { \"kind\": \"platform\", \"label\": \"Queue\" },\n          { \"kind\": \"backend\", \"label\": \"Processing component\" },\n          { \"kind\": \"stream\", \"label\": \"Failure path\" },\n          { \"kind\": \"iface\", \"label\": \"External system\" }\n        ],\n        \"tiers\": [\n          { \"label\": \"1 · Intake\", \"nodes\": [\n            { \"id\": \"sp-queue\", \"label\": \"Submission Update Queue\", \"kind\": \"platform\", \"short\": \"Buffers outbound submission updates so the Backend and DIWASS delivery are decoupled.\" }\n          ] },\n          { \"label\": \"2 · Sequencing\", \"nodes\": [\n            { \"id\": \"sp-listener\", \"label\": \"Queue Listener\", \"kind\": \"backend\", \"short\": \"Consumes exactly one message at a time from the Submission Update Queue - no batching.\" },\n            { \"id\": \"sp-dispatcher\", \"label\": \"Submission Dispatcher\", \"kind\": \"backend\", \"short\": \"The sequencing core. Takes the message handed off by the Queue Listener and drives it through the send flow, one at a time.\" }\n          ] },\n          { \"label\": \"3 · Resilience\", \"nodes\": [\n            { \"id\": \"sp-guard\", \"label\": \"Resilience Guard\", \"kind\": \"backend\", \"short\": \"Wraps every DIWASS Client call with exponential backoff and a circuit breaker, so repeated failures pause sending rather than hammering DIWASS.\" },\n            { \"id\": \"sp-failed\", \"label\": \"Failed Submission Handler\", \"kind\": \"stream\", \"short\": \"When the Resilience Guard exhausts retries on an item, this parks it in a dead-letter store instead of blocking everything behind it.\" }\n          ] },\n          { \"label\": \"4 · Delivery\", \"nodes\": [\n            { \"id\": \"sp-client\", \"label\": \"DIWASS Client\", \"kind\": \"backend\", \"short\": \"Encapsulates the outbound call itself - auth, request/response mapping to DIWASS's protocol.\" }\n          ] },\n          { \"label\": \"5 · Destination\", \"nodes\": [\n            { \"id\": \"sp-diwass\", \"label\": \"DIWASS (EU)\", \"kind\": \"iface\", \"short\": \"The EU's Digital Waste System. Receives one submission update at a time.\" }\n          ] }\n        ]\n      }\n    },\n    {\n      \"id\": \"diwass-update-receiver\",\n      \"title\": \"DIWASS Update Receiver\",\n      \"note\": \"Three components, pull-based rather than event-driven, since DIWASS doesn't notify GLW of changes itself.\",\n      \"diagram\": {\n        \"hint\": \"Hover or tap any box to read what it does.\",\n        \"liveUrl\": \"c4/view/diwassUpdateReceiver/\",\n        \"legend\": [\n          { \"kind\": \"backend\", \"label\": \"Processing component\" },\n          { \"kind\": \"iface\", \"label\": \"External system\" },\n          { \"kind\": \"platform\", \"label\": \"System of record\" }\n        ],\n        \"tiers\": [\n          { \"label\": \"1 · Trigger\", \"nodes\": [\n            { \"id\": \"dr-scheduler\", \"label\": \"DIWASS Scheduler\", \"kind\": \"backend\", \"short\": \"Triggers a check for updates from DIWASS on a fixed 12-hour schedule.\" }\n          ] },\n          { \"label\": \"2 · Pull\", \"nodes\": [\n            { \"id\": \"dr-processor\", \"label\": \"DIWASS Processor\", \"kind\": \"backend\", \"short\": \"Orchestrates the pull - requests via DIWASS Service, then writes changes back to the Backend.\" },\n            { \"id\": \"dr-service\", \"label\": \"DIWASS Service\", \"kind\": \"backend\", \"short\": \"Talks directly to the external DIWASS system to pull the latest update for a record.\" }\n          ] },\n          { \"label\": \"3 · Source\", \"nodes\": [\n            { \"id\": \"dr-diwass\", \"label\": \"DIWASS (EU)\", \"kind\": \"iface\", \"short\": \"The EU's Digital Waste System - the source of truth this integration polls.\" }\n          ] },\n          { \"label\": \"4 · Write-back\", \"nodes\": [\n            { \"id\": \"dr-api\", \"label\": \"Green List Waste Backend\", \"kind\": \"platform\", \"short\": \"The main GLW Backend. Receives the update DIWASS Processor writes back after a successful pull.\" }\n          ] }\n        ]\n      }\n    }\n  ],\n  \"sources\": \"GLW technical architect working diagrams (drawio, C4 model) · Discovery conversations on the DIWASS integration, July 2026. Provisional and to be validated.\"\n}\n","recommendations.json":"{\n  \"kicker\": \"Recommendations\",\n  \"standfirst\": \"Each recommendation from the [[research playback]], paired with the evidence that supports it and the policy outcomes it moves us towards.\",\n  \"outcomesAnchor\": \"#policy-intent\",\n  \"headings\": {\n    \"ref\": \"Ref\",\n    \"recommend\": \"We recommend (riskiest assumptions)\",\n    \"evidence\": \"Because the evidence indicates\",\n    \"outcomes\": \"Policy outcomes supported\"\n  },\n  \"recommendations\": [\n    {\n      \"ref\": \"R1\",\n      \"recommend\": \"Test the extent and causes of waste misclassification during alpha, including where in the process classification decisions are made and validated.\",\n      \"evidence\": \"Uncertainty remains about the scale of, and reasons for, misclassification and its impact on compliance, data quality and regulatory oversight. Further research is needed to determine whether service interventions could reduce classification errors.\",\n      \"outcomes\": [\n        \"Waste is correctly classified\",\n        \"Environmental harm is prevented\",\n        \"Regulators can detect non-compliance\"\n      ]\n    },\n    {\n      \"ref\": \"R2\",\n      \"recommend\": \"Test the expanded DIWASS Annex VII with operators and regulators across all four UK nations, to understand the disruption and additional burden it may create and determine whether it is a viable solution.\",\n      \"evidence\": \"Significant changes to the familiar Annex VII structure, and to the information people are required to provide, could affect usability, compliance and adoption. Testing is needed to understand whether the wider requirements are proportionate and workable before committing to this approach.\",\n      \"outcomes\": [\n        \"Waste movements are traceable\",\n        \"Waste movement information supports circular economy goals\"\n      ]\n    },\n    {\n      \"ref\": \"R3\",\n      \"recommend\": \"Provide API development and integration support for all operators looking to export waste, and test integration with DIWASS.\",\n      \"evidence\": \"We must remove friction and manual re-entry, and reduce operational burden for operators. Providing API access for all actors will let us test two things: first, how technologically mature operators respond to integrating, through a software vendor or otherwise, and possible disruption; second, how less technologically mature operators approach integration, and whether it is feasible for them.\",\n      \"outcomes\": [\n        \"Waste movements are traceable\",\n        \"Regulators can detect non-compliance\",\n        \"Legitimate recovery is enabled\"\n      ]\n    },\n    {\n      \"ref\": \"R4\",\n      \"recommend\": \"Test whether single or shared ownership of the Annex VII record is the most appropriate approach.\",\n      \"evidence\": \"Multiple actors contribute information at different stages of the waste movement, and the ownership approach could affect accountability, quality, completion and accuracy throughout the movement journey.\",\n      \"outcomes\": [\n        \"Waste movements are traceable\",\n        \"Waste movement information supports circular economy goals\"\n      ]\n    },\n    {\n      \"ref\": \"R5\",\n      \"recommend\": \"Investigate how, and if, verified information about facilities, licences and destinations could be captured and reused across the industry.\",\n      \"evidence\": \"Operators repeatedly undertake the same due-diligence checks, creating avoidable effort and inconsistency without necessarily improving regulatory assurance.\",\n      \"outcomes\": [\n        \"Legitimate recovery is enabled\",\n        \"Environmental harm is prevented\",\n        \"Regulators can detect non-compliance\"\n      ]\n    }\n  ],\n  \"note\": \"Source: GLW Alpha research playback cards (recommendations in green, policy outcomes in purple), compiled 23 July 2026. Outcome tags link back to Policy Intent and Outcomes. Provisional, to be finalised at the close of discovery.\"\n}\n","alpha-plan.json":"{\n  \"kicker\": \"The next phase\",\n  \"title\": \"The Alpha Plan\",\n  \"window\": \"July - October 2026\",\n  \"standfirst\": \"Discovery answered whether to build. Alpha answers whether it will work. Over four months we validate the preferred end-to-end service and retire the policy, user, technical and data risks that still stand between us and a confident Beta decision.\",\n  \"goal\": {\n    \"label\": \"Alpha goal\",\n    \"statement\": \"Validate the preferred end-to-end Green List Waste service and reduce the remaining policy, user, operational, technical and data risks enough to make an informed, evidence-based decision to proceed to Beta.\"\n  },\n  \"objectivesLead\": \"What Alpha sets out to prove\",\n  \"objectives\": [\n    {\n      \"title\": \"Validate preferred service models and end-to-end operational handovers\",\n      \"body\": \"Factoring in Must Experiments 2 and 6: simulate end-to-end shipment journeys across all actors to prove how expanded record processes operate in practice, and test how the service handles real-world exceptions, missing data and late journey changes.\"\n    },\n    {\n      \"title\": \"Identify and eliminate the root causes of waste misclassification\",\n      \"body\": \"Factoring in Must Experiment 1: trace real classification decisions directly with operators and regulators to understand exactly where, how and why waste is misclassified along the user journey.\"\n    },\n    {\n      \"title\": \"Prove API integration feasibility and adoption across all operator maturity tiers\",\n      \"body\": \"Factoring in Must Experiments 3 and 4: run direct technical integration tests with digitally mature operators and software providers, while simultaneously testing support mechanisms and intermediary routes to ensure less digitally mature operators can also adopt API workflows.\"\n    },\n    {\n      \"title\": \"Prove international technical integration feasibility with DIWASS\",\n      \"body\": \"Factoring in Must Experiment 5: establish technical integration requirements and evaluate the feasibility, data flows and system impacts of connecting directly with DIWASS.\"\n    },\n    {\n      \"title\": \"Validate policy feasibility, expanded data requirements and cross-regulator alignment\",\n      \"body\": \"Factoring in Must Experiments 1, 2 and 5: evaluate whether expanded data records and international exchange requirements remain policy-feasible across all UK regulators without disrupting compliant waste movements.\"\n    },\n    {\n      \"title\": \"Establish a credible Beta business case based on operational and technical viability\",\n      \"body\": \"Factoring in Must Experiments 2, 3, 4 and 6: use direct findings from end-to-end simulations, exception handling and API adoption testing to prove service value and reduce implementation risks for Beta.\"\n    },\n    {\n      \"title\": \"Produce a prioritised Beta backlog and delivery roadmap\",\n      \"body\": \"Factoring in Must Experiments 1 to 6: synthesise the core findings from all mandatory experiments into a concrete, risk-assessed execution plan for the Beta phase.\"\n    }\n  ],\n  \"timelineLead\": \"Indicative 12-week roadmap\",\n  \"months\": [\n    \"Jul\",\n    \"Aug\",\n    \"Sep\",\n    \"Oct\"\n  ],\n  \"phases\": [\n    {\n      \"id\": \"align\",\n      \"name\": \"Align and Mobilise\",\n      \"focus\": \"Confirm scope, hypotheses and success measures\",\n      \"start\": 3,\n      \"span\": 1,\n      \"items\": [\n        \"Align on GDS standards coverage from the Discovery output\",\n        \"Confirm scope, hypotheses and success measures\",\n        \"Plan the research\"\n      ]\n    },\n    {\n      \"id\": \"explore\",\n      \"name\": \"Explore\",\n      \"focus\": \"Reduce the remaining uncertainties\",\n      \"start\": 4,\n      \"span\": 3,\n      \"items\": [\n        \"Reduce remaining uncertainties about users through focused research\",\n        \"Validate the end-to-end journey\",\n        \"Prototype service options and run technical spikes\",\n        \"Explore the data model\"\n      ]\n    },\n    {\n      \"id\": \"validate\",\n      \"name\": \"Validate\",\n      \"focus\": \"Test, iterate and refine with users and regulators\",\n      \"start\": 5,\n      \"span\": 3,\n      \"items\": [\n        \"Test with users and regulators, then iterate and refine the preferred approach\",\n        \"Validate the policy across all four regulators\",\n        \"Model the benefits\"\n      ]\n    },\n    {\n      \"id\": \"prepare\",\n      \"name\": \"Prepare for Private Beta\",\n      \"focus\": \"Agree Private Beta scope and go to assessment\",\n      \"start\": 7,\n      \"span\": 2,\n      \"items\": [\n        \"Set out the recommendations\",\n        \"Agree the scope, roadmap and delivery approach for Private Beta\",\n        \"Complete the Alpha assessment\"\n      ]\n    }\n  ],\n  \"outputsLead\": \"By the end of Alpha we expect to have\",\n  \"outputs\": [\n    \"A validated service design\",\n    \"Tested user journeys and prototypes\",\n    \"An agreed technical and data approach\",\n    \"Reduced delivery risks\",\n    \"A prioritised Beta backlog\",\n    \"Evidence to support a Beta investment decision\"\n  ],\n  \"exitLead\": \"Alpha exit criteria\",\n  \"exitStandfirst\": \"The service only progresses to Beta if every gate is met.\",\n  \"exitCriteria\": [\n    {\n      \"area\": \"User need\",\n      \"test\": \"Clear evidence of user demand\"\n    },\n    {\n      \"area\": \"Policy\",\n      \"test\": \"Regulatory alignment is achievable\"\n    },\n    {\n      \"area\": \"Service\",\n      \"test\": \"A preferred service model is identified\"\n    },\n    {\n      \"area\": \"Technical\",\n      \"test\": \"The architecture is proven feasible\"\n    },\n    { /* ---------------- BLUEPRINT LINK (preview) ----------------
   Shared by the blueprint and journey previews. The stage chain shows
   every stage the data declares: arrows read it as a sequence, or set
   `numberStages` for a numbered grid, which is what long journeys
   need. `note`, `stagesLabel` and `aboutUsers` are optional, so the
   blueprint preview renders exactly as before without them. */
function renderBlueprintLink(band, s, payload, { emphasise }) {
  const d = payload.data || {};
  const stages = d.stages || [];
  const numbered = !!d.numberStages;
  const nodes = stages.map(
    (st, i) =>
      `<div class="seq-node">
        ${numbered ? `<span class="seq-num">${i + 1}</span>` : ""}
        <span class="seq-tier">${escapeHtml(st.label || st.id || "")}</span>
        <span class="seq-name">${escapeHtml((st.steps && st.steps[0] && st.steps[0].label) || "")}</span>
      </div>`
  );
  const chain = numbered
    ? nodes.join("")
    : nodes.join('<span class="seq-arrow" aria-hidden="true">→</span>');
  const sub = (label, text) =>
    text
      ? `${label ? `<h3 class="bp-sub">${escapeHtml(label)}</h3>` : ""}<p>${emphasise(text)}</p>`
      : "";
  /* `previewStages` is a summary of the blueprint in its own right,
     independent of the `stages` that build the grid on the standalone
     page. Each carries a `tone` so the shading the legend describes is
     actually visible rather than merely asserted. */
  const ps = d.previewStages || [];
  /* `showStages: false` drops the chain entirely, for a preview that
     leads on prose. `stages` still drives the grid on the standalone
     page, so it is never the thing to delete. */
  const stageCards = d.showStages === false
    ? ""
    : ps.length
    ? `<ol class="bps-grid">
        ${ps
          .map(
            (st, i) => `<li class="bps-node${st.tone ? ` is-${escapeAttr(st.tone)}` : ""}">
              <span class="bps-n">${i + 1}</span>
              <span class="bps-label">${escapeHtml(st.label || "")}</span>
              ${st.body ? `<p class="bps-body">${emphasise(st.body)}</p>` : ""}
              ${st.actors ? `<span class="bps-actors">${escapeHtml(st.actors)}</span>` : ""}
            </li>`
          )
          .join("")}
      </ol>`
    : `<div class="seq-chain${numbered ? " seq-chain--grid" : ""}" aria-hidden="true">${chain}</div>`;
  const legend = (d.legend || []).length
    ? `<ul class="bps-legend">${(d.legend || [])
        .map(
          (l) =>
            `<li class="bps-key${l.tone ? ` is-${escapeAttr(l.tone)}` : ""}"><span class="bps-swatch" aria-hidden="true"></span>${emphasise(l.text || "")}</li>`
        )
        .join("")}</ul>`
    : "";
  const exc = d.exceptions
    ? `<div class="bps-exc">
        ${d.exceptions.label ? `<span class="bps-exc-lab">${escapeHtml(d.exceptions.label)}</span>` : ""}
        ${d.exceptions.text ? `<p>${emphasise(d.exceptions.text)}</p>` : ""}
      </div>`
    : "";
  const statements = (d.statements || []).length
    ? `<ul class="bps-says">${(d.statements || [])
        .map((t) => `<li>${emphasise(t)}</li>`)
        .join("")}</ul>`
    : "";
  band.innerHTML = `<div class="wrap">
    ${head(d.kicker || "Service landscape", s.title, "", emphasise)}
    <div class="bp-link bp-link--stack reveal">
      <div class="blurb">
        ${sub(
          d.overviewLabel,
          d.previewBlurb || "A service blueprint for the most common green-list export journey."
        )}
        ${d.note ? `<p class="bp-note">${emphasise(d.note)}</p>` : ""}
        ${d.stagesLabel ? `<h3 class="bp-sub">${escapeHtml(d.stagesLabel)}</h3>` : ""}
        ${stageCards}
        ${legend}
        ${exc}
        ${statements}
        ${sub(d.aboutUsersLabel, d.aboutUsers)}
        <div class="bp-actions">
          <a class="btn" href="${escapeAttr(d.href || "service-blueprint.html")}">${escapeHtml(
            d.linkLabel || "Open the service blueprint"
          )} →</a>
          ${(d.links || []).map(blockLink).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

  tiers.forEach((t) => (t.nodes || []).forEach((n) => (lookup[n.id] = n)));

    .map(

/* ---------------- ALPHA PLAN LINK (goal + timeline + link) ---------------- */
/* Mirrors the gantt on alpha-plan.html. `unitsPerMonth` splits each
   month into finer columns so a phase can start or end mid-month, and
   `bands` are the statement-of-work spans sitting above the phases. */
function alphaGanttHtml(d) {
  const months = Array.isArray(d.months) ? d.months : [];
  const phases = Array.isArray(d.phases) ? d.phases : [];
  const per = Math.max(1, Number(d.unitsPerMonth) || 1);
  const cols = (months.length || 6) * per;
  const head = months
    .map((m) => `<span style="grid-column:span ${per}">${escapeHtml(m)}</span>`)
    .join("");
  const bar = (item, cls) => {
    const start = Math.max(1, Number(item.start) || 1);
    const span = Math.max(1, Number(item.span) || 1);
    return `<div class="gantt-row" style="grid-template-columns:repeat(${cols},1fr)">
      <div class="${cls}${span / per < 1 ? " is-narrow" : ""} p-${escapeAttr(item.id || "")}" style="grid-column:${start} / span ${span}">
        <span class="gb-name">${escapeHtml(item.name || "")}</span>
        ${item.focus ? `<span class="gb-focus">${escapeHtml(item.focus)}</span>` : ""}
      </div>
    </div>`;
  };
  const bands = (Array.isArray(d.bands) ? d.bands : []).map((b) => bar(b, "gband")).join("");
  const rows = phases.map((p) => bar(p, "gbar")).join("");
  return `<div class="gantt" role="img" aria-label="${escapeAttr(
    d.timelineAlt || `Alpha timeline across ${months.length} months with staggered phases`
  )}">
    <div class="gantt-months" style="grid-template-columns:repeat(${cols},1fr)">${head}</div>
    ${bands ? `<div class="gantt-bands">${bands}</div>` : ""}
    <div class="gantt-rows">${rows}</div>
  </div>`;
}

/* ---------------- TABLE (multi-column table with a graceful empty state) ----------------
   A cell may be a string or an array (rendered as a bullet list). With no
   rows the table shows its columns and a "content to follow" placeholder. */
function renderTable(band, s, payload, { emphasise }) {
  const d = payload.data || {};
  const cols = d.columns || [];
  const rows = d.rows || [];
  const cell = (c) =>
    Array.isArray(c)
      ? `<ul>${c.map((x) => `<li>${emphasise(String(x))}</li>`).join("")}</ul>`
      : emphasise(String(c == null ? "" : c));
  band.innerHTML = `<div class="wrap">
    ${head(d.kicker, s.title, d.standfirst, emphasise)}
    <div class="data-table-wrap reveal">
      <table class="data-table">
        <thead><tr>${cols.map((c) => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
        <tbody>
          ${
            rows.length
              ? rows
                  .map((r) => {
                    /* a `group` row is a full-width banner, standing in
                       for a first column merged across the rows below */
                    if (!Array.isArray(r) && r.group) {
                      return `<tr class="dt-group"><td colspan="${cols.length || 1}">${emphasise(
                        r.group
                      )}</td></tr>`;
                    }
                    const cells = Array.isArray(r) ? r : r.cells || [];
                    return `<tr>${cells
                      .map((c, i) => `<td data-col="${escapeAttr(cols[i] || "")}">${cell(c)}</td>`)
                      .join("")}</tr>`;
                  })
                  .join("")
              : `<tr class="dt-empty"><td colspan="${cols.length || 1}">${escapeHtml(
                  d.emptyText || "Content to follow."
                )}</td></tr>`
          }
        </tbody>
      </table>
    </div>
    ${d.note ? `<p class="section-note">${escapeHtml(d.note)}</p>` : ""}
  </div>`;
}

/* ---------------- FIGURE (lead text, an embedded diagram, optional strip and callout) ----------------
   Carries a source diagram as an inlined image (data URI, so it survives
   the HTML-only deploy). Text stays real text for accessibility. */
function renderFigure(band, s, payload, { emphasise }) {
  const d = payload.data || {};
  const lead = (d.lead || [])
    .map((p, i) => `<p class="fig-lead${i === 0 && d.leadStrong !== false ? " is-strong" : ""}">${emphasise(p)}</p>`)
    .join("");
  const strip = (d.steps || []).length
    ? `<div class="fig-strip" role="list">
        ${d.steps
          .map(
            (st, i) =>
              `${i ? `<span class="fig-arrow" aria-hidden="true">→</span>` : ""}
              <div class="fig-step" role="listitem">
                <span class="fig-sn">${escapeHtml(st.label || "")}</span>
                ${st.body ? `<span class="fig-sb">${escapeHtml(st.body)}</span>` : ""}
              </div>`
          )
          .join("")}
      </div>`
    : "";
  const img =
    d.image && d.image.src
      ? `<figure class="fig-media${d.image.scroll ? " is-scroll" : ""}">
          <div class="fig-media-view">
            <img src="${escapeAttr(d.image.src)}" alt="${escapeAttr(d.image.alt || "")}" loading="lazy" />
          </div>
          ${
            d.image.caption
              ? `<figcaption>${
                  d.image.href
                    ? `<a href="${escapeAttr(d.image.href)}">${escapeHtml(d.image.caption)}</a>`
                    : escapeHtml(d.image.caption)
                }</figcaption>`
              : ""
          }
        </figure>`
      : "";
  const c = d.callout;
  const callout = c
    ? `<div class="fig-callout">
        ${c.title ? `<h3>${emphasise(c.title)}</h3>` : ""}
        ${(c.points || []).length ? `<ul>${(c.points || []).map((p) => `<li>${emphasise(p)}</li>`).join("")}</ul>` : ""}
        ${c.source ? `<a class="fig-src" href="${escapeAttr(c.source.href || "#")}">${escapeHtml(c.source.label || "Source")}</a>` : ""}
      </div>`
    : "";
  band.innerHTML = `<div class="wrap">
    ${head(d.kicker, s.title, d.standfirst, emphasise)}
    ${lead}
    ${strip}
    ${img}
    ${callout}
    ${contentBlocks(d.blocks, emphasise)}
    ${d.note ? `<p class="section-note">${escapeHtml(d.note)}</p>` : ""}
  </div>`;
}

/* A block link either navigates to another page (`href`) or opens a
   diagram in the lightbox (`image`). The lightbox variant is a button,
   not an anchor, because it goes nowhere. */
function blockLink(l) {
  const status = l.status ? `<span class="fig-tbc">${escapeHtml(l.status)}</span>` : "";
  const label = escapeHtml(l.label || "Open");
  if (l.image) {
    return `<button type="button" class="fig-link is-modal"
      data-figmodal="${escapeAttr(l.image)}"
      data-figcaption="${escapeAttr(l.caption || l.label || "")}"
      data-figalt="${escapeAttr(l.alt || l.label || "")}">${label}${status}
      <svg class="fig-expand" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 1.5H12.5V5.5M5.5 12.5H1.5V8.5M12.5 1.5 8 6M1.5 12.5 6 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>`;
  }
  return `<a class="fig-link" href="${escapeAttr(l.href || "#")}">${label}${status}
    <span aria-hidden="true">→</span></a>`;
}

/* ---------------- CONTENT BLOCKS (shared) ----------------
   Labelled prose cards, each able to carry a highlighted value line
   and links out to the standalone diagram pages. A link may declare a
   `status` chip for targets that are not settled yet. Used by the
   figure and appendix-link section types. */
function contentBlocks(blocks, emphasise) {
  const list = (blocks || [])
    .map(
      (bk) => `<section class="fig-block">
        ${bk.label ? `<h3 class="fig-blab">${escapeHtml(bk.label)}</h3>` : ""}
        ${(bk.body || []).map((p) => `<p>${emphasise(p)}</p>`).join("")}
        ${
          bk.value
            ? `<div class="fig-value">
                ${bk.value.label ? `<span class="fig-vlab">${escapeHtml(bk.value.label)}</span>` : ""}
                ${bk.value.body ? `<p>${emphasise(bk.value.body)}</p>` : ""}
              </div>`
            : ""
        }
        ${
          (bk.links || []).length
            ? `<div class="fig-links">${(bk.links || []).map(blockLink).join("")}</div>`
            : ""
        }
      </section>`
    )
    .join("");
  return list ? `<div class="fig-blocks">${list}</div>` : "";
}

/* ---------------- OBSERVATIONS (collapsible themes) ----------------
   Each theme collapses to a headline insight and expands to the detail
   behind it, so the whole picture is scannable before it is read. A
   standard disclosure pattern: a button owns aria-expanded and controls
   its region. Wiring lives in viz.js so it runs after the band mounts. */
/* one finding: a headline and its bullets; a bullet may carry sub-points */
function obsBlock(o, emphasise) {
  const points = (o.points || [])
    .map((p) => {
      const text = typeof p === "string" ? p : p.text || "";
      const sub = (typeof p === "object" && p.sub) || [];
      return `<li>${emphasise(text)}${
        sub.length ? `<ul class="obs-sub">${sub.map((x) => `<li>${emphasise(x)}</li>`).join("")}</ul>` : ""
      }</li>`;
    })
    .join("");
  return `<div class="obs-o">
    ${o.title ? `<h4>${emphasise(o.title)}</h4>` : ""}
    ${o.body ? `<p>${emphasise(o.body)}</p>` : ""}
    ${points ? `<ul class="obs-points">${points}</ul>` : ""}
  </div>`;
}

/* a side-by-side read of how the same rules land in different contexts */

    <div class="octx-cols" style="--octx-cols:${cols.length || 1}">
      ${cols
        .map(
          (col) => `<div class="octx-col tone-${escapeAttr(col.tone || "neutral")}">
            <div class="octx-head">

            </div>
            <div class="octx-body">
              ${col.items ? list(col.items) : ""}
              ${(col.groups || [])
                .map(

                    ${list(g.items)}
                  </div>`
                )
                .join("")}
            </div>
            ${col.quote ? `<blockquote class="octx-quote">${escapeHtml(col.quote)}</blockquote>` : ""}
            ${
              col.verdict
                ? `<div class="octx-verdict">
                    <span class="octx-vlab">${escapeHtml(col.verdict.label || "")}</span>
                    ${col.verdict.body ? `<span class="octx-vbody">${escapeHtml(col.verdict.body)}</span>` : ""}
                  </div>`
                : ""
            }
          </div>`
        )
        .join("")}
    </div>
    ${
      c.shapers
        ? `<div class="octx-shapers">
            <span class="octx-slab">${escapeHtml(c.shapers.label || "Context shapers")}</span>
            <ul>${(c.shapers.items || []).map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
            ${c.shapers.note ? `<p class="octx-snote">${emphasise(c.shapers.note)}</p>` : ""}
          </div>`
        : ""
    }
  </div>`;
}

/* a chain: where the flow is digital and where it drops to paper */
function obsFlow(f, emphasise) {
  const steps = f.steps || [];
  const cap = (m, cls) =>
    m ? `<div class="oflow-cap ${cls}"><span>${escapeHtml(m.label || "")}</span></div>` : "";
  return `<div class="obs-flow">
    ${f.title ? `<h4 class="oflow-h">${emphasise(f.title)}</h4>` : ""}
    ${f.standfirst ? `<p class="oflow-stand">${emphasise(f.standfirst)}</p>` : ""}
    <div class="oflow-chain">
      ${cap(f.start, "is-start")}
      ${steps
        .map(
          (st, i) => `${i || f.start ? `<span class="oflow-arrow" aria-hidden="true">→</span>` : ""}
          <div class="oflow-step${st.friction ? " is-friction" : ""}">
            <span class="oflow-n">${escapeHtml(st.n || String(i + 1))}</span>
            <span class="oflow-name">${escapeHtml(st.name || "")}</span>
            ${st.body ? `<span class="oflow-body">${escapeHtml(st.body)}</span>` : ""}
            ${
              (st.items || []).length
                ? `<ul class="oflow-items">${st.items.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`
                : ""
            }
          </div>`
        )
        .join("")}
      ${f.end ? `<span class="oflow-arrow" aria-hidden="true">→</span>${cap(f.end, "is-end")}` : ""}
    </div>
    ${f.note ? `<p class="oflow-note">${emphasise(f.note)}</p>` : ""}
    ${
      (f.panels || []).length
        ? `<div class="oflow-panels" style="--ofp-cols:${f.panels.length}">
            ${f.panels
              .map(
                (p) => `<div class="oflow-panel tone-${escapeAttr(p.tone || "neutral")}">
                  <span class="ofp-lab">${escapeHtml(p.label || "")}</span>
                  <ul>${(p.items || []).map((x) => `<li>${emphasise(x)}</li>`).join("")}</ul>
                </div>`
              )
              .join("")}
          </div>`
        : ""
    }
  </div>`;
}

/* Stacked labelled tiers inside a theme, reusing the taxonomy layout
   so an archetype breakdown can sit alongside the other findings. */
function obsTiers(tiers) {
  return `<div class="tx-tiers obs-tiers">

                  ${it.body ? `<span class="tx-body">${escapeHtml(it.body)}</span>` : ""}
                </div>`
              )
              .join("")}
          </div>
        </div>`

      .join("")}

}

function renderObservations(band, s, payload, { emphasise }) {

        .map((t, i) => {

/* ---------------- TAXONOMY (a lead finding, then stacked tiers of items) ----------------

function panelTable(t) {

function panelCard(p, emphasise, h) {

function panelGrid(panels, cols, emphasise, h, cls) {

const CHEVRON = `<svg class="pn-gchev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* A group is either a static labelled band or, when the section sets
   `collapsible`, a disclosure: the label becomes the button and the
   grid moves into the region it controls. Open state comes from the
   group's `open` flag, so a long section can arrive mostly folded. */
function panelGroup(g, i, sid, collapsible, dCols, emphasise) {
  const gid = escapeAttr(g.id || `${sid}-g${i + 1}`);
  const panels = g.panels || [];
  const inner = `${g.intro ? `<p class="pn-gintro">${emphasise(g.intro)}</p>` : ""}
    ${panelGrid(panels, g.columns || dCols, emphasise, 4)}`;
  if (!collapsible) {
    return `<section class="pn-group">
      ${g.label ? `<h3 class="pn-glab">${escapeHtml(g.label)}</h3>` : ""}
      ${inner}
    </section>`;
  }
  const open = g.open !== false;
  return `<section class="pn-group${open ? " is-open" : ""}">
    <h3 class="pn-gh">
      <button type="button" class="pn-gbtn" id="pn-btn-${gid}" aria-expanded="${open}" aria-controls="pn-p-${gid}">
        <span class="pn-glab-t">${escapeHtml(g.label || "")}</span>
        <span class="pn-gcount">${panels.length}</span>
        ${CHEVRON}
      </button>
    </h3>
    <div class="pn-gpanel" id="pn-p-${gid}" role="region" aria-labelledby="pn-btn-${gid}"${open ? "" : " hidden"}>
      <div class="pn-ginner">${inner}</div>
    </div>

}

/* Two data shapes. A flat `panels` array renders one grid. A `groups`
   array renders labelled bands stacked down the section, each with its
   own grid, so one section can hold more than one kind of panel. */
function renderPanels(band, s, payload, { emphasise }) {
  const d = payload.data || {};
  const groups = Array.isArray(d.groups) ? d.groups : null;
  const collapsible = !!(groups && d.collapsible);
  const body = groups
    ? `<div class="pn-groups reveal${collapsible ? " is-collapsible" : ""}"${collapsible ? " data-pn-groups" : ""}>

            ? `<div class="pn-bar">

            : ""
        }
        ${groups
          .map((g, i) => panelGroup(g, i, s.id || "pn", collapsible, d.columns, emphasise))

    : panelGrid(d.panels || [], d.columns, emphasise, 3, "reveal");
  band.innerHTML = `<div class="wrap">

/* ---------------- PLACEHOLDER (explicit "coming soon" outline item) ---------------- */
